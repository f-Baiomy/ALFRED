<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alfred · Logs Explorer - UX mock</title>
<!--
  UX approval mock for specs/004-logs-explorer. Self-contained: no build, no network.
  Uses Alfred's theme tokens (same palette as specs/003-relive-cycle/mock.html) so it reads like the real app.
  All data is generated in this file (~600 lines, 3 grouping levels plus edge cases). Nothing is sent anywhere.
-->
<style>
:root{
  --bg:#0a0e2a; --nav:#11163d; --card:#141a45; --card-2:#101636; --inner:#070a24; --pop:#161c4a;
  --border:rgba(139,92,246,.22); --border-s:rgba(139,92,246,.45);
  --purple:#8b5cf6; --purple-l:#c4b5fd; --cyan:#22d3ee; --green:#34d399; --amber:#fbbf24; --red:#f87171; --orange:#fb923c;
  --text:#e5e9f5; --dim:#93a0c2; --faint:#5c6690;
  --l-error:#f87171; --l-warn:#fbbf24; --l-info:#38bdf8; --l-debug:#5c6690;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:13px/1.45 'Segoe UI',system-ui,sans-serif;background:radial-gradient(ellipse at top,#131a4a 0%,#0a0e2a 55%);color:var(--text);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--inner);border:1px solid var(--border-s);border-radius:8px;padding:5px 8px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
select{padding:4px 6px}
.mono{font-family:Consolas,'Cascadia Mono',monospace}
.faint{color:var(--faint)} .dim{color:var(--dim)}
.row{display:flex;align-items:center;gap:8px} .sp{flex:1}
mark{background:rgba(251,191,36,.35);color:#fff;border-radius:2px;padding:0 1px}
/* banner + nav */
.mockbar{display:flex;gap:10px;align-items:center;padding:6px 16px;background:#2a1a55;color:var(--purple-l);font-size:12px;border-bottom:1px solid var(--border-s);flex-wrap:wrap}
.mockbar b{color:#fff}
.mockbar button{border:1px solid var(--border-s);border-radius:6px;padding:2px 8px}
.mockbar button.on{background:var(--purple);color:#fff}
.nav{display:flex;align-items:center;gap:4px;padding:0 24px;background:linear-gradient(120deg,#1a1247,#0f1438 60%,#1a1247);border-bottom:1px solid var(--border-s)}
.nav a{padding:12px 14px;color:var(--dim);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;cursor:pointer}
.nav a.on{color:var(--purple-l);border-bottom-color:var(--purple)}
.nav .new{font-size:10px;background:var(--purple);color:#fff;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.page{max-width:1500px;margin:0 auto;padding:16px 20px 60px}
h1{font:700 19px Montserrat,'Segoe UI',sans-serif;margin:0}
h2{font:700 15px Montserrat,'Segoe UI',sans-serif;margin:0}
h3{font:700 13px 'Segoe UI',sans-serif;margin:0 0 6px}
.sub{color:var(--dim);margin-top:2px}
/* generic */
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:9px;border:1px solid var(--border-s);background:var(--card);font-weight:600;white-space:nowrap}
.btn:hover{background:#1c2358}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.sm{padding:3px 9px;border-radius:7px;font-size:12px}
.btn.xs{padding:1px 7px;border-radius:6px;font-size:11px;font-weight:600}
.btn.on{background:rgba(139,92,246,.3);border-color:var(--purple)}
.card{background:linear-gradient(160deg,#141a45,#101636);border:1px solid var(--border);border-radius:14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap}
.p-ok{color:var(--green);border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.1)}
.p-live{color:var(--cyan);border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.1)}
.p-wait{color:var(--dim);border-color:var(--border);background:rgba(148,163,194,.1)}
.p-warn{color:var(--amber);border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.1)}
.p-fail{color:var(--red);border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.12)}
.seg{display:inline-flex;border:1px solid var(--border-s);border-radius:8px;overflow:hidden}
.seg button{padding:3px 10px;font-size:12px;font-weight:600;color:var(--dim)}
.seg button.on{background:rgba(139,92,246,.35);color:#fff}
.ty{display:inline-block;width:18px;text-align:center;font-family:Consolas,monospace;font-size:11px;color:var(--faint)}
.hint{font-size:11px;color:var(--faint)}
.lvl{display:inline-block;font-size:10.5px;font-weight:700;border-radius:5px;padding:0 6px;border:1px solid}
.lvl.ERROR{color:var(--l-error);border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.12)}
.lvl.WARN{color:var(--l-warn);border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.1)}
.lvl.INFO{color:var(--l-info);border-color:rgba(56,189,248,.4);background:rgba(56,189,248,.08)}
.lvl.DEBUG{color:var(--dim);border-color:var(--border)}
/* sources */
.src{padding:14px 16px;margin-bottom:12px;cursor:pointer}
.src:hover{border-color:var(--border-s)}
.inp{display:grid;grid-template-columns:22px minmax(0,1fr) 190px 100px 60px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--border);font-size:12px}
/* wizard */
.steps{display:flex;gap:6px;margin:12px 0}
.steps div{flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:10px;color:var(--dim);font-weight:600;cursor:pointer}
.steps div.on{border-color:var(--purple);color:#fff;background:rgba(139,92,246,.18)}
.kinds{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kind{padding:12px;border:1px solid var(--border);border-radius:12px;cursor:pointer}
.kind.on{border-color:var(--purple);background:rgba(139,92,246,.15)}
.kind b{display:block;margin:4px 0 2px}
.form{display:grid;grid-template-columns:170px minmax(0,1fr);gap:8px 12px;align-items:center;margin-top:14px;max-width:820px}
.ftab{width:100%;border-collapse:collapse;table-layout:fixed}
.ftab th,.ftab td{padding:5px 6px;border-bottom:1px solid var(--border);text-align:left;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
.ftab th{color:var(--faint);font-weight:600;font-size:11px}
.ftab select,.ftab input{width:100%;font-size:12px;padding:3px 5px}
.lvrow{display:grid;grid-template-columns:70px minmax(0,1fr) 170px 110px 70px;gap:8px;align-items:center;margin-bottom:6px}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:1px 6px;background:rgba(139,92,246,.25);color:var(--purple-l);text-align:center}
.prog{height:10px;border-radius:6px;background:var(--inner);border:1px solid var(--border);overflow:hidden}
.prog div{height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan))}
/* explorer */
.qbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--border-s);border-radius:10px;background:var(--inner);position:relative}
.qp{display:inline-flex;align-items:center;gap:4px;font-family:Consolas,monospace;font-size:12px;padding:1px 8px;border-radius:7px;border:1px solid}
.qp.eq{color:#a5b4fc;border-color:rgba(165,180,252,.45);background:rgba(165,180,252,.1)}
.qp.neq{color:var(--red);border-color:rgba(248,113,113,.45);background:rgba(248,113,113,.1)}
.qp.ex,.qp.nex{color:var(--green);border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.08)}
.qp.text{color:var(--amber);border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.08)}
.qp.gt,.qp.lt,.qp.time{color:var(--cyan);border-color:rgba(34,211,238,.4);background:rgba(34,211,238,.08)}
.qp .x{cursor:pointer;opacity:.7}
.qin{flex:1;min-width:200px;border:none;background:none;font-family:Consolas,monospace;font-size:12px;padding:3px}
.ac{position:absolute;left:8px;top:100%;margin-top:4px;z-index:30;min-width:360px;background:var(--pop);border:1px solid var(--border-s);border-radius:10px;padding:4px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
.ac div{padding:4px 8px;border-radius:6px;cursor:pointer;font-family:Consolas,monospace;font-size:12px;display:flex;justify-content:space-between;gap:16px}
.ac div:hover,.ac div.on{background:rgba(139,92,246,.25)}
.hist{display:flex;align-items:flex-end;gap:2px;height:64px;margin-top:10px;user-select:none;cursor:crosshair}
.hist .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;border-radius:2px}
.hist .b.sel{background:rgba(139,92,246,.25)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0 8px}
.grid{display:grid;grid-template-columns:230px minmax(0,1fr);gap:12px}
.grid.dr{grid-template-columns:230px minmax(0,1fr) 400px}
.side{max-height:690px;overflow:auto;padding-right:4px}
.fld{border-bottom:1px solid var(--border);padding:5px 2px}
.fld .nm{display:flex;align-items:center;gap:4px;cursor:pointer;font-size:12px}
.fld .nm:hover{color:var(--purple-l)}
.fld .vals{margin:3px 0 2px 22px}
.vrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;font-size:11.5px;color:var(--dim);padding:1px 4px;border-radius:5px}
.vrow:hover{background:rgba(139,92,246,.12)}
.vrow .acts{visibility:hidden;display:flex;gap:2px}
.vrow:hover .acts{visibility:visible}
.ib{width:20px;height:20px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--dim);border:1px solid transparent}
.ib:hover{border-color:var(--border-s);color:#fff;background:rgba(139,92,246,.2)}
.ib.on{color:var(--purple-l);border-color:var(--purple);background:rgba(139,92,246,.25)}
.listwrap{display:grid;grid-template-columns:minmax(0,1fr) 14px;gap:6px}
.list{height:690px;overflow:auto;border:1px solid var(--border);border-radius:12px;background:rgba(7,10,36,.55);position:relative}
.lhead,.lr{display:grid;gap:8px;align-items:center;padding:4px 8px 4px 0}
.lhead{position:sticky;top:0;z-index:5;background:#0d1236;border-bottom:1px solid var(--border-s);font-size:11px;color:var(--faint);font-weight:600}
.lhead .col{display:flex;align-items:center;gap:4px;overflow:hidden;white-space:nowrap}
.lhead .col .x{cursor:pointer;opacity:.6}
.lr{border-bottom:1px solid rgba(139,92,246,.1);font-size:12px;cursor:pointer}
.lr:hover{background:rgba(139,92,246,.08)}
.lr.sel{background:rgba(139,92,246,.18)}
.lr.ph{color:var(--dim);font-style:italic}
.lr .c{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stripe{width:3px;height:18px;border-radius:2px}
.tg{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;border-radius:4px;color:var(--dim);font-size:12px}
.tg:hover{background:rgba(139,92,246,.25);color:#fff}
.tg.off{visibility:hidden}
.cdot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.lv{font-size:10px;font-weight:700;padding:0 5px;border-radius:5px;background:rgba(148,163,194,.12);color:var(--dim);margin-right:6px}
.mk{font-size:10px;font-weight:700;padding:0 5px;border-radius:5px;background:rgba(251,191,36,.15);color:var(--amber);margin-right:6px}
.dur{height:5px;border-radius:3px;background:rgba(148,163,194,.15)}
.dur div{height:5px;border-radius:3px}
.data{border-bottom:1px solid var(--border);background:rgba(7,10,36,.9);padding:8px 12px 10px}
.kv{display:grid;grid-template-columns:96px 18px 220px minmax(0,1fr);gap:8px;align-items:start;padding:3px 4px;border-bottom:1px solid rgba(139,92,246,.08);font-family:Consolas,monospace;font-size:12px}
.kv:hover{background:rgba(139,92,246,.08)}
.kv .acts{visibility:hidden;display:flex;gap:2px}
.kv:hover .acts{visibility:visible}
.kv .v{white-space:pre-wrap;word-break:break-all}
.json{font-family:Consolas,monospace;font-size:12px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.json .k{color:#c4b5fd} .json .s{color:#86efac} .json .n{color:#fbbf24} .json .bo{color:#22d3ee} .json .nu{color:var(--faint)}
.json .fold{cursor:pointer;color:var(--dim);display:inline-block;width:12px}
.jl{display:grid;grid-template-columns:28px minmax(0,1fr);border-radius:4px}
.jl:hover{background:rgba(139,92,246,.1)}
.jl.hasc{background:rgba(251,191,36,.06)}
.jl .jt{white-space:pre-wrap;word-break:break-all}
.cbtn{font-size:11px;opacity:0;padding:0 3px;border-radius:4px;color:var(--dim)}
.jl:hover .cbtn,.kv:hover .cbtn,.cbtn.has{opacity:1}
.cbtn.has{color:var(--amber)}
.cbtn:hover{background:rgba(139,92,246,.3);color:#fff}
.minimap{position:relative;height:690px;border-radius:6px;background:rgba(7,10,36,.6);border:1px solid var(--border);cursor:pointer}
.minimap i{position:absolute;left:1px;right:1px;height:3px;border-radius:1px}
.minimap .win{position:absolute;left:0;right:0;border:1px solid var(--purple-l);border-radius:3px;pointer-events:none}
.drawer{max-height:760px;overflow:auto;padding:12px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:8px 0}
.tabs button{padding:5px 10px;font-size:12px;color:var(--dim);border-bottom:2px solid transparent}
.tabs button.on{color:#fff;border-color:var(--purple)}
.pop{position:absolute;z-index:40;width:330px;background:var(--pop);border:1px solid var(--border-s);border-radius:12px;padding:12px;box-shadow:0 16px 40px rgba(0,0,0,.55)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:8px 0}
.stats div{background:var(--inner);border-radius:8px;padding:5px 7px}
.stats span{display:block;font-size:10.5px;color:var(--faint)}
.stats b{font-size:14px}
.dist{display:flex;align-items:flex-end;gap:1px;height:44px}
.dist div{flex:1;border-radius:2px 2px 0 0}
.overlay{position:fixed;inset:0;background:rgba(3,5,20,.65);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding-top:60px}
.dialog{width:min(980px,94vw);max-height:80vh;overflow:auto;padding:16px}
.cmp{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
.cmp th,.cmp td{padding:4px 6px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;word-break:break-all;font-family:Consolas,monospace}
.cmp th{font-family:'Segoe UI';color:var(--faint);font-size:11px}
.cmp td.d{background:rgba(251,191,36,.1);color:var(--amber)}
.newpill{position:sticky;top:30px;z-index:6;display:flex;justify-content:center;pointer-events:none}
.newpill span{pointer-events:auto;cursor:pointer}
.wf{display:grid;grid-template-columns:150px minmax(0,1fr) 64px;gap:6px;align-items:center;font-size:11.5px;padding:2px 0}
.wf .t{position:relative;height:10px;background:rgba(148,163,194,.1);border-radius:3px}
.wf .t div{position:absolute;top:0;height:10px;border-radius:3px;min-width:2px}
.cm{background:var(--inner);border:1px solid var(--border);border-radius:8px;padding:6px 8px;margin-bottom:6px;font-size:12px}
.note{border:1px dashed var(--border-s);border-radius:10px;padding:8px 12px;color:var(--dim);font-size:12px;margin-top:10px}
</style>
</head>
<body>
<div class="mockbar">
  <b>MOCK</b> specs/004-logs-explorer · all data generated locally ·
  <span>Jump to:</span>
  <button data-go="sources">Sources</button>
  <button data-go="wizard">New source wizard</button>
  <button data-go="structure">Structure editor</button>
  <button data-go="explorer">Explorer</button>
  <span class="sp"></span>
  <span>Keys in explorer: <b>j</b>/<b>k</b> move · <b>x</b> select · <b>J</b>/<b>K</b> extend selection · <b>Esc</b> clear · <b>Enter</b> open data · <b>/</b> search</span>
</div>
<div class="nav">
  <a>Live Calls</a><a>Session Cycles</a><a>Profiles</a><a>Relive Cycles</a><a class="on">Logs<span class="new">NEW</span></a><a>Settings</a>
</div>
<div class="page" id="app"></div>

<script>
/* ============================== helpers ============================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const pick = a => a[Math.floor(rnd() * a.length)];
const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
const hhmmss = ms => new Date(ms).toISOString().slice(11, 23);
const fmtN = n => n.toLocaleString('en-US');
const fmtDur = ms => ms == null || ms === '' ? '' : (ms >= 1000 ? (ms / 1000).toFixed(1) + ' s' : Math.round(ms) + ' ms');
const CC = ['#a78bfa','#22d3ee','#f472b6','#34d399','#fbbf24','#fb923c','#60a5fa','#e879f9','#4ade80','#f87171'];
const hashColor = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) | 0; return CC[Math.abs(h) % CC.length]; };
const LCOL = { ERROR: 'var(--l-error)', WARN: 'var(--l-warn)', INFO: 'var(--l-info)', DEBUG: 'var(--l-debug)' };

/* ============================== data generator ============================== */
const SUP = ['TravelportNdc', 'FlyAdealUAE', 'Sabre', 'Amadeus', 'AirArabia'];
const ROUTES = ['DXB→CAI', 'AUH→LHR', 'DXB→JED', 'SHJ→KHI', 'DXB→IST'];
const VMS = ['portal-24', 'portal-25'];
const RAW = [];
let t = Date.parse('2026-10-01T18:00:00Z'), cnt = { ic: 7000, ex: 31000 };
function line(ts, level, methodName, message, ids, ctx, vm) {
  const m = { methodName, message };
  if (ids.correlationId) m.correlationId = ids.correlationId;
  if (ids.sessionId) m.sessionId = ids.sessionId;
  if (ids.inboundCallId) m.inboundCallId = ids.inboundCallId;
  if (ids.externalCallId) m.externalCallId = ids.externalCallId;
  if (ctx && Object.keys(ctx).length) m.context = ctx;
  const obj = {
    '@timestamp': new Date(ts).toISOString(),
    'log.level': level,
    'log.logger': 'DetailLogger',
    'process.thread.name': level === 'INFO' && rnd() < .5 ? 'default task-' + ri(1, 40) : 'pool-6869-thread-' + ri(1, 40),
    message: m,
    resource: { 'service.name': 'ndc-prd-ne-' + vm + '-z2' },
    fields: { VM_name: [vm], ERROR_flag: [level === 'ERROR' ? 1 : 0], date_with_weekday: [new Date(ts).toISOString().slice(0, 10) + ' (THURSDAY)'] }
  };
  RAW.push({ ts, obj });
}
for (let s = 0; s < 42; s++) {
  t += ri(60, 260) * 1000;
  const vm = pick(VMS), sid = 'S-' + (9100 + s), corr = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
  const user = 'AGN' + ri(1400, 1499);
  line(t, 'INFO', 'loginV2', 'session start', { sessionId: sid, correlationId: corr }, {
    request: `LoginDTO(email=agent${ri(10, 99)}@travel.ae, password=null, displayUserType=${user}, rememberIsChecked=${rnd() < .5})`
  }, vm);
  const nIc = ri(1, 3);
  for (let i = 0; i < nIc; i++) {
    t += ri(2, 40) * 1000;
    const ic = 'IC-' + (cnt.ic++), route = pick(ROUTES), start = t;
    line(t, 'INFO', 'searchFlights', 'inbound request · POST /search ' + route, { sessionId: sid, inboundCallId: ic, correlationId: corr }, { route }, vm);
    const nEx = ri(1, 3); let maxEnd = t;
    for (let e = 0; e < nEx; e++) {
      const ex = 'EX-' + (cnt.ex++), sup = pick(SUP), st = t + ri(20, 300);
      line(st, 'INFO', 'performOperation', 'Start external system call', { sessionId: sid, inboundCallId: ic, externalCallId: ex, correlationId: corr }, { externalService: sup, actionName: 'Search' }, vm);
      const r = rnd();
      let level = 'INFO', code = 200, took = ri(900, 7200), err;
      if (r < .1) { level = 'ERROR'; code = 504; took = 30000; err = 'java.net.SocketTimeoutException: Read timed out\n\tat java.base/sun.nio.ch.NioSocketImpl.timedRead(NioSocketImpl.java:278)\n\tat java.base/sun.nio.ch.NioSocketImpl.implRead(NioSocketImpl.java:304)'; }
      else if (r < .18) { level = 'WARN'; code = 429; took = ri(300, 1500); err = 'Rate limited by supplier, retry scheduled'; }
      else if (r < .22) { level = 'ERROR'; code = 500; took = ri(2000, 5000); err = 'Supplier returned SOAP fault: Internal error'; }

function wire() {
  $$('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  $$('[data-act]').forEach(el => {

  });

  $$('[data-ff]').forEach(el => el.onchange = () => { FIELDS[+el.dataset.ff].format = el.value; });
  $$('[data-fs]').forEach(el => el.onchange = () => { FIELDS[+el.dataset.fs].search = el.value; });
  $$('[data-fr]').forEach(el => el.onchange = () => { const r = el.value; if (r) FIELDS.forEach(f => { if (f.role === r) f.role = ''; }); FIELDS[+el.dataset.fr].role = r; render(); });
  $$('[data-lf]').forEach(el => el.onchange = () => { S.levels[+el.dataset.lf].f = el.value; resetGroups(); render(); });
  $$('[data-ls],[data-ls2]').forEach(el => el.onchange = () => { S.levels[+(el.dataset.ls ?? el.dataset.ls2)].sort = el.value; render(); });
  $$('[data-lu]').forEach(el => el.onclick = () => { const i = +el.dataset.lu; if (i) { [S.levels[i - 1], S.levels[i]] = [S.levels[i], S.levels[i - 1]]; resetGroups(); render(); } });
  $$('[data-lx]').forEach(el => el.onclick = () => { S.levels.splice(+el.dataset.lx, 1); resetGroups(); render(); });
  const tpl = $('#tpl'); if (tpl) tpl.oninput = () => { S.template = tpl.value; $('#tplprev').textContent = summary(LINES.find(l => val(l, 'statusCode') === 504) || LINES[5]); };
  $$('[data-dv]').forEach(el => el.onclick = e => { e.stopPropagation(); S.dataView = el.dataset.dv; render(); });
  $$('[data-view]').forEach(el => el.onclick = () => { S.view = el.dataset.view; S.limit = 150; if (S.view === 'grouped' && !S.openKids.size) expandTo(1); render(); });
  $$('[data-rmp]').forEach(el => el.onclick = () => { S.pills.splice(+el.dataset.rmp, 1); render(); });
  $$('[data-rmc]').forEach(el => el.onclick = () => { S.cols = S.cols.filter(c => c !== el.dataset.rmc); render(); });
  $$('[data-fa]').forEach(el => el.onclick = e => {
    e.stopPropagation(); const k = el.dataset.fa, f = el.dataset.f, v = el.dataset.v;
    if (k === 'col') { S.cols = S.cols.includes(f) ? S.cols.filter(c => c !== f) : [...S.cols, f]; render(); }
    else if (k === 'ex') addPill({ k: 'ex', f });
    else { const fd = F(f); const tv = fd && fd.type === 'number' && v !== '' && !isNaN(Number(v)) ? Number(v) : v; addPill({ k, f, v: tv }); }
  });
  $$('[data-row]').forEach(el => el.onclick = e => { if (e.target.closest('[data-kid],[data-dt],[data-cmp],[data-drawer],[data-fa],button,input')) return; const id = el.dataset.row; S.sel = id; S.openData.has(id) ? S.openData.delete(id) : S.openData.add(id); rerenderList(); });
  $$('[data-dt]').forEach(el => el.onclick = e => { e.stopPropagation(); const id = el.dataset.dt; S.sel = id; S.openData.has(id) ? S.openData.delete(id) : S.openData.add(id); rerenderList(); });
  $$('[data-kid]').forEach(el => el.onclick = e => { e.stopPropagation(); const k = el.dataset.kid; if (!k) return; S.openKids.has(k) ? S.openKids.delete(k) : S.openKids.add(k); rerenderList(); });
  $$('[data-cmp]').forEach(el => el.onclick = e => {
    e.stopPropagation(); const id = el.dataset.cmp;
    if (e.shiftKey && S.lastPick) { // range in on-screen order
      const order = $$('[data-cmp]').map(x => x.dataset.cmp), a = order.indexOf(S.lastPick), b = order.indexOf(id);
      if (a !== -1 && b !== -1) { for (let i = Math.min(a, b); i <= Math.max(a, b); i++) S.cmp.add(order[i]); }
    } else S.cmp.has(id) ? S.cmp.delete(id) : S.cmp.add(id);
    S.lastPick = id; rerenderList(); refreshBulk();
  });
  const sa = $('#selall'); if (sa) { sa.indeterminate = S.cmp.size > 0 && headSelState() !== 'checked'; sa.onclick = e => { e.stopPropagation(); const ids = e.shiftKey ? FILTERED.map(l => l.id) : $$('[data-cmp]').map(x => x.dataset.cmp); const all = ids.every(i => S.cmp.has(i)); ids.forEach(i => all ? S.cmp.delete(i) : S.cmp.add(i)); rerenderList(); refreshBulk(); }; }
  wireBulk();
  $$('[data-cadd]').forEach(el => el.onclick = e => { e.stopPropagation(); S.cEdit = el.dataset.cadd; rerenderList(); $('#cedit')?.focus(); });
  $$('[data-cc]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    if (el.dataset.cc === 'save') { const t = $('#cedit').value.trim(); if (!t) { $('#cedit').style.borderColor = 'var(--red)'; $('#cerr').textContent = 'Write something first'; $('#cerr').style.color = 'var(--red)'; return; }
      const [id, ...rest] = S.cEdit.split('|'); (S.comments[id] ||= []).push({ who: '🐙 You (profile: Ops)', when: 'just now', path: rest.join('|'), text: t }); }
    S.cEdit = null; rerenderList();
  });
  const ce = $('#cedit'); if (ce) { ce.onclick = e => e.stopPropagation(); ce.oninput = () => { ce.style.borderColor = ''; }; }
  $$('[data-drawer]').forEach(el => el.onclick = e => { e.stopPropagation(); S.drawer = el.dataset.drawer; S.sel = S.drawer; render(); });
  $$('[data-dtab]').forEach(el => el.onclick = () => { S.dtab = el.dataset.dtab; render(); });
  $$('[data-fold]').forEach(el => el.onclick = e => { e.stopPropagation(); const k = el.dataset.fold; S.fold.has(k) ? S.fold.delete(k) : S.fold.add(k); rerenderList(); });
  $$('[data-exp]').forEach(el => el.onclick = () => { expandTo(+el.dataset.exp); render(); });
  $$('[data-pat]').forEach(el => el.onclick = () => { const p = el.dataset.pat; S.patOpen.has(p) ? S.patOpen.delete(p) : S.patOpen.add(p); rerenderList(); });
  $$('[data-mm]').forEach(el => el.onclick = e => { e.stopPropagation(); jumpTo(+el.dataset.mm); });
  const mm = $('#mm'); if (mm) mm.onclick = e => { if (e.target.dataset.mm) return; const r = mm.getBoundingClientRect(); jumpTo(Math.floor((e.clientY - r.top) / r.height * FILTERED.length)); };
  $$('[data-stats]').forEach(el => el.onclick = e => { if (e.target.closest('[data-fa]')) return; const r = el.getBoundingClientRect(), pr = $('.side').getBoundingClientRect(); $('#popwrap').innerHTML = statsPop(el.dataset.stats, r.left + window.scrollX + 30, r.bottom + window.scrollY + 4); wire(); });
  $$('[data-copy]').forEach(el => el.onclick = e => { e.stopPropagation(); const l = LINES.find(x => x.id === el.dataset.copy); navigator.clipboard?.writeText(l.raw); el.textContent = 'Copied'; });
  const od = $('#onlydiff'); if (od) od.onchange = () => { window.__onlyDiff = od.checked; $('#dlg').innerHTML = compareDlg(); wire(); };
}
function rerenderList() { const list = $('#list'); if (!list) return render(); const st = list.scrollTop; list.innerHTML = renderList(); list.scrollTop = st; const d = $('.drawer'); if (d) d.innerHTML = renderDrawer(); wire(); syncWin(); }
function act(a, el, e) {
  if (a === 'newsrc') { S.wiz = { ...S.wiz, step: 1, editMode: false, progress: 0 }; S.screen = 'wizard'; }
  else if (a === 'open' || a === 'toexplorer') { S.wiz.editMode = false; S.screen = 'explorer'; }
  else if (a === 'tosources') S.screen = 'sources';
  else if (a === 'mmcond') S.mmCond = el.value;
  else if (a === 'split') { e.stopPropagation(); el.textContent = 'New source "portal-detail (healthCheck)" created'; return; }
  else if (a === 'srcsettings') { e.stopPropagation(); const d = document.createElement('div'); d.innerHTML = `<div class="overlay"><div class="card dialog" style="width:460px"><h2>Settings · portal-detail</h2><div class="form" style="grid-template-columns:150px 1fr"><label>Retention: max size</label><div class="row"><input id="rgb" value="20" style="width:80px"> <span class="dim">GB</span></div><label>Retention: max age</label><div class="row"><input id="rdays" value="30" style="width:80px"> <span class="dim">days</span></div><label></label><span class="hint">Oldest lines go first. Commented and pinned lines are never removed.</span></div><div class="hint" id="rerr" style="color:var(--red)"></div><div class="row" style="margin-top:10px"><span class="sp"></span><button class="btn sm" id="rc">Cancel</button><button class="btn sm primary" id="rs">Save</button></div></div></div>`; document.body.appendChild(d);
    d.querySelector('#rc').onclick = () => d.remove();
    d.querySelector('#rs').onclick = () => { const g = Number(d.querySelector('#rgb').value), dd = Number(d.querySelector('#rdays').value); if (!(g >= 0.1 && g <= 500) || !(dd >= 1 && dd <= 3650)) { d.querySelector('#rerr').textContent = 'Size must be 0.1–500 GB and age 1–3650 days.'; return; } d.remove(); };
    return; }
  else if (a === 'delsrc') { e.stopPropagation(); const d = document.createElement('div'); d.innerHTML = `<div class="overlay"><div class="card dialog" style="width:460px"><h2>Delete portal-detail?</h2><p class="dim">3,412,870 lines, 14 comments and 14 pinned lines will be removed. This can't be undone.</p><div class="row"><span class="sp"></span><button class="btn sm" id="dc">Cancel</button><button class="btn sm" style="border-color:var(--red);color:var(--red)" id="dd">Delete source</button></div></div></div>`; document.body.appendChild(d); d.querySelector('#dc').onclick = d.querySelector('#dd').onclick = () => d.remove(); return; }
  else if (a === 'structure') { S.wiz.editMode = true; S.wiz.step = 2; S.screen = 'wizard'; }
  else if (a === 'addlevel') { S.levels.push({ f: FIELDS.find(f => f.label === 'externalService').label, sort: 'time ↑' }); resetGroups(); }
  else if (a === 'closedrawer') S.drawer = null;
  else if (a === 'closedata') S.openData.clear();
  else if (a === 'closepop') { $('#popwrap').innerHTML = ''; return; }
  else if (a === 'closedlg') { $('#dlg').innerHTML = ''; return; }
  else if (a === 'live') toggleLive();
  else if (a === 'jumpnew') { S.newCount = 0; render(); $('#list').scrollTop = 0; return; }
  else if (a === 'leafsort') S.leafSort = el.value;
  else if (a === 'savedview') { const v = S.savedViews[+el.value]; if (v) S.pills = JSON.parse(JSON.stringify(v.pills)); }
  else if (a === 'saveview') { const n = 'My view ' + (S.savedViews.length + 1); S.savedViews.push({ name: n, pills: JSON.parse(JSON.stringify(S.pills)) }); el.textContent = '★ Saved as "' + n + '"'; return; }
  else if (a === 'range') { S.pills = S.pills.filter(p => p.k !== 'time'); const hi = Math.max(...LINES.map(l => l.ts)); const h = el.selectedIndex === 1 ? 1 : el.selectedIndex === 2 ? 6 : 0; if (h) S.pills.push({ k: 'time', from: hi - h * 3600e3, to: hi }); }
  else if (a === 'groupby') { S.view = 'patterns'; $('#popwrap').innerHTML = ''; }
  else if (a === 'addcomment') { const tx = $('#ctext').value.trim(); if (!tx) { $('#ctext').placeholder = 'Write something first'; $('#ctext').style.borderColor = 'var(--red)'; return; } (S.comments[S.drawer] ||= []).push({ who: '🐙 You (profile: Ops)', when: 'just now', path: $('#cfield').value, text: tx }); }
  render();
}
function go(where) {
  if (where === 'structure') { S.wiz.editMode = true; S.wiz.step = 2; S.screen = 'wizard'; }
  else if (where === 'wizard') { S.wiz.editMode = false; S.wiz.step = 1; S.screen = 'wizard'; }
  else S.screen = where;
  render(); window.scrollTo(0, 0);
}
function recheck(f) {
  const vals = LINES.filter(l => !l.bad && l.f[f.path] !== undefined && l.f[f.path] !== null).map(l => l.f[f.path]);
  if (f.type === 'string') { f.match = 1; f.invalid = 0; return; }
  const ok = vals.filter(v => typed(f, v) !== null).length; f.match = ok / (vals.length || 1); f.invalid = vals.length - ok;
}
function resetGroups() { S.openKids.clear(); expandTo(1); }
function expandTo(n) {
  S.openKids.clear(); if (!n) return;
  const { root, none } = buildTree(FILTERED.length ? FILTERED : LINES);
  const walk = node => { for (const k of node.kids.values()) { if (k.level <= n) S.openKids.add(k.key); walk(k); } };
  walk(root); if (n >= 9 && none.length) S.openKids.add('|__none');
}
function jumpTo(i) {
  i = Math.max(0, Math.min(FILTERED.length - 1, i));
  if (S.limit < i + 40) S.limit = i + 40;
  const id = FILTERED[i].id; S.sel = id; rerenderList();
  const row = $(`[data-row="${id}"]`); if (row) $('#list').scrollTop = row.offsetTop - 60;
}
function startLoad() {
  clearInterval(S.wiz.timer); S.wiz.progress = 0;
  S.wiz.timer = setInterval(() => { S.wiz.progress = Math.min(100, S.wiz.progress + ri(3, 9)); if (S.screen === 'wizard' && S.wiz.step === 3) render(); if (S.wiz.progress >= 100) clearInterval(S.wiz.timer); }, 350);
}
function toggleLive() {
  S.live = !S.live; clearInterval(S.liveTimer);
  if (!S.live) return;
  S.liveTimer = setInterval(() => {
    const last = LINES[LINES.length - 1].ts + ri(800, 4000), sup = pick(SUP), bad = rnd() < .15, took = bad ? 30000 : ri(800, 6000), sid = 'S-' + (9100 + ri(30, 41));
    const obj = { '@timestamp': new Date(last).toISOString(), 'log.level': bad ? 'ERROR' : 'INFO', 'log.logger': 'DetailLogger', 'process.thread.name': 'pool-6869-thread-' + ri(1, 40),
      message: { methodName: 'performOperation', message: bad ? 'Supplier timeout' : 'End external system call', sessionId: sid, inboundCallId: 'IC-' + ri(7000, 7090), externalCallId: 'EX-' + (cnt.ex++), context: { externalService: sup, actionName: 'Search', statusCode: bad ? 504 : 200, timeTaken: took } },
      resource: { 'service.name': 'ndc-prd-ne-portal-24-z2' }, fields: { VM_name: ['portal-24'], ERROR_flag: [bad ? 1 : 0] } };
    LINES.push({ id: 'L' + LINES.length, idx: LINES.length, ts: last, raw: JSON.stringify(obj), obj, f: flatten(obj) });
    if (S.screen !== 'explorer') return;
    const list = $('#list');
    if (list && list.scrollTop > 10) { S.newCount++; applyFilters(); const st = list.scrollTop; list.innerHTML = renderList(); list.scrollTop = st; wire(); }
    else render();
  }, 1600);
}
document.addEventListener('keydown', e => {
  if (S.screen !== 'explorer' || e.target.matches('input,textarea,select')) return;
  if (e.key === '/') { e.preventDefault(); $('#qin').focus(); return; }
  if (S.view !== 'lines' || !FILTERED.length) return;
  const i = Math.max(0, FILTERED.findIndex(l => l.id === S.sel));
  if (e.key === 'j' || e.key === 'k') { const n = e.key === 'j' ? Math.min(FILTERED.length - 1, i + 1) : Math.max(0, i - 1); S.sel = FILTERED[n].id; if (S.drawer) S.drawer = S.sel; rerenderList(); const r = $(`[data-row="${S.sel}"]`); r?.scrollIntoView({ block: 'nearest' }); }
  if ((e.key === 'J' || e.key === 'K') && S.sel) { S.cmp.add(S.sel); const n = e.key === 'J' ? Math.min(FILTERED.length - 1, i + 1) : Math.max(0, i - 1); S.sel = FILTERED[n].id; S.cmp.add(S.sel); rerenderList(); refreshBulk(); }
  if (e.key === 'x' && S.sel) { S.cmp.has(S.sel) ? S.cmp.delete(S.sel) : S.cmp.add(S.sel); S.lastPick = S.sel; rerenderList(); refreshBulk(); }
  if (e.key === 'Escape' && S.cmp.size) { S.cmp.clear(); rerenderList(); refreshBulk(); }
  if (e.key === 'Enter' && S.sel) { S.openData.has(S.sel) ? S.openData.delete(S.sel) : S.openData.add(S.sel); rerenderList(); }
});
document.addEventListener('click', e => { if (!e.target.closest('.pop,[data-stats]')) { const p = $('#popwrap'); if (p) p.innerHTML = ''; } if (!e.target.closest('#qbar')) { const a = $('#ac'); if (a) a.style.display = 'none'; } });
