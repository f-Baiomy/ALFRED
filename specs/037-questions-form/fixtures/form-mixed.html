      "<p class=\"hint err\" data-oe=\"" + esc(q.id) + "\" data-t=\"otherEmpty\"></p>";
    if (!free) h += "<div class=\"sure\"><span data-t=\"sure\"></span>" + ["sure", "likely", "unsure"].map(function (v) { return "<label><input type=\"radio\" name=\"" + esc(q.id) + ".s\" value=\"" + v + "\"><span data-s=\"" + v + "\"></span></label>"; }).join("") + "</div>";
    el.innerHTML = h;
    g.appendChild(el);
  });
  root.appendChild(g);
});

function inputs(name) { return Array.prototype.slice.call(document.querySelectorAll("input")).filter(function (x) { return x.name === name; }); }
function picked(name) { return inputs(name).filter(function (x) { return x.checked; }).map(function (x) { return x.value; }); }
function readQ(q) {
  var p = picked(q.id), note = (document.querySelector("[data-note=\"" + q.id + "\"]") || {value: ""}).value.trim();
  var s = picked(q.id + ".s")[0] || null;
  var choice = p.filter(function (v) { return v.indexOf("__") !== 0; });
  var follow = null;
  (q.options || []).forEach(function (o) {
    if (!follow && o.followUp && choice.indexOf(o.id) >= 0) follow = {q: o.followUp.id, choice: picked(q.id + ".f." + o.id).slice(0, 1)};
  });
  return {q: q.id, choice: choice, other: p.indexOf("__other") >= 0, later: p.indexOf("__later") >= 0, note: note, sure: s, follow: follow};
}
function isAns(q, a) { return !a.later && (a.choice.length > 0 || a.other || (!(q.options && q.options.length) && a.note.length > 0)); }
function collect() {
  return {formId: FORM.formId, version: 1, board: FORM.board, boardName: FORM.boardName, lang: L,
    answeredBy: nameEl.value.trim(), role: roleEl.value.trim(), answeredAt: new Date().toISOString(), answers: QS.map(readQ)};
}
function locale() { return L === "ar" ? "ar-EG" : "en-GB"; }

function applyLang() {
  var t = T[L];
  document.documentElement.lang = L; document.documentElement.dir = L === "ar" ? "rtl" : "ltr";
  $("title").textContent = FORM.title || t.title(FORM.boardName);
  document.title = $("title").textContent;
  var made = store(function () { return new Date(FORM.createdAt).toLocaleDateString(locale()); }) || FORM.createdAt;
  $("meta").innerHTML = [FORM.boardLabel, FORM.project].filter(Boolean).concat(t.meta(QS.length, CARDS.length, made)).map(function (x) { return "<span dir=\"auto\">" + esc(x) + "</span>"; }).join("");
  $("sub").textContent = t.sub; $("lName").textContent = t.name; $("lRole").textContent = t.role; nameEl.placeholder = t.namePh; roleEl.placeholder = t.rolePh;
  $("reset").textContent = t.reset; $("save").textContent = t.save; $("saveZip").textContent = t.asZip; $("nextOpen").textContent = t.next;
  $("lOnlyOpen").textContent = t.onlyOpen; $("acceptRec").textContent = t.acceptRec; $("keys").textContent = t.keys;
  Array.prototype.forEach.call(document.querySelectorAll("[data-t]"), function (e) { e.textContent = t[e.getAttribute("data-t")]; });
  Array.prototype.forEach.call(document.querySelectorAll("[data-s]"), function (e) { e.textContent = t.sureOpts[e.getAttribute("data-s")]; });
  Array.prototype.forEach.call(document.querySelectorAll("#lang button"), function (b) { b.classList.toggle("on", b.getAttribute("data-l") === L); });
  refresh();
}
$("lang").addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b) return;
  L = b.getAttribute("data-l"); store(function () { localStorage.setItem(KEY + ":lang", L); }); applyLang();
});

function refresh() {
  var d = collect(), t = T[L], n = 0, l = 0;
  QS.forEach(function (q, i) {
    var a = d.answers[i], el = $("q-" + q.id), ok = isAns(q, a);
    if (!el) return;
    if (ok) n++;
    if (a.later) l++;
    el.classList.toggle("done", !!ok); el.classList.toggle("islater", a.later);
    el.classList.toggle("hidden", $("onlyOpen").checked && (ok || a.later) && !el.contains(document.activeElement));
    Array.prototype.forEach.call(el.querySelectorAll(".fu"), function (f) { f.classList.toggle("show", a.choice.indexOf(f.getAttribute("data-for")) >= 0); });
    var oe = el.querySelector("[data-oe]"); if (oe) oe.classList.toggle("show", a.other && !a.note);
  });
  $("prog").textContent = t.prog(n, l, QS.length);
  $("pfill").style.width = (QS.length ? 100 * (n + l) / QS.length : 0) + "%";
  $("cchips").innerHTML = CARDS.map(function (c) {
    var qs = QS.filter(function (q) { return q.card === c.card; });
    var k = qs.filter(function (q) { var a = d.answers[QS.indexOf(q)]; return isAns(q, a) || a.later; }).length;
    return qs.length ? "<a href=\"#card-" + c.card + "\" class=\"" + (k === qs.length ? "ok" : "") + "\">#" + c.card + " <small>" + k + "/" + qs.length + "</small></a>" : "";
  }).join("");
  Array.prototype.forEach.call(document.querySelectorAll("[data-gc]"), function (e) {
    var qs = QS.filter(function (q) { return String(q.card) === e.getAttribute("data-gc"); });
    e.textContent = qs.filter(function (q) { return isAns(q, d.answers[QS.indexOf(q)]); }).length + "/" + qs.length;
  });
  var saved = store(function () { localStorage.setItem(KEY, JSON.stringify(d)); return true; });
  $("savedAt").textContent = saved ? t.saved(new Date().toLocaleTimeString(locale(), {hour: "2-digit", minute: "2-digit"})) : t.notSaved;
}
function restore() {
  var s = store(function () { return JSON.parse(localStorage.getItem(KEY) || "null"); });
  if (!s || !s.answers) return;
  nameEl.value = s.answeredBy || ""; roleEl.value = s.role || "";
  function set(n, v) { inputs(n).forEach(function (x) { if (x.value === v) x.checked = true; }); }
  s.answers.forEach(function (a) {
    var q = QS.filter(function (x) { return x.id === a.q; })[0]; if (!q) return;
    (a.choice || []).forEach(function (v) { set(a.q, v); });
    if (a.other) set(a.q, "__other");
    if (a.later) set(a.q, "__later");
    if (a.sure) set(a.q + ".s", a.sure);
    if (a.follow) (q.options || []).forEach(function (o) { if (o.followUp && o.followUp.id === a.follow.q) (a.follow.choice || []).forEach(function (v) { set(a.q + ".f." + o.id, v); }); });
    var t = document.querySelector("[data-note=\"" + a.q + "\"]"); if (t) t.value = a.note || "";
  });
}
restore(); applyLang();
document.addEventListener("input", refresh);
document.addEventListener("change", function (e) {
  var i = e.target;
  if (i.type === "checkbox" && i.name && i.name.indexOf(".") < 0 && i.checked) {
    // "later" and an answer exclude each other in a multi-select question too
    inputs(i.name).forEach(function (x) { if (i.value === "__later" ? x.value !== "__later" : x.value === "__later") x.checked = false; });
  }
  refresh();
});
function firstOpen() { var d = collect(); return QS.filter(function (q, i) { return !isAns(q, d.answers[i]) && !d.answers[i].later; })[0]; }
$("nextOpen").addEventListener("click", function () {
  var q = firstOpen(); if (!q) return;
  var el = $("q-" + q.id); el.scrollIntoView({behavior: "smooth", block: "center"}); el.focus({preventScroll: true});
});
$("acceptRec").addEventListener("click", function () {
  var d = collect();
  var todo = QS.filter(function (q, i) { return !isAns(q, d.answers[i]) && !d.answers[i].later && (q.options || []).some(function (o) { return o.recommended; }); });
  if (!todo.length || !confirm(T[L].acceptRecQ(todo.length))) return;
  todo.forEach(function (q) {
    (q.options || []).filter(function (o) { return o.recommended; }).slice(0, q.multiSelect ? 99 : 1).forEach(function (o) {
      inputs(q.id).forEach(function (x) { if (x.value === o.id) x.checked = true; });
      if (o.followUp) { var r = (o.followUp.options || []).filter(function (f) { return f.recommended; })[0]; if (r) inputs(q.id + ".f." + o.id).forEach(function (x) { if (x.value === r.id) x.checked = true; }); }
    });
  });
  refresh();
});
document.addEventListener("keydown", function (e) {
  var tag = e.target.tagName;
  if (tag === "TEXTAREA" || (tag === "INPUT" && e.target.type === "text") || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "n" || e.key === "N") { $("nextOpen").click(); e.preventDefault(); return; }
  var q = e.target.closest && e.target.closest(".q");
  if (!q || !/^[1-6]$/.test(e.key)) return;
  var ins = Array.prototype.slice.call(q.querySelectorAll(":scope > label.opt input"));
  var x = ins[+e.key - 1]; if (x) { x.click(); x.focus(); e.preventDefault(); }
});

// ---- the answers file: a read-only page in the same design, the answers as JSON inside it
function buildAnswers(d) {
  var t = T[L], n = 0, l = 0, o = 0, diff = 0;
  function row(x, on) {
    return "<div class=\"opt " + (on ? "picked" : "") + "\"><span>" + (on ? "&#10004;" : "&#9675;") + "</span><span><b dir=\"auto\">" + esc(x.label) +
      (x.recommended ? "<span class=\"rec\">" + t.rec + "</span>" : "") + "</b>" + (x.description ? "<small dir=\"auto\">" + esc(x.description) + "</small>" : "") + "</span></div>";
  }
  var body = CARDS.map(function (c) {
    var qs = QS.filter(function (q) { return q.card === c.card; });
    if (!qs.length) return "";
    return "<section class=\"grp\"><div class=\"ghead\"><span class=\"gnum\">#" + c.card + "</span><b dir=\"auto\">" + esc(c.name) + "</b><span class=\"gtype\">" + esc(c.type) + "</span></div>" + qs.map(function (q) {
      var a = d.answers.filter(function (x) { return x.q === q.id; })[0], ok = isAns(q, a), opts = q.options || [];
      if (ok) n++; else if (a.later) l++; else o++;
      var rec = opts.filter(function (x) { return x.recommended; }).map(function (x) { return x.id; }).sort().join(), mine = a.choice.slice().sort().join();
      var vs = "";
      if (ok && rec && !a.other) { if (rec === mine) vs = "<span class=\"pill ok\">" + t.asRec + "</span>"; else { diff++; vs = "<span class=\"pill warn\">" + t.diffRec + "</span>"; } }
      var pk = opts.filter(function (x) { return a.choice.indexOf(x.id) >= 0; }), rest = opts.filter(function (x) { return a.choice.indexOf(x.id) < 0; });
      var fq = a.follow && opts.filter(function (x) { return x.followUp && x.followUp.id === a.follow.q; })[0];
      return "<div class=\"q " + (ok ? "done" : a.later ? "islater" : "unans") + "\"><span class=\"tag\" dir=\"auto\">" + esc(q.header) + "</span>" + vs +
        (a.later ? "<span class=\"pill warn\">" + t.laterTag + "</span>" : "") + "<h2 dir=\"auto\">" + esc(q.question) + "</h2>" +
        pk.map(function (x) { return row(x, true); }).join("") + (a.other ? "<div class=\"opt picked\"><span>&#10004;</span><span><b>" + t.other + "</b></span></div>" : "") +
        (fq ? "<div class=\"fu show\"><span class=\"tag\">" + t.follow + "</span><h3 dir=\"auto\">" + esc(fq.followUp.question) + "</h3>" +
          ((fq.followUp.options || []).filter(function (f) { return a.follow.choice.indexOf(f.id) >= 0; }).map(function (f) { return row(f, true); }).join("") || "<p class=\"why\">" + t.none + "</p>") + "</div>" : "") +
        (a.note ? "<p class=\"notebox\" dir=\"auto\">" + esc(a.note) + "</p>" : "") +
        (a.sure ? "<p class=\"why\">" + t.sure + " <b>" + t.sureOpts[a.sure] + "</b></p>" : "") +
        (!ok && !a.later ? "<p class=\"why\">" + t.none + "</p>" : "") +
        (rest.length ? "<details class=\"why2\"><summary>" + t.otherOpts(rest.length) + "</summary>" + rest.map(function (x) { return row(x, false); }).join("") + "</details>" : "") + "</div>";
    }).join("") + "</section>";
  }).join("");
  var when = store(function () { return new Date(d.answeredAt).toLocaleString(locale()); }) || d.answeredAt;
  var head = "<h1 dir=\"auto\">" + esc(t.ansTitle(FORM.boardName)) + "</h1><div class=\"meta\"><span dir=\"auto\">" + esc(FORM.boardLabel) + "</span>" +
    (FORM.project ? "<span dir=\"auto\">" + esc(FORM.project) + "</span>" : "") + "<span>" + t.by + " <bdi>" + esc(d.answeredBy || "—") + "</bdi>" +
    (d.role ? " (<bdi>" + esc(d.role) + "</bdi>)" : "") + "</span><span>" + esc(when) + "</span></div>" +
    "<div class=\"stats\"><div><b>" + n + "</b>" + t.sumAnswered + "</div><div><b>" + l + "</b>" + t.sumLater + "</div><div><b>" + o + "</b>" + t.sumOpen + "</div><div><b>" + diff + "</b>" + t.sumDiff + "</div></div>";
  var css = document.querySelector("style").textContent;
  // "<" written as <: no text anyone typed can end the block
  var json = JSON.stringify(d).replace(/</g, "\\u003c");
  return "<!doctype html>\n<html lang=\"" + L + "\" dir=\"" + (L === "ar" ? "rtl" : "ltr") + "\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">" +
    "<meta name=\"generator\" content=\"Alfred answers file (specs/037)\"><title>" + esc(t.ansTitle(FORM.boardName)) + "</title><style>" + css + "</style></head><body><main class=\"readonly\">" +
    head + body + "</main><script type=\"application/json\" id=\"alfred-answers\">" + json + "<\/script></body></html>";
}

// one-entry stored zip (no compression), so the offline form needs no library
var CRC = (function () { var t = [], n, c, k; for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { var c = 0xFFFFFFFF; for (var i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipOne(name, data) {
  var nm = new TextEncoder().encode(name), crc = crc32(data), sz = data.length;
  function hdr(sig, len) { var v = new DataView(new ArrayBuffer(len)); v.setUint32(0, sig, true); return v; }
  var lh = hdr(0x04034b50, 30); lh.setUint16(4, 20, true); lh.setUint16(6, 0x0800, true); lh.setUint32(14, crc, true); lh.setUint32(18, sz, true); lh.setUint32(22, sz, true); lh.setUint16(26, nm.length, true);
  var cd = hdr(0x02014b50, 46); cd.setUint16(4, 20, true); cd.setUint16(6, 20, true); cd.setUint16(8, 0x0800, true); cd.setUint32(16, crc, true); cd.setUint32(20, sz, true); cd.setUint32(24, sz, true); cd.setUint16(28, nm.length, true);
  var end = hdr(0x06054b50, 22); end.setUint16(8, 1, true); end.setUint16(10, 1, true); end.setUint32(12, 46 + nm.length, true); end.setUint32(16, 30 + nm.length + sz, true);
  return new Blob([lh.buffer, nm, data, cd.buffer, nm, end.buffer], {type: "application/zip"});
}
function download(asZip) {
  var d = collect(), t = T[L];
  var miss = QS.filter(function (q, i) { return !isAns(q, d.answers[i]) && !d.answers[i].later; }).length;
  var oe = d.answers.filter(function (a) { return a.other && !a.note; }).length;
  if ((miss || oe) && !confirm(t.missing(miss, oe))) return;
  var html = buildAnswers(d);
  var base = (FORM.fileBase || "questions") + "-answers-" + d.answeredAt.slice(0, 10);
  var blob = asZip ? zipOne(base + ".html", new TextEncoder().encode(html)) : new Blob([html], {type: "text/html"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = base + (asZip ? ".zip" : ".html");
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
}
$("save").addEventListener("click", function () { download(false); });
$("saveZip").addEventListener("click", function () { download(true); });
$("reset").addEventListener("click", function () {
  if (!confirm(T[L].resetQ)) return;
  store(function () { localStorage.removeItem(KEY); });
  Array.prototype.forEach.call(document.querySelectorAll("#qs input"), function (r) { r.checked = false; });
  Array.prototype.forEach.call(document.querySelectorAll("#qs textarea"), function (x) { x.value = ""; });
  nameEl.value = ""; roleEl.value = "";
  refresh();
});
window.AlfredForm = {collect: collect, buildAnswers: buildAnswers, zipOne: zipOne};
})();
</script>
