    case 'consent': return consentDialog(m);
    case 'consentNo': m.extra.state = 'declined'; return renderStream();
    case 'consentYes': m.extra.state = 'done'; closeDialog(); renderStream(); return toast(`<b>${m.extra.kind === 'resend' ? 'Sent' : 'Rule on'}</b>${esc(m.extra.doneText)}`);
    case 'pin': m.extra.pinned = true; S.widgets.push('Search duration per call'); renderAll(); return toast('<b>Pinned</b>On the board above the columns, live.');
    case 'unpin': S.widgets = []; return renderAll();
    case 'openReport': return reportDialog();
    case 'exportReport': return toast('<b>Export</b>branch-search-status-report.md written to your export folder.');
    case 'qsend': { m.extra.sent = true; const ans = m.extra.qs.map((x) => `${x.h}: "${x.opts[x.sel].l}"`).join(' · ');
      const am = me(`**Answers** ${ans}`, {}); am.state = runnerOn() ? 'answering' : 'waiting'; c.msgs.push(am); bump(S.scope); renderAll(); queue(S.scope);
      return toast('<b>Sent</b>All answers in one batch.'); }
    case 'closeDrawer': return closeDrawer();
    case 'dlgClose': return closeDialog();
  }
}

async function threadReply(m, text) {
  if (!text.trim()) return;
  const r = me(text, {}); r.state = S.on[S.scope] ? 'answered' : 'waiting';
  m.replies.push(r); S.replyTo = null; m.open = true; bump(S.scope); renderStream();
  if (!S.on[S.scope]) return;
  const live = { steps: ['board_wait → thread reply', 'reads this thread only'], secs: 2, draft: '' };
  const tmp = { id: nid(), who: 'claude', text: '', at: now(), live };
  m.replies.push(tmp); renderStream();
  await sleep(1200);
  delete tmp.live; tmp.text = `In this thread: yes - ${M.call81} body has \`"branchId": 2\`, so the fix reads the singular field.`;
  renderStream();
}

function askAbout(call) {
  S.selCall = call.n; S.askItem = call.m; S.scope = call.cyc ? 'cycle' : 'project'; S.panel = true; S.dismissedCtx.clear();
  renderAll(); $('#ta').focus();
  toast(`<b>Ask Claude</b>${call.cyc ? `Goes to the chat of cycle "${CYCLE.name}" - the call was captured there.` : 'Not in a recording cycle → the project chat.'}`);
}

function openMention(ref, label) {
  if (ref.startsWith('card:')) { const n = +ref.split('#')[1]; if (S.cards.find((c) => c.n === n)) return openDrawer(n); }
  if (ref.startsWith('chat:')) {
    const [scope, id] = ref.slice(5).split('/');
    S.scope = scope === 'project' ? 'project' : 'cycle'; S.panel = true; renderAll();
    const el = document.getElementById('m' + id);
    if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('flash'); setTimeout(() => el.classList.remove('flash'), 2500); }
    return;
  }
  if (ref.startsWith('page:')) return reportDialog();
  toast(`<b>Opens as today</b>${esc(label)} - the same popup/viewer as on cards (call card, DB window, spec viewer at the item, code).`);
}

/* right-click → Ask Claude */
document.addEventListener('contextmenu', (e) => {
  const row = e.target.closest('[data-call],.lc-sub,.chat-msg');
  if (!row) return;
  e.preventDefault();
  const menu = $('#menu');
  if (row.dataset.call != null) {
    const call = CALLS.find((c) => c.n === +row.dataset.call);
    menu.innerHTML = `<button data-ask="${call.n}">💬 Ask Claude about this call</button><div class="sep"></div><button data-act="dlgClose">Open call</button><button data-act="dlgClose">Add to cycle</button>`;
  } else if (row.classList.contains('lc-sub')) {
    const v = row.querySelector('[data-asksub]').dataset.asksub;
    menu.innerHTML = `<button data-asksub="${esc(v)}">💬 Ask Claude about this ${row.dataset.sub === 'stmt' ? 'statement' : 'log line'}</button>`;
  } else return;
  menu.style.left = e.clientX + 'px'; menu.style.top = e.clientY + 'px'; menu.classList.add('open');
});

/* hover tips (the existing .board-mention-tip) */
document.addEventListener('mouseover', (e) => {
  const bi = e.target.closest('.chat-bar.slim .bar-item');
  if (bi) { const tp = $('#tip'); tp.innerHTML = `<span class="l">${esc(bi.dataset.tipname)}</span><span class="l dim">${esc(bi.dataset.tipline)}</span>`; const r = bi.getBoundingClientRect(); tp.style.display = 'block'; tp.style.left = r.right + 8 + 'px'; tp.style.top = r.top + 'px'; return; }
  const ch = e.target.closest('.board-mention'); const tip = $('#tip');
  if (!ch) { tip.style.display = 'none'; return; }
  const k = ch.dataset.ref; const info = TIPS[k];
  const lines = info ? [info[0], info[1]] : [ch.dataset.label, k.startsWith('chat:') ? 'A chat message - opens the chat there' : k];
  tip.innerHTML = `<span class="l">${esc(lines[0])}</span><span class="l dim">${esc(lines[1])}</span>`;
  const r = ch.getBoundingClientRect();
  tip.style.display = 'block'; tip.style.left = Math.min(r.left, innerWidth - 350) + 'px'; tip.style.top = r.bottom + 6 + 'px';
});

/* composer */
const ta = $('#ta');
ta.addEventListener('input', () => {
  const v = ta.value;
  if (/^\/\S*$/.test(v)) openPicker('/'); else if (/(^|\s)@\S*$/.test(v)) openPicker('@'); else closePicker();
});
ta.addEventListener('keydown', (e) => {
  if (pick.kind && $('#picker').classList.contains('open')) {
    if (e.key === 'ArrowDown') { pick.i = Math.min(pick.i + 1, pick.rows.length - 1); hiPick(); e.preventDefault(); return; }
    if (e.key === 'ArrowUp') { pick.i = Math.max(pick.i - 1, 0); hiPick(); e.preventDefault(); return; }
    if (e.key === 'Enter' || e.key === 'Tab') { choosePick(pick.i); e.preventDefault(); return; }
    if (e.key === 'Escape') { closePicker(); return; }
  }
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(ta.value); ta.value = ''; }
});
$('#send').onclick = () => { send(ta.value); ta.value = ''; ta.focus(); };
$('#btnAt').onclick = () => { ta.value += (ta.value && !/\s$/.test(ta.value) ? ' ' : '') + '@'; ta.focus(); openPicker('@'); };
$('#btnSlash').onclick = () => { ta.value = '/'; ta.focus(); openPicker('/'); };
$('#btnImg').onclick = () => { S.imgs++; renderCtx(); };
$('#btnSnip').onclick = () => { ta.value += '\n```html live\n<div id="chart"></div>\n```\n'; ta.focus(); };
ta.addEventListener('paste', (e) => { if ([...(e.clipboardData?.items || [])].some((i) => i.type.startsWith('image/'))) { S.imgs++; renderCtx(); e.preventDefault(); } });
$('#chatToggle').onclick = () => { if (S.panel) leave(S.scope); S.panel = !S.panel; if (S.panel) { S.unread[S.scope] = 0; S.stick = true; } renderAll(); };
document.addEventListener('keydown', (e) => {
  if (e.ctrlKey && e.key.toLowerCase() === 'k') { e.preventDefault(); quickSwitch(); return; }
  if (e.ctrlKey && e.key.toLowerCase() === 'j') { e.preventDefault(); $('#chatToggle').click(); }
  if (e.ctrlKey && e.key.toLowerCase() === 'f' && S.panel && document.activeElement?.closest('#dock')) { e.preventDefault(); S.searchOpen = true; renderAll(); }
  if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'f' && !POPOUT) { e.preventDefault(); setView(S.view === 'full' ? (S.prevView || 'dock') : 'full'); }
  if (e.key === 'Escape' && S.view === 'full' && !$('#dlg').classList.contains('open')) setView(S.prevView || 'dock');
  if (e.key === 'Escape') { closeDialog(); $('#settings').classList.remove('open'); }
});
$('#dlg').addEventListener('click', (e) => { if (e.target.id === 'dlg') closeDialog(); });

/* resize the dock */
(() => { let x0, w0; const mv = (e) => { S.width = Math.min(760, Math.max(340, w0 + (e.clientX - x0))); saveView(); $('#dock').style.width = S.width + 'px'; };
  $('#resize').onmousedown = (e) => { x0 = e.clientX; w0 = S.width; document.addEventListener('mousemove', mv); document.addEventListener('mouseup', () => document.removeEventListener('mousemove', mv), { once: true }); e.preventDefault(); }; })();

/* --------------------------------------------------------- mock controls */
$('#mkCycleOn').onchange = (e) => { S.on.cycle = e.target.checked; if (!S.on.cycle && S.run) S.run.stop = true; renderAll(); if (S.on.cycle) { toast('<b>Claude started on the cycle</b>Waiting messages are answered in arrival order.'); queue('cycle'); } };
$('#mkProjOn').onchange = (e) => { S.on.project = e.target.checked; S.host.project = 'DESKTOP-FB · C:\\projects\\odeysys'; renderAll(); if (S.on.project) queue('project'); };
$('#mkListen').onchange = (e) => { S.listen = e.target.checked; renderAll(); };
$('#mkTunnel').onchange = (e) => { S.tunnel = e.target.checked; renderAll(); };
$('#mkAway').onclick = () => {
  const c = S.chats[S.scope];
  c.msgs.push({ id: nid(), kind: 'digest', at: now(), read: false,
    text: `**3 new cards** in Inbox (${M.c51} and 2 more) · **Verdicts:** ${M.ac3} not judged → met, ${M.ac8} still wrong · **Failed calls:** 2 (${M.call88}) · **Claude did:** moved ${M.c47} to In progress, answered 1 comment.`,
    claude: S.on[S.scope] ? `The two failures are the same NullPointerException; the 2 s slowdown started at the build - I'd look at ${M.c51} before re-testing ${M.c49}.` : null });
  S.stick = true; renderAll();
};
$('#mkHand').onclick = () => {
  const c = S.chats.cycle; S.host.cycle = 'LAPTOP-QA · C:\\work\\odeysys';
  c.msgs.push({ id: nid(), kind: 'sys', at: now(), text: `New Claude chat took over · LAPTOP-QA · handed the summary + ${c.since} later messages + 2 decisions` });
  S.scope = 'cycle'; S.stick = true; renderAll();
};
$('#mkCloseMid').onclick = async () => {
  S.scope = 'cycle'; S.on.cycle = true; $('#mkCycleOn').checked = true; renderAll();
  say('Why did the branch search return all branches?');
  await sleep(1300); S.on.cycle = false; $('#mkCycleOn').checked = false; if (S.run) S.run.stop = true;
  setTimeout(() => { renderAll(); toast('<b>Claude chat closed</b>The message is back to waiting; the steps so far stay visible.'); }, 600);
};
$("#mkFill").onclick = () => { const c = chat(); c.since = Math.max(c.since, c.autoN - 3); for (let i = 0; i < 3; i++) { const m = me(`Clicked through the search again (${c.since + 1})`, {}); c.msgs.push(m); bump(S.scope); } S.stick = true; renderAll(); };
$('#mkBatch').onclick = async () => {
  const c = S.chats.cycle; S.scope = 'cycle';
  if (!c.watch) { c.watch = true; c.msgs.push({ id: nid(), kind: 'sys', text: 'Watch on - this Claude checks calls as they arrive', at: now() }); }
  const m = cl('', { origin: 'watch · batch' }); m.text = `**Batch: calls 91–92 · still arriving…**\n${'@[call:n:91@c1|POST refunded-requests/search · 200 (call 91)]'} 2.4 s - slow (${M.c51})`;
  c.msgs.push(m); S.stick = true; renderAll();
  await sleep(1300); m.text = `**Batch: calls 91–94 · still arriving…**\n@[call:n:91@c1|POST refunded-requests/search · 200 (call 91)] 2.4 s - slow (${M.c51})\n@[call:n:93@c1|POST refunded-requests/search · 500 (call 93)] 500 - same NullPointerException as ${M.call88}`; renderStream();
  await sleep(1300); m.text = `**Batch: calls 91–95 · settled** - 2 findings, 3 clean\n@[call:n:91@c1|POST refunded-requests/search · 200 (call 91)] 2.4 s - slow (${M.c51})\n@[call:n:93@c1|POST refunded-requests/search · 500 (call 93)] 500 - same NullPointerException as ${M.call88}; ${M.ac8} still wrong`;
  bump('cycle'); renderAll(); arrived('cycle', m);
  if (S.listen) { await sleep(600); c.msgs.push({ id: nid(), kind: 'listen', who: 'claude', at: now(), origin: 'listen runner', text: `Batch 91–95: ${'@[call:n:93@c1|POST refunded-requests/search · 500 (call 93)]'} 500 · 1 ERROR log.` }); bump('cycle'); renderAll(); }
};
$('#mkClean').onclick = () => toast('<b>Batch of 4 calls - clean</b>Nothing posted to the chat (watch posts only batches with findings).');
$('#mkAc8').onclick = () => fire('AC8 passes', `${M.ac8} **passes** - ${'@[call:n:96@c1|POST refunded-requests/search · 200 (call 96)]'} with branch 2 returned 38 rows, all from branch 2. Watch ended.`, () => { S.ac8pass = true; });
$('#mk500').onclick = () => fire('any 500 happens', `${'@[call:n:97@c1|POST refunded-requests/search · 500 (call 97)]'} answered **500** - ${M.log1}. Watch ended.`);
function fire(label, text, pre) {
  const c = S.chats.cycle; const t = c.tells.find((x) => x.label === label);
  if (pre) pre();
  if (!t) { renderAll(); return toast(`<b>No watch for "${label}"</b>Ask "Tell me when ${label}" first.`); }
  c.tells = c.tells.filter((x) => x !== t);
  const m = cl(text, { origin: '⏰ ' + label }); c.msgs.push(m); bump('cycle'); S.stick = true; renderAll(); arrived('cycle', m);
}
$('#mkStale').onclick = async () => {
  const c = S.chats.cycle; S.scope = 'cycle';
  if (!c.msgs.some((m) => m.proposals && m.proposals.some((p) => p.staleIf && p.state === 'open'))) {
    c.msgs.push(cl('One more proposal:', { proposals: [{ id: 'p9', text: `Close ${M.c47} as Fine`, state: 'open', staleIf: 'c47done' }] }));
    S.stick = true; renderAll(); await sleep(1200);
  }
  S.c47done = true; S.cards.find((x) => x.n === 47).col = 'Done'; renderAll(); toast('<b>#47 is Done</b>The open "Close #47 as Fine" proposal now reads "outdated" and cannot be accepted.'); };
$('#stream').addEventListener('scroll', jumpCheck);
$('#jump').onclick = () => { const st = $('#stream'); st.scrollTop = st.scrollHeight; jumpCheck(); };
$('#mkBusy').onclick = () => { S.cardBusy.cycle = Date.now() + 8000; S.scope = 'cycle'; renderAll(); toast('<b>Claude is answering a card comment on #47</b>Chat messages sent now wait their turn - see "Nth in line".'); const iv = setInterval(() => { renderHead(); renderStream(); if (S.cardBusy.cycle < Date.now()) { clearInterval(iv); queue('cycle'); renderAll(); } }, 1000); };
$('#mkUnread').onclick = async () => {
  leave(S.scope);
  S.panel = false; renderAll();
  await sleep(700);
  const m = cl(`${M.call90 || '@[call:n:90@c1|POST refunded-requests/search · 200 (call 90)]'} after your click: still 3 branches. ${M.ac8} stays wrong.`, {});
  S.chats.cycle.msgs.push(m); bump('cycle'); arrived('cycle', m); renderAll();
};
$('#mkCov').onclick = coverageDialog;
$('#mkTermWork').onclick = () => { S.term.newer = '1:02 PM'; S.scope = 'cycle'; renderAll(); toast('<b>Terminal session edited RefundExport.java</b>The chat header says "terminal moved on". Your next chat message re-forks first.'); };
$('#mkTermRead').onclick = () => { S.term.items.forEach((i) => { if (i.state === 'sent') i.state = 'read'; }); renderAll(); toast('<b>Read</b>The terminal session picked the items up in board_wait.'); };
$('#mkTermClose').onclick = () => { const T = S.term; T.open = !T.open; if (T.open) T.items.forEach((i) => { if (i.state === 'held') i.state = 'sent'; }); renderAll(); toast(T.open ? '<b>Terminal session opened</b>Held items handed over in task_context.' : '<b>Terminal session closed</b>Items sent now wait for the next session on this cycle.'); };
$('#mkBusyTerm').onclick = () => {
  const q = S.term.items.filter((i) => i.state === 'next-turn' || i.state === 'queued');
  q.forEach((i) => (i.state = 'read'));
  if (q.length) S.chats.cycle.msgs.push({ id: nid(), kind: 'sys', text: `→ ${q.length} mirrored items reached your terminal session with its own turn - no extra wake-up`, at: now() });
  S.scope = 'cycle'; S.stick = true; renderAll();
  toast(q.length ? '<b>Delivered with the terminal\'s turn</b>It read every item before acting - no turn spent just to read them.' : '<b>Nothing was waiting</b>');
};
$('#mkTermCompact').onclick = () => { S.term.compacted = true; S.term.newer = now(); S.scope = 'cycle'; renderAll(); toast('<b>Terminal session compacted itself</b>The next chat message re-copies it (a delta would not line up) - the only case without a delta.'); };
$('#mkLaptop').onclick = () => { S.runnerHost = S.runnerHost === 'DESKTOP-FB' ? 'LAPTOP-QA' : 'DESKTOP-FB'; S.scope = 'cycle'; renderAll(); toast(S.runnerHost === 'LAPTOP-QA' ? '<b>The runner now runs on LAPTOP-QA</b>It cannot see the terminal session on DESKTOP-FB, so the chat starts its own session from Alfred\'s summary.' : '<b>Back on DESKTOP-FB</b>The chat continues its copy of the terminal session.'); };
$('#barSlim').onclick = () => { S.barSlim = !S.barSlim; saveView(); renderAll(); };
$('#barFind').oninput = (e) => { S.barFind = e.target.value; renderBar(); };
$('#mkPop').onclick = () => { S.fakePop = true; POPOUT = true; document.body.classList.add('popout'); S.view = 'dock'; S.panel = true; renderAll(); toast('<b>Separate window (preview)</b>What ⧉ opens: the chat alone. "⇲ Dock in the board" returns.'); };
document.querySelectorAll('.mockbar [data-say]').forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); say(b.dataset.say); }, true));

loadView();
if (POPOUT) { document.body.classList.add('popout'); S.view = 'dock'; S.panel = true; document.title = 'Alfred chat'; window.addEventListener('beforeunload', () => chan && chan.postMessage('dock')); }
seed();
renderAll();
</script>
