<!doctype html>
<html lang="en" data-theme="slate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board Chat Mock</title>
<style>
/* ===== Alfred's tokens: :root + the Slate block (frontend/src/styles.scss), copied as-is ===== */
:root { color-scheme:dark; --card-blur:3px; }
[data-theme='slate'] {
  --bg:#141416; --nav-bg:#141416; --card:rgba(255,255,255,.035); --card-elevated:rgba(255,255,255,.05); --card-inner:rgba(0,0,0,.3);
  --panel-bg:rgba(0,0,0,.2); --bg-2:rgba(255,255,255,.02); --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.18);
  --purple:#5b8def; --purple-light:#8fb2f7; --cyan:#7ee3d8; --text:#f2f2f5; --text-dim:#8b8b93; --text-faint:#5b5b63;
  --green:#7ee3a0; --amber:#e3a24a; --red:#e36a6a; --tok-key:#8fb2f7; --tok-string:#7ee3a0; --tok-number:#e3a24a; --tok-bool:#e37ec4; --tok-null:#6b6b73;
  --popover-solid:#1e1e21;
  --frost-tint:color-mix(in srgb,var(--popover-solid) 82%,transparent); --frost-tint-strong:color-mix(in srgb,var(--popover-solid) 92%,transparent);
  --frost-filter:blur(26px) saturate(1.5);
}
* { box-sizing:border-box; }
html,body { margin:0; height:100%; }
body { font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--text); font-size:16px; overflow:hidden; }
button { font:inherit; color:inherit; }
code, .mono { font:0.75rem Consolas,"Cascadia Mono",monospace; }
code { background:var(--card-inner); padding:0 0.3rem; border-radius:4px; }

/* ===== tab nav (.tab-nav, .nav-brand, .tab-badge) ===== */
.tab-nav { position:relative; z-index:11; display:flex; align-items:center; gap:.25rem; padding:0 1.25rem; background:var(--nav-bg); backdrop-filter:blur(var(--card-blur)); border-bottom:1px solid var(--border-strong); }
.tab-nav a { padding:.75rem 1rem; color:var(--text-dim); text-decoration:none; font-size:.9rem; font-weight:600; border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; }
.tab-nav a:hover { color:var(--text); } .tab-nav a.active { color:var(--purple-light); border-bottom-color:var(--purple); }
.nav-brand { display:inline-flex; align-items:center; gap:.5rem; margin-right:.75rem; padding-right:1rem; border-right:1px solid var(--border); height:1.75rem; flex-shrink:0; font-weight:800; letter-spacing:.12em; font-size:.9rem; }
.nav-brand i { width:7px; height:7px; border-radius:50%; background:var(--purple); display:inline-block; }
.nav-logo { width:28px; height:28px; border-radius:7px; background:linear-gradient(135deg,#2a2a30,#3a3f55); display:grid; place-items:center; font-size:.9rem; }
.tab-badge { font-size:.58rem; font-weight:700; letter-spacing:.04em; padding:.1rem .35rem; border-radius:6px; margin-left:.35rem; background:color-mix(in srgb,var(--purple) 25%,transparent); color:var(--purple-light); vertical-align:1px; }
.tab-badge.urgent { background:var(--amber); color:#1a1247; }
.nav-grow { flex:1; }
.chat-toggle { display:inline-flex; align-items:center; gap:.4rem; background:color-mix(in srgb,var(--purple) 12%,transparent); border:1px solid var(--border); color:var(--purple-light); border-radius:8px; padding:.3rem .7rem; font-size:.78rem; font-weight:600; cursor:pointer; }
.chat-toggle:hover { border-color:var(--border-strong); } .chat-toggle.on { background:var(--purple); color:#fff; border-color:var(--purple); }

/* ===== layout: page + docked chat panel ===== */
.shell { display:grid; grid-template-columns:minmax(0,1fr) auto; height:calc(100vh - 46px); }
.page { overflow:auto; }
.chat-dock { width:440px; border-left:1px solid var(--border-strong); background:var(--frost-tint-strong); backdrop-filter:var(--frost-filter); display:flex; flex-direction:column; min-height:0; position:relative; }
.chat-dock.closed { display:none; }
/* views: docked (left or right), expanded, full screen, separate window */
.shell { grid-template-columns:auto auto minmax(0,1fr)!important; }
.shell .chat-dock { border-left:0; border-right:1px solid var(--border-strong); }
.shell .chat-resize { left:auto; right:-4px; }
/* the chats bar - always docked on the left, like Messenger: every conversation, who is on, what is new */
.chat-bar { grid-column:1; } .chat-dock { grid-column:2; } .page { grid-column:3; }
.shell.full .chat-dock, body.popout .chat-dock { grid-column:2 / 4; }
.chat-bar { width:268px; display:flex; flex-direction:column; min-height:0; background:var(--nav-bg); border-right:1px solid var(--border-strong); }
.chat-bar.slim { width:64px; }
.bar-head { display:flex; align-items:center; gap:.4rem; padding:.6rem .7rem .4rem; }
.bar-head b { font-size:1rem; flex:1; }
.chat-bar.slim .bar-head { flex-direction:column; padding:.55rem 0 .3rem; }
.chat-bar.slim .bar-head b, .chat-bar.slim .bar-find, .chat-bar.slim .bar-txt, .chat-bar.slim .bar-sec, .chat-bar.slim .bar-wait { display:none; }
.bar-find { margin:0 .7rem .4rem; }
.bar-find input { width:100%; background:var(--card-inner); color:var(--text); border:1px solid var(--border); border-radius:99px; padding:.3rem .75rem; font-size:.78rem; }
.bar-list { flex:1; overflow-y:auto; padding:0 .35rem .6rem; }
.bar-sec { font-size:.6rem; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); margin:.55rem .45rem .2rem; }
.bar-item { position:relative; display:flex; align-items:center; gap:.6rem; width:100%; padding:.42rem .45rem; border:0; border-radius:10px; background:none; cursor:pointer; text-align:left; color:var(--text); }
.bar-item:hover { background:var(--card-elevated); }
.bar-item.on { background:color-mix(in srgb,var(--purple) 16%,transparent); }
.chat-bar.slim .bar-item { justify-content:center; padding:.35rem 0; }
.bar-av { position:relative; flex:none; width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:.78rem; }
.bar-av.project { background:color-mix(in srgb,var(--purple-light) 22%,transparent); color:var(--purple-light); }
.bar-av.cycle { background:color-mix(in srgb,var(--cyan) 18%,transparent); color:var(--cyan); }
.bar-st { position:absolute; right:-1px; bottom:-1px; width:12px; height:12px; border-radius:50%; border:2px solid #141416; background:var(--text-faint); }
.bar-st.on { background:var(--green); }
.bar-txt { flex:1; min-width:0; display:grid; grid-template-columns:minmax(0,1fr) auto; column-gap:.4rem; }
.bar-name { font-size:.84rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-time { font-size:.66rem; color:var(--text-faint); align-self:center; }
.bar-prev { grid-column:1 / -1; font-size:.74rem; color:var(--text-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-item.unread .bar-name, .bar-item.unread .bar-prev { color:var(--text); font-weight:700; }
.bar-item.unread .bar-time { color:var(--purple-light); font-weight:700; }
.bar-prev.typing { color:var(--purple-light); font-style:italic; }
.bar-typing { display:inline-flex; gap:2px; vertical-align:middle; margin-right:.2rem; }
.bar-typing i { width:4px; height:4px; border-radius:50%; background:var(--purple-light); animation:live-blink 1s infinite; }
.bar-typing i:nth-child(2) { animation-delay:.2s; } .bar-typing i:nth-child(3) { animation-delay:.4s; }
.bar-ub { position:absolute; right:.45rem; bottom:.5rem; min-width:18px; height:18px; padding:0 5px; border-radius:99px; background:var(--purple); color:#fff; font-size:.62rem; font-weight:700; display:grid; place-items:center; }
.chat-bar.slim .bar-ub { right:6px; top:2px; bottom:auto; }
.bar-wait { font-size:.6rem; color:var(--amber); }
.bar-foot { border-top:1px solid var(--border); padding:.4rem .7rem; font-size:.66rem; color:var(--text-faint); }
.chat-bar.slim .bar-foot { display:none; }
.chat-msg.me { margin-left:12%; }
.chat-msg.me > .board-ev-who { text-align:right; }
.chat-msg.claude, .chat-msg.alfred { margin-right:6%; }
/* the fork model: what the chat recorded in Alfred, what it sent to the terminal session, its session line */
.chat-auto { display:grid; grid-template-columns:1rem minmax(0,1fr) auto auto; align-items:baseline; gap:.4rem; font-size:.72rem; color:var(--text-dim); margin:.25rem 0 0 .2rem; }
.chat-auto > span:nth-child(2) { min-width:0; overflow-wrap:anywhere; }
.chat-auto .ic { width:1rem; text-align:center; flex:none; }
.chat-auto.rec .ic { color:var(--green); } .chat-auto.term .ic { color:var(--amber); } .chat-auto.term.urgent .ic { color:var(--red); }
.chat-auto.undone { text-decoration:line-through; opacity:.55; }
.chat-auto .st { font-size:.64rem; border:1px solid var(--border-strong); border-radius:99px; padding:0 .4rem; color:var(--text-faint); }
.chat-auto .st.read { color:var(--green); border-color:color-mix(in srgb,var(--green) 45%,transparent); }
.chat-auto .st.urg { color:var(--red); border-color:color-mix(in srgb,var(--red) 45%,transparent); }
.chat-session { display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; font-size:.7rem; color:var(--text-faint); margin-top:.3rem; }
.chat-session b { color:var(--text-dim); font-weight:600; }
.chat-session .moved { color:var(--amber); }
.chat-refresh { color:var(--cyan); }
.term-preview { font:.74rem/1.55 Consolas,monospace; background:var(--card-inner); border:1px solid var(--border); border-radius:9px; padding:.55rem .7rem; white-space:pre-wrap; margin:.4rem 0; }
.term-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:.5rem; align-items:baseline; padding:.4rem 0; border-bottom:1px solid var(--border); font-size:.8rem; }
/* the two memories (FR-059) */
.mem-pill { display:inline-flex; align-items:center; gap:.3rem; border:1px solid var(--border-strong); border-radius:99px; padding:0 .5rem; font-size:.68rem; color:var(--text-dim); background:var(--card); cursor:pointer; }
.mem-pill.claude { border-color:color-mix(in srgb,var(--purple) 45%,transparent); }
.mem-pill.alfred { border-color:color-mix(in srgb,var(--amber) 45%,transparent); }
.mem-pill b { color:var(--text); font-weight:600; }
.mem-grid { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; } @media (max-width:700px) { .mem-grid { grid-template-columns:1fr; } }
.mem-col { border:1px solid var(--border); border-radius:10px; padding:.6rem .75rem; font-size:.8rem; }
.mem-col.claude { border-color:color-mix(in srgb,var(--purple) 45%,transparent); }
.mem-col.alfred { border-color:color-mix(in srgb,var(--amber) 45%,transparent); }
.mem-col h4 { margin:0 0 .2rem; font-size:.82rem; } .mem-col ul { margin:.3rem 0 0; padding-left:1.1rem; } .mem-col li { margin:.15rem 0; }
.mem-flow { margin-top:.7rem; font-size:.78rem; display:grid; grid-template-columns:auto 1fr; gap:.25rem .6rem; }
.mem-flow b { color:var(--pl, var(--purple-light)); white-space:nowrap; }
/* token meter (FR-056) */
.chat-meter { display:flex; align-items:center; gap:.45rem; flex-wrap:wrap; font-size:.68rem; color:var(--text-faint); margin-top:.25rem; }
.chat-meter b { color:var(--text-dim); font-weight:600; }
.chat-meter .saved { color:var(--green); }
/* delivery ticks, queue position, urgent */
.chat-tick { font-size:.66rem; color:var(--text-faint); margin-left:.35rem; }
.chat-tick.got { color:var(--purple-light); } .chat-tick.done { color:var(--green); }
.chat-urgent { font-size:.62rem; font-weight:700; color:var(--red); border:1px solid color-mix(in srgb,var(--red) 50%,transparent); border-radius:99px; padding:0 .45rem; margin-left:.3rem; }
/* unread line + jump to latest */
.chat-newline { display:flex; align-items:center; gap:.5rem; font-size:.68rem; font-weight:700; color:var(--red); margin:.6rem 0; }
.chat-newline::before, .chat-newline::after { content:""; flex:1; border-top:1px solid color-mix(in srgb,var(--red) 55%,transparent); }
.chat-jump { position:absolute; right:1.2rem; bottom:9.5rem; z-index:6; border-radius:99px; box-shadow:0 6px 18px rgba(0,0,0,.45); }
/* reactions (the board's .board-react) */
.board-react { font-size:.74rem; background:var(--card-inner); border:1px solid var(--border); border-radius:999px; padding:0 .45rem; color:var(--text); cursor:pointer; line-height:1.5; }
.board-react.mine { border-color:var(--purple); }
.chat-reacts { display:flex; gap:.25rem; margin-top:.25rem; }
.chat-msg.me .chat-reacts { justify-content:flex-end; }
.chat-super { font-size:.62rem; color:var(--text-faint); border:1px dashed var(--border-strong); border-radius:99px; padding:0 .45rem; margin-left:.3rem; }
/* Needs you, mute, drafts in the bar */
.bar-sec.need { color:var(--amber); }
.bar-need { grid-column:1 / -1; font-size:.72rem; color:var(--amber); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.bar-draft { color:var(--red); }
.bar-mute { font-size:.7rem; margin-left:.25rem; opacity:.7; }
.bar-av.need { box-shadow:0 0 0 2px var(--amber); }
/* shared tab */
.chat-tabs { display:flex; gap:.25rem; margin-top:.45rem; }
.shared-group { margin-bottom:.8rem; }
.shared-group h5 { margin:0 0 .3rem; font-size:.64rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); display:flex; justify-content:space-between; }
.shared-row { display:flex; gap:.5rem; align-items:center; padding:.2rem .3rem; border-radius:6px; font-size:.74rem; }
.shared-row:hover { background:var(--card); }
.shared-row .board-dim { margin-left:auto; white-space:nowrap; }
/* two chats side by side */
.chat-dock2 { grid-column:3; width:400px; border-right:1px solid var(--border-strong); background:var(--frost-tint-strong); display:flex; flex-direction:column; min-height:0; }
.chat-dock2[hidden] { display:none; }
.shell.split { grid-template-columns:auto auto auto minmax(0,1fr)!important; }
.shell.split .page { grid-column:4; }
.shell.full.split .chat-dock { grid-column:2; width:auto!important; } .shell.full.split { grid-template-columns:auto 1fr 1fr!important; }
.shell.full.split .chat-dock2 { width:auto; }
.chat-dock2 .chat-stream { flex:1; }
.chat-dock2-foot { border-top:1px solid var(--border); padding:.5rem .8rem .7rem; display:flex; gap:.35rem; }
.chat-dock2-foot input { flex:1; background:var(--card-inner); color:var(--text); border:1px solid var(--border-strong); border-radius:8px; padding:.35rem .55rem; font-size:.8rem; }
/* quick switcher */
.qs-input { width:100%; background:var(--card-inner); color:var(--text); border:1px solid var(--border-strong); border-radius:9px; padding:.5rem .7rem; font-size:.95rem; }
.qs-list { margin-top:.5rem; }
.chat-dock.wide { width:min(62vw,1000px)!important; }
.chat-dock.wide .chat-resize { display:none; }
.shell.full { grid-template-columns:minmax(0,1fr); } .shell.full .page { display:none; }
.chat-dock.full { width:auto!important; border:0; background:var(--bg); }
.chat-dock.full .chat-resize { display:none; }
.chat-dock.full > .chat-head, .chat-dock.full > #chatBanners, .chat-dock.full > #chatSearch, .chat-dock.full > .chat-composer { width:min(980px,100%); margin-inline:auto; }
.chat-dock.full > .chat-stream { padding-inline:max(.9rem,calc((100% - 980px) / 2 + .9rem)); }
.chat-dock.away { width:250px!important; justify-content:center; align-items:center; text-align:center; padding:1rem; gap:.5rem; color:var(--text-dim); font-size:.8rem; }
.chat-views { display:inline-flex; border:1px solid var(--border-strong); border-radius:7px; overflow:hidden; margin-right:.25rem; }
.chat-views button { background:none; border:0; color:var(--text-dim); padding:.12rem .42rem; cursor:pointer; font-size:.8rem; line-height:1.2; }
.chat-views button:hover { color:var(--text); background:var(--card-elevated); }
.chat-views button.on { background:var(--purple); color:#fff; }
.chat-scopeseg { display:inline-flex; border:1px solid var(--border-strong); border-radius:7px; overflow:hidden; margin-left:.4rem; }
.chat-scopeseg button { background:none; border:0; color:var(--text-dim); padding:.08rem .55rem; cursor:pointer; font-size:.72rem; }
.chat-scopeseg button.on { background:var(--purple); color:#fff; }
body.popout .tab-nav, body.popout .page, body.popout .mockbar { display:none; }
body.popout .shell { height:100vh; grid-template-columns:minmax(0,1fr); }
body.popout .chat-dock { width:auto!important; border:0; }
body.popout .chat-resize { display:none; }
.chat-resize { position:absolute; left:-4px; top:0; bottom:0; width:8px; cursor:ew-resize; z-index:5; }
.chat-resize:hover { background:color-mix(in srgb,var(--purple) 25%,transparent); }

/* ===== board page (copied rules) ===== */
.board-page { padding:.75rem 1.25rem 6rem; }
.board-head { display:flex; align-items:center; gap:.75rem; flex-wrap:wrap; margin-bottom:.6rem; }
.board-head h1 { margin:0; font-size:1.15rem; }
.board-head select, select.board-select { background:var(--card-inner); color:var(--text); border:1px solid var(--border-strong); border-radius:8px; padding:.3rem .6rem; font:inherit; font-size:.82rem; }
.board-seg { display:inline-flex; border:1px solid var(--border-strong); border-radius:9px; overflow:hidden; }
.board-seg button { background:none; border:0; padding:.3rem .8rem; color:var(--text-dim); cursor:pointer; font-size:.8rem; }
.board-seg button.on { background:var(--purple); color:#fff; }
.board-viewonly { font-size:.78rem; color:var(--amber); border:1px dashed var(--amber); border-radius:99px; padding:.15rem .6rem; }
.board-progress { display:flex; align-items:center; gap:.6rem; font-size:.75rem; color:var(--text-dim); margin-bottom:.6rem; flex-wrap:wrap; }
.board-pbar { flex:1; max-width:420px; min-width:120px; height:7px; border-radius:99px; background:var(--card-inner); overflow:hidden; display:flex; }
.board-pbar i { display:block; height:100%; }
.board-columns { display:grid; grid-template-columns:repeat(7,minmax(180px,1fr)); gap:.6rem; overflow-x:auto; padding-bottom:1rem; }
.board-col { background:var(--panel-bg); border:1px solid var(--border); border-radius:12px; padding:.45rem; min-height:320px; }
.board-col-head { display:flex; justify-content:space-between; align-items:center; font-size:.68rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-dim); margin:.1rem .25rem .5rem; }
.board-col-count { color:var(--text-faint); }
.board-card { position:relative; background:var(--card-elevated); border:1px solid var(--border); border-radius:10px; padding:.5rem .6rem; margin-bottom:.45rem; cursor:pointer; overflow:hidden; }
.board-card:hover { border-color:var(--border-strong); }
.board-card.flash { animation:call-flash 2.4s ease-out; }
.board-card-row { display:flex; gap:.25rem; flex-wrap:wrap; align-items:center; margin-bottom:.25rem; }
.board-card-title { font-weight:600; font-size:.85rem; margin:.1rem 0 .25rem; color:var(--text); }
.board-card-foot { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; color:var(--text-faint); font-size:.68rem; }
.board-card-reason { color:var(--text-faint); font-size:.7rem; font-style:italic; }
.board-kind { font-size:.6rem; font-weight:700; padding:.05rem .35rem; border-radius:4px; letter-spacing:.04em; }
.board-kind-BUG { background:color-mix(in srgb,var(--red) 18%,transparent); color:var(--red); }
.board-kind-TASK { background:color-mix(in srgb,var(--cyan) 15%,transparent); color:var(--cyan); }
.board-kind-NOTE { background:color-mix(in srgb,var(--purple-light) 15%,transparent); color:var(--purple-light); }
.board-kind-QUESTION { background:color-mix(in srgb,var(--amber) 15%,transparent); color:var(--amber); }
.board-ai { color:var(--purple-light); } .board-cyc { color:var(--cyan); }
.board-res { font-size:.65rem; padding:.02rem .45rem; border-radius:99px; background:var(--card-inner); border:1px solid var(--border); }
.board-empty { color:var(--text-faint); font-size:.75rem; text-align:center; padding:1rem .4rem; border:1px dashed var(--border); border-radius:10px; }
.board-dim { color:var(--text-faint); font-size:.75rem; }
.board-link { background:none; border:0; color:var(--purple-light); cursor:pointer; font-size:.75rem; padding:0 .2rem; text-decoration:underline; }
.board-widgets { display:flex; gap:.6rem; flex-wrap:wrap; margin:0 0 .7rem; }
.board-widget { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:.5rem .7rem; width:340px; }
.board-widget h5 { margin:0 0 .3rem; font-size:.7rem; text-transform:uppercase; letter-spacing:.05em; color:var(--text-dim); display:flex; justify-content:space-between; }

/* ===== mention chips (.board-mention*) ===== */
.board-mention { position:relative; display:inline-flex; align-items:center; gap:.2rem; padding:0 .4rem; border-radius:5px; font-size:.72rem; font-family:Consolas,"Cascadia Mono",monospace; background:color-mix(in srgb,var(--purple) 16%,transparent); color:var(--purple-light); border:1px solid var(--border); cursor:pointer; white-space:nowrap; max-width:100%; vertical-align:baseline; line-height:1.55; }
.board-mention:hover { border-color:var(--border-strong); }
.board-mention.removed { opacity:.55; text-decoration:line-through; }
.board-mention-call { background:color-mix(in srgb,var(--cyan) 12%,transparent); color:var(--cyan); }
.board-mention-log { background:color-mix(in srgb,var(--amber) 12%,transparent); color:var(--amber); }
.board-mention-stmt { background:color-mix(in srgb,var(--green) 12%,transparent); color:var(--green); }
.board-mention-code { background:color-mix(in srgb,var(--tok-bool) 12%,transparent); color:var(--tok-bool); }
.board-mention-redis { background:color-mix(in srgb,var(--red) 10%,transparent); color:var(--red); }
.board-mention-chat { background:color-mix(in srgb,var(--purple-light) 10%,transparent); color:var(--purple-light); border-style:dashed; }
.board-mention-dot { display:inline-block; width:.45rem; height:.45rem; border-radius:50%; margin-left:.25rem; flex:none; background:var(--text-faint); }
.dot-ok { background:var(--green)!important; } .dot-warn { background:var(--amber)!important; } .dot-bad { background:var(--red)!important; } .dot-info { background:var(--cyan)!important; }
#tip { display:none; position:fixed; z-index:400; width:340px; background:var(--popover-solid); border:1px solid var(--border-strong); border-radius:9px; padding:.5rem .6rem; color:var(--text); font:.75rem/1.45 system-ui,sans-serif; box-shadow:0 10px 30px rgba(0,0,0,.5); pointer-events:none; }
#tip .l { display:block; overflow-wrap:anywhere; } #tip .l:first-child { font-weight:600; } #tip .dim { color:var(--text-faint); }

/* ===== buttons (.action-btn) ===== */
.action-btn { background:color-mix(in srgb,var(--purple) 12%,transparent); border:1px solid var(--border); color:var(--purple-light); font-size:.68rem; font-weight:600; padding:.22rem .55rem; border-radius:6px; cursor:pointer; white-space:nowrap; }
.action-btn:hover { border-color:var(--border-strong); background:color-mix(in srgb,var(--purple) 22%,transparent); }
.action-btn.primary { background:var(--purple); border-color:var(--purple); color:#fff; }
.action-btn.danger { background:color-mix(in srgb,var(--red) 18%,transparent); border-color:color-mix(in srgb,var(--red) 45%,transparent); color:var(--red); }
.action-btn.ok { background:color-mix(in srgb,var(--green) 14%,transparent); border-color:color-mix(in srgb,var(--green) 45%,transparent); color:var(--green); }
.action-btn:disabled { opacity:.45; cursor:default; }
.board-tog { border:1px solid var(--border); background:none; border-radius:99px; padding:.05rem .55rem; font-size:.68rem; color:var(--text-faint); cursor:pointer; }
.board-tog.on { color:var(--text); border-color:var(--purple); background:color-mix(in srgb,var(--purple) 15%,transparent); }
.board-action-chip { font:.74rem system-ui,sans-serif; border:1px dashed var(--border-strong); border-radius:7px; padding:.15rem .6rem; color:var(--purple-light); background:color-mix(in srgb,var(--purple) 6%,transparent); cursor:pointer; }

/* ===== live work (.live-box, .live-step ...) and the strip (.board-live) ===== */
.live-spinner { display:inline-block; width:10px; height:10px; flex:none; border-radius:50%; border:2px solid color-mix(in srgb,var(--purple) 35%,transparent); border-top-color:var(--purple); animation:live-spin .8s linear infinite; }
@keyframes live-spin { to { transform:rotate(360deg); } } @keyframes live-blink { 0%,100%{opacity:1} 50%{opacity:.2} }
.live-box { margin:.4rem 0 .2rem 0; border-left:2px solid var(--purple); padding:.4rem .6rem; border-radius:0 8px 8px 0; background:color-mix(in srgb,var(--purple) 7%,transparent); font-size:.78rem; }
.live-box.stopped { border-left-color:var(--text-faint); opacity:.8; }
.live-head { display:flex; gap:.4rem; align-items:center; color:var(--purple-light); font-weight:600; margin-bottom:.25rem; }
.live-head .live-time { margin-left:auto; font-weight:400; color:var(--text-faint); font-size:.7rem; }
.live-step { display:flex; gap:.45rem; align-items:baseline; padding:.06rem 0; color:var(--text-dim); }
.live-step.now { color:var(--text); } .live-step.now .live-mk { color:var(--purple-light); }
.live-mk { width:.9rem; flex:none; text-align:center; color:var(--green); }
.live-draft { margin-top:.3rem; color:var(--text); white-space:pre-wrap; }
.live-caret { display:inline-block; width:7px; height:.95em; margin-left:1px; background:var(--purple-light); vertical-align:text-bottom; animation:live-blink .8s infinite; }
.board-pulse { width:9px; height:9px; border-radius:50%; background:var(--green); animation:board-pulse 1.6s infinite; flex:none; display:inline-block; }
.board-pulse.off { background:var(--text-faint); animation:none; } .board-pulse.amber { background:var(--amber); animation:none; }
@keyframes board-pulse { 0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--green) 70%,transparent)} 70%{box-shadow:0 0 0 8px transparent} 100%{box-shadow:0 0 0 0 transparent} }
@keyframes call-flash { 0%{background:color-mix(in srgb,var(--purple) 35%,transparent)} 100%{background:transparent} }

/* ===== timeline entries (.board-ev*) reused for chat messages ===== */
.board-ev-who { font-size:.72rem; color:var(--text-dim); }
.board-ev-body { background:var(--panel-bg); border:1px solid var(--border); border-radius:9px; padding:.4rem .6rem; margin-top:.15rem; }
.board-ev-acts { display:flex; gap:.7rem; align-items:center; margin-top:.2rem; font-size:.72rem; }
.board-ev-badge { font-size:.62rem; padding:0 .45rem; border-radius:999px; border:1px solid var(--amber); color:var(--amber); margin-left:.3rem; }
.board-ev-badge.answered { border-color:var(--green); color:var(--green); } .board-ev-badge.dim { border-color:var(--border-strong); color:var(--text-faint); } .board-ev-badge.info { border-color:var(--cyan); color:var(--cyan); }
.board-ev-reply { margin:.35rem 0 0 1rem; padding-left:.6rem; border-left:2px solid var(--border-strong); }
.board-ev-reply.claude { border-left-color:var(--purple); }
.board-ev-replybox { margin:.4rem 0 0 1rem; padding:.45rem .55rem; border:1px solid var(--purple); border-radius:9px; background:var(--card-inner); }
.board-ev-replyto { display:flex; justify-content:space-between; gap:.5rem; font-size:.72rem; color:var(--text-dim); margin-bottom:.3rem; }
.board-md { line-height:1.65; font-size:.82rem; color:var(--text); }
.board-md p { margin:0 0 .35rem; } .board-md p:last-child { margin:0; }
.board-md-pre { background:var(--card-inner); border:1px solid var(--border); border-radius:8px; padding:.5rem .7rem; white-space:pre-wrap; word-break:break-word; font:.72rem/1.5 Consolas,monospace; margin:.3rem 0; }
.board-md blockquote { margin:.2rem 0 .4rem; padding:.15rem .6rem; border-left:3px solid var(--border-strong); color:var(--text-dim); }
.board-md-table { border-collapse:collapse; margin:.3rem 0; font-size:.72rem; width:100%; }
.board-md-table th, .board-md-table td { border:1px solid var(--border); padding:.2rem .4rem; text-align:left; vertical-align:top; }
.board-md-table th { color:var(--text-dim); font-weight:600; background:var(--card-inner); }
.board-editor textarea { width:100%; box-sizing:border-box; resize:vertical; background:var(--card-inner); color:var(--text); border:1px solid var(--border-strong); border-radius:8px; padding:.45rem .6rem; font:inherit; font-size:.82rem; min-height:3.4rem; outline:none; }
.board-editor textarea:focus { border-color:var(--purple); }
.board-editor textarea:disabled { opacity:.5; }

/* ===== the chat panel (new) - built from the pieces above ===== */
.chat-head { padding:.7rem .9rem .5rem; border-bottom:1px solid var(--border); }
.chat-title { display:flex; align-items:center; gap:.45rem; }
.chat-title b { font-size:.95rem; }
.chat-scope { font-size:.6rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase; padding:.05rem .4rem; border-radius:4px; }
.chat-scope.cycle { background:color-mix(in srgb,var(--cyan) 15%,transparent); color:var(--cyan); }
.chat-scope.project { background:color-mix(in srgb,var(--purple-light) 15%,transparent); color:var(--purple-light); }
.chat-x { margin-left:auto; display:flex; gap:.25rem; }
.chat-icon { background:none; border:1px solid transparent; color:var(--text-dim); border-radius:6px; padding:.1rem .35rem; cursor:pointer; font-size:.82rem; }
.chat-icon:hover { border-color:var(--border-strong); color:var(--text); } .chat-icon.on { color:var(--purple-light); border-color:var(--purple); }
.chat-icon:disabled { opacity:.4; cursor:default; }
.chat-runner { display:flex; align-items:center; gap:.45rem; font-size:.72rem; color:var(--text-dim); margin-top:.35rem; flex-wrap:wrap; }
.chat-runner .host { color:var(--text-faint); }
.chat-watch { display:flex; flex-wrap:wrap; gap:.3rem; margin-top:.4rem; }
.chat-wchip { display:inline-flex; align-items:center; gap:.3rem; font-size:.68rem; border:1px solid var(--border-strong); border-radius:99px; padding:.05rem .5rem; color:var(--text-dim); background:var(--card); }
.chat-wchip.live { border-color:color-mix(in srgb,var(--green) 50%,transparent); color:var(--green); }
.chat-wchip.tell { border-color:color-mix(in srgb,var(--cyan) 50%,transparent); color:var(--cyan); }
.chat-wchip.listen { border-color:color-mix(in srgb,var(--amber) 50%,transparent); color:var(--amber); }
.chat-wchip button { background:none; border:0; color:inherit; cursor:pointer; padding:0; font-size:.68rem; opacity:.7; } .chat-wchip button:hover { opacity:1; }
.chat-banner { margin:.5rem .9rem 0; font-size:.74rem; border-radius:9px; padding:.45rem .6rem; }
.chat-banner.view { color:var(--amber); border:1px dashed var(--amber); }
.chat-banner.start { border:1px solid color-mix(in srgb,var(--amber) 45%,transparent); background:color-mix(in srgb,var(--amber) 7%,transparent); color:var(--text); }
.chat-banner.start h6 { margin:0 0 .25rem; font-size:.74rem; color:var(--amber); }
.chat-cmd { display:flex; align-items:center; gap:.4rem; margin:.2rem 0; }
.chat-cmd code { flex:1; padding:.15rem .4rem; }
.chat-search { margin:.5rem .9rem 0; display:flex; gap:.35rem; align-items:center; }
.chat-search input { flex:1; background:var(--card-inner); color:var(--text); border:1px solid var(--border-strong); border-radius:8px; padding:.25rem .55rem; font-size:.78rem; }
.chat-search-sum { font-size:.68rem; color:var(--text-dim); margin:.2rem .9rem 0; }
.chat-filters { display:flex; gap:.25rem; flex-wrap:wrap; margin:.3rem .9rem 0; }
.chat-stream { flex:1; overflow-y:auto; padding:.6rem .9rem 1rem; overscroll-behavior:contain; }
.chat-day { text-align:center; font-size:.65rem; color:var(--text-faint); margin:.4rem 0 .6rem; letter-spacing:.05em; text-transform:uppercase; }
.chat-msg { position:relative; margin-bottom:.75rem; }
.chat-msg.me .board-ev-body { background:color-mix(in srgb,var(--cyan) 6%,var(--panel-bg)); border-color:color-mix(in srgb,var(--cyan) 22%,var(--border)); }
.chat-msg.flash > .board-ev-body { animation:call-flash 2.4s ease-out; }
.chat-msg.hit > .board-ev-body { outline:1px solid var(--amber); }
.chat-msg.dimmed { opacity:.35; }
.chat-msg .who-dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:.3rem; vertical-align:0; background:var(--text-faint); }
.chat-msg.me .who-dot { background:var(--cyan); } .chat-msg.claude .who-dot { background:var(--purple); } .chat-msg.alfred .who-dot { background:var(--amber); }
.chat-hover { position:absolute; right:.3rem; top:-.55rem; display:none; flex-wrap:wrap; justify-content:flex-end; max-width:calc(100% - .6rem); gap:.15rem; background:var(--popover-solid); border:1px solid var(--border-strong); border-radius:7px; padding:.1rem .2rem; z-index:3; box-shadow:0 6px 18px rgba(0,0,0,.4); }
.chat-msg:hover > .chat-hover { display:flex; }
.chat-hover button { background:none; border:0; color:var(--text-dim); font-size:.68rem; padding:.1rem .3rem; border-radius:5px; cursor:pointer; white-space:nowrap; }
.chat-hover button:hover { background:var(--card-elevated); color:var(--text); } .chat-hover button:disabled { opacity:.35; cursor:default; }
.chat-ctx { display:flex; flex-wrap:wrap; gap:.25rem; align-items:center; margin-bottom:.25rem; font-size:.66rem; color:var(--text-faint); }
.chat-decision { font-size:.62rem; font-weight:700; color:var(--amber); border:1px solid color-mix(in srgb,var(--amber) 50%,transparent); border-radius:99px; padding:0 .45rem; margin-left:.3rem; }
.chat-origin { font-size:.62rem; color:var(--text-faint); border:1px solid var(--border); border-radius:99px; padding:0 .45rem; margin-left:.3rem; }
.chat-thread-toggle { background:none; border:0; color:var(--purple-light); cursor:pointer; padding:0; font-size:.72rem; }
.chat-sys { display:flex; align-items:center; gap:.5rem; font-size:.7rem; color:var(--text-faint); margin:.7rem 0; }
.chat-sys::before, .chat-sys::after { content:""; flex:1; border-top:1px dashed var(--border-strong); }
.chat-fold { border:1px solid var(--border); border-radius:10px; background:var(--card); margin-bottom:.75rem; }
.chat-fold-head { display:flex; align-items:center; gap:.45rem; padding:.4rem .6rem; cursor:pointer; font-size:.74rem; color:var(--text-dim); }
.chat-fold-head b { color:var(--text); font-weight:600; }
.chat-fold-body { border-top:1px dashed var(--border); padding:.5rem .6rem; }
.chat-fold.summary { border-color:color-mix(in srgb,var(--purple) 40%,var(--border)); }
.chat-fold.digest { border-color:color-mix(in srgb,var(--amber) 45%,var(--border)); }
.chat-fold.digest .chat-fold-head b { color:var(--amber); }
.chat-old { opacity:.82; border-left:2px solid var(--border-strong); padding-left:.55rem; margin-top:.5rem; }
.chat-proposals { display:flex; flex-direction:column; gap:.3rem; margin-top:.4rem; }
.chat-prop { display:flex; gap:.45rem; align-items:center; flex-wrap:wrap; padding:.3rem .45rem; border:1px dashed var(--border-strong); border-radius:8px; background:color-mix(in srgb,var(--purple) 5%,transparent); font-size:.76rem; }
.chat-prop { display:grid!important; grid-template-columns:auto minmax(0,1fr) auto auto; }
.chat-prop:not(:has(input)) { grid-template-columns:minmax(0,1fr) auto auto; }
.chat-prop .what { min-width:0; overflow-wrap:anywhere; }
.chat-prop .what .board-mention, .board-md .board-mention, .chat-ctx .board-mention { white-space:normal; overflow-wrap:anywhere; word-break:break-word; max-width:100%; }
.chat-prop .state { grid-column:1 / -1; }
.chat-prop .action-btn { align-self:start; }
.chat-prop.accepted { border-style:solid; border-color:color-mix(in srgb,var(--green) 50%,transparent); }
.chat-prop.declined { opacity:.55; }
.chat-prop.stale { border-color:color-mix(in srgb,var(--amber) 45%,transparent); }
.chat-prop .state { font-size:.68rem; } .chat-prop .state.ok { color:var(--green); } .chat-prop .state.warn { color:var(--amber); } .chat-prop .state.dim { color:var(--text-faint); }
.chat-prop input[type=checkbox] { accent-color:var(--purple); }
.chat-bulk-foot { display:flex; gap:.35rem; justify-content:flex-end; margin-top:.3rem; }
.chat-consent { margin-top:.4rem; border:1px solid color-mix(in srgb,var(--amber) 45%,transparent); border-radius:9px; padding:.4rem .55rem; font-size:.76rem; background:color-mix(in srgb,var(--amber) 6%,transparent); }
.chat-consent h6 { margin:0 0 .2rem; font-size:.7rem; color:var(--amber); text-transform:uppercase; letter-spacing:.05em; }
.chat-fix { margin-top:.4rem; border:1px solid color-mix(in srgb,var(--green) 40%,transparent); border-radius:9px; padding:.4rem .55rem; font-size:.76rem; }
.chat-fix h6 { margin:0 0 .25rem; font-size:.7rem; color:var(--green); text-transform:uppercase; letter-spacing:.05em; }
.diff { font:.7rem/1.5 Consolas,monospace; background:var(--card-inner); border:1px solid var(--border); border-radius:8px; padding:.35rem .5rem; margin:.3rem 0; white-space:pre; overflow-x:auto; }
.diff .add { color:var(--green); } .diff .del { color:var(--red); }
.calldiff { display:grid; grid-template-columns:1fr 1fr; gap:.35rem; margin-top:.35rem; }
.calldiff > div { background:var(--card-inner); border:1px solid var(--border); border-radius:8px; padding:.35rem .45rem; font:.68rem/1.55 Consolas,monospace; min-width:0; overflow-wrap:anywhere; }
.calldiff h6 { margin:0 0 .2rem; font:600 .66rem system-ui; color:var(--text-dim); }
.calldiff .chg { background:color-mix(in srgb,var(--amber) 18%,transparent); border-radius:3px; }
.calldiff .sec { color:var(--text-faint); margin-top:.25rem; display:block; }
.visual { background:var(--card-inner); border:1px solid var(--border); border-radius:8px; padding:.4rem; margin-top:.35rem; }
.visual-acts { display:flex; justify-content:space-between; align-items:center; font-size:.66rem; color:var(--text-faint); margin-top:.25rem; }
.qblock { margin-top:.4rem; border:1px solid color-mix(in srgb,var(--amber) 40%,var(--border)); border-radius:10px; padding:.45rem .55rem; background:var(--card); }
.qblock-tabs { display:flex; gap:.3rem; flex-wrap:wrap; margin-bottom:.4rem; }
.qblock-tab { padding:.1rem .6rem; border-radius:99px; font-size:.72rem; border:1px solid var(--border); color:var(--text-dim); background:none; cursor:pointer; }
.qblock-tab.on { border-color:var(--purple); color:var(--text); background:color-mix(in srgb,var(--purple) 25%,transparent); }
.qblock-tab.ans { color:var(--green); border-color:color-mix(in srgb,var(--green) 50%,var(--border)); } .qblock-tab.ans::before { content:'✓ '; }
.qblock-q { font-weight:650; font-size:.82rem; margin-bottom:.3rem; }
.qblock-opt { display:grid; grid-template-columns:22px 1fr auto; gap:.45rem; align-items:start; padding:.35rem .5rem; border:1px solid var(--border); border-radius:8px; margin-bottom:.3rem; cursor:pointer; font-size:.76rem; background:var(--card-elevated); }
.qblock-opt:hover { border-color:var(--border-strong); } .qblock-opt.sel { border-color:var(--purple); background:color-mix(in srgb,var(--purple) 14%,transparent); }
.qblock-key { width:20px; height:20px; border-radius:5px; display:grid; place-items:center; font-size:.66rem; font-weight:700; background:var(--card-inner); border:1px solid var(--border); color:var(--text-dim); }
.qblock-opt.sel .qblock-key { background:var(--purple); color:#fff; }
.qblock-rec { font-size:.6rem; font-weight:700; color:var(--green); border:1px solid color-mix(in srgb,var(--green) 45%,transparent); border-radius:99px; padding:0 .4rem; }
.qblock-od { color:var(--text-dim); font-size:.7rem; }
.qblock-foot { display:flex; justify-content:space-between; align-items:center; margin-top:.3rem; font-size:.7rem; color:var(--text-dim); }

.chat-composer { border-top:1px solid var(--border); padding:.55rem .9rem .7rem; position:relative; }
.chat-cbar { display:flex; flex-wrap:wrap; gap:.3rem; align-items:center; margin-bottom:.35rem; font-size:.68rem; color:var(--text-faint); }
.chat-cchip { display:inline-flex; align-items:center; gap:.2rem; }
.chat-cchip > button { background:none; border:0; color:var(--text-faint); cursor:pointer; padding:0 .1rem; font-size:.7rem; } .chat-cchip > button:hover { color:var(--red); }
.chat-quote { font-size:.72rem; color:var(--text-dim); border-left:3px solid var(--purple); padding:.15rem .5rem; margin-bottom:.35rem; display:flex; gap:.4rem; background:var(--card-inner); border-radius:0 6px 6px 0; }
.chat-quote span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chat-quote button { background:none; border:0; color:var(--text-faint); cursor:pointer; }
.chat-crow { display:flex; align-items:center; gap:.35rem; margin-top:.35rem; }
.chat-crow .grow { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.66rem; color:var(--text-faint); }
.chat-crow .action-btn { flex:none; }
.chat-img { display:inline-flex; align-items:center; gap:.3rem; border:1px solid var(--border); border-radius:6px; padding:.1rem .35rem; font-size:.66rem; color:var(--text-dim); background:var(--card); }
.chat-thumb { display:inline-block; width:120px; height:66px; border-radius:6px; border:1px solid var(--border); background:linear-gradient(135deg,#25262c,#1a2a3a); margin:.25rem 0; position:relative; }
.chat-thumb::after { content:"screenshot.png"; position:absolute; bottom:3px; left:5px; font:.58rem Consolas,monospace; color:var(--text-dim); }
.picker { position:absolute; left:.9rem; right:.9rem; bottom:calc(100% - .3rem); max-height:300px; overflow:auto; background:var(--popover-solid); border:1px solid var(--border-strong); border-radius:10px; box-shadow:0 -10px 30px rgba(0,0,0,.5); z-index:20; padding:.3rem; display:none; }
.picker.open { display:block; }
.picker h6 { margin:.3rem .4rem .15rem; font-size:.62rem; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); }
.picker-row { display:flex; gap:.5rem; align-items:baseline; padding:.25rem .45rem; border-radius:6px; cursor:pointer; font-size:.76rem; }
.picker-row:hover, .picker-row.sel { background:color-mix(in srgb,var(--purple) 18%,transparent); }
.picker-row .k { font:.72rem Consolas,monospace; color:var(--purple-light); min-width:8.5rem; }
.picker-row .d { color:var(--text-dim); font-size:.7rem; }
.picker-hint { font-size:.64rem; color:var(--text-faint); padding:.2rem .45rem; border-top:1px solid var(--border); margin-top:.2rem; }

/* settings popover, dialogs, toasts, menus */
.pop { position:absolute; right:.6rem; top:3.2rem; width:300px; background:var(--popover-solid); border:1px solid var(--border-strong); border-radius:10px; padding:.7rem .8rem; box-shadow:0 20px 60px rgba(0,0,0,.5); z-index:30; font-size:.78rem; display:none; }
.pop.open { display:block; }
.pop h6 { margin:0 0 .5rem; font-size:.7rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; }
.pop label { display:flex; align-items:center; gap:.45rem; margin:.4rem 0; }
.pop input[type=number] { width:4.5rem; background:var(--card-inner); color:var(--text); border:1px solid var(--border-strong); border-radius:6px; padding:.15rem .35rem; }
.pop .note { font-size:.68rem; color:var(--text-faint); margin:-.2rem 0 .3rem 1.4rem; }
.dlg-back { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:flex-start; justify-content:center; padding:60px 16px; z-index:200; overflow:auto; }
.dlg-back.open { display:flex; }

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let seq = 900;
const nid = () => ++seq;

/* ------------------------------------------------------------------ data */

const CHATS = {

};
const isCycle = (k) => CHATS[k].kind === 'cycle';
const nameOf = (k) => CHATS[k].name;
const lastId = (k) => { const ms = S.chats[k].msgs; return ms.length ? ms[ms.length - 1].id : 0; };
const S = {
  tab: 'board', scope: 'cycle', panel: true, tunnel: false, width: 440, view: 'dock', prevView: 'dock', side: 'right',

  /* the cycle chat's own Claude session: a fork of the terminal session (FR-002, FR-052) */

/* seed history */

  }));

    text: `Batch of 6 calls (82–87): ${M.call88} 500 · 1 ERROR log. Others clean.` });

function me(text, o = {}) { return { id: nid(), who: 'me', kind: 'text', text, state: 'answered', at: o.at || now(), ctx: o.ctx || [], decision: !!o.decision, replies: o.replies || [], origin: o.origin }; }

/* --------------------------------------------------------------- markdown */
function md(text) {
  const blocks = String(text).split(/\n```\n?/);
  let html = '';
  blocks.forEach((b, i) => {
    if (i % 2) { html += `<pre class="board-md-pre">${esc(b)}</pre>`; return; }
    b.split(/\n/).forEach((line) => {
      if (!line.trim()) return;
      if (line.startsWith('> ')) { html += `<blockquote>${inline(line.slice(2))}</blockquote>`; return; }

}
function inline(s) {

}
function chip(type, ref, label) {

  if (key === 'spec:c1/*#ac8' && S.ac8pass) dot = 'ok';

}

}

function renderSearchSum() { const el = $('.chat-search-sum'); const { hits, folded } = searchCount(); if (el) el.textContent = `${hits} match${hits === 1 ? '' : 'es'}${folded ? ` · ${folded} inside a compacted fold (opened)` : ''}`; else renderSearch(); }
function matches(m) {

  if (f === 'decisions' && !m.decision) return false;

function searchCount() {

}

function renderMsg(m, searching) {
  if (m.kind === 'sys') return `<div class="chat-sys">${esc(m.text)} · ${esc(m.at)}</div>`;
  if (m.kind === 'summary') {
    const open = chat().openFolds.has(m.id) || (searching && m.old.some(matches));
    return `<div class="chat-fold summary" id="m${m.id}"><div class="chat-fold-head" data-fold="${m.id}"><span>${open ? '▾' : '▸'}</span><b>Compacted by Claude</b><span>· ${m.covers} messages folded · ${esc(m.at)}</span><span style="margin-left:auto" class="board-dim">nothing deleted</span></div>
      <div class="chat-fold-body">${md(m.text)}${open ? m.old.map((o) => `<div class="chat-old ${searching && !matches(o) ? 'dimmed' : ''}">${bubble(o, searching, true)}</div>`).join('') + `<div class="board-dim" style="margin-top:.4rem">… ${m.covers - m.old.length} more - all kept, in search and in the board export</div>` : ''}</div></div>`;
  }
  if (m.kind === 'digest') {
    const open = !m.read || chat().openFolds.has(m.id);
    return `<div class="chat-fold digest" id="m${m.id}"><div class="chat-fold-head" data-fold="${m.id}" data-digest="1"><span>${open ? '▾' : '▸'}</span><b>Since you left</b><span>· 45 min · built by Alfred</span>${m.read ? '<span class="board-dim" style="margin-left:auto">read</span>' : ''}</div>
      ${open ? `<div class="chat-fold-body">${md(m.text)}${m.claude ? `<div style="margin-top:.4rem;border-top:1px dashed var(--border);padding-top:.35rem"><span class="board-ev-who"><span class="who-dot" style="background:var(--purple)"></span>Claude's read</span>${md(m.claude)}</div>` : `<div class="board-dim" style="margin-top:.3rem">Claude adds its reading when it is on.</div>`}</div>` : ''}</div>`;
  }
  return bubble(m, searching, false);
}

function bubble(m, searching, inFold) {
  const dim = searching && !matches(m) && !(m.replies || []).some(matches);
  const who = m.who === 'me' ? 'You' : m.who === 'alfred' ? 'Alfred' : 'Claude';
  const badges = [];
  if (m.urgent && m.state === 'waiting') badges.push('<span class="chat-urgent">⚡ answer first</span>');
  if (m.superseded) badges.push('<span class="chat-super">asked again ↓</span>');
  if (m.state === 'answering') badges.push(`<span class="board-ev-badge info">Claude is on it</span>`);
  if (m.state === 'cancelled') badges.push(`<span class="board-ev-badge dim">cancelled</span>`);
  if (m.state === 'stopped') badges.push(`<span class="board-ev-badge dim">stopped</span>`);
  if (m.edited) badges.push(`<span class="board-ev-badge dim">edited</span>`);
  if (m.decision) badges.push(`<span class="chat-decision" title="Every later Claude session is handed this">★ Decision</span>`);
  if (m.origin) badges.push(`<span class="chat-origin">${esc(m.origin)}</span>`);
  const ctx = m.ctx && m.ctx.length ? `<div class="chat-ctx">looking at ${m.ctx.map((c) => inline(c)).join(' ')}</div>` : '';
  const quote = m.quote ? `<blockquote style="margin:0 0 .3rem;padding:.1rem .5rem;border-left:3px solid var(--border-strong);color:var(--text-dim);font-size:.74rem">${inline(m.quote)}</blockquote>` : '';
  const imgs = m.imgs ? '<span class="chat-thumb"></span>'.repeat(m.imgs) : '';
  const body = m.state === 'cancelled' ? `<div class="board-md" style="text-decoration:line-through;color:var(--text-faint)">${inline(m.text)}</div>` : md(m.text);
  const steps = m.steps && m.who === 'claude' ? `<div class="board-dim" style="margin-top:.25rem"><button class="board-link" data-steps="${m.id}" style="font-size:.68rem;padding:0">▸ ${m.steps.length} steps</button>${m.showSteps ? m.steps.map((s) => `<div class="live-step"><span class="live-mk">✓</span>${esc(s)}</div>`).join('') : ''}</div>` : '';
  const live = m.live ? liveBox(m.live) : '';
  const extra = (m.proposals ? proposals(m) : '') + (m.extra ? extraHtml(m) : '');
  const autos = autoLines(m);
  const acts = inFold ? '' : hoverActs(m);
  const thread = inFold ? '' : threadHtml(m, searching);
  const waitActs = m.state === 'waiting' && m.who === 'me' && canWrite() ? `<div class="board-ev-acts"><button class="board-link" data-act="edit" data-id="${m.id}">Edit</button><button class="board-link" data-act="cancel" data-id="${m.id}">Cancel</button>${m.urgent ? '' : `<button class="board-link" data-act="urgent" data-id="${m.id}" title="Put this ahead of everything waiting for this Claude">⚡ Answer first</button>`}</div>` : '';
  const editing = S.editing === m.id;
  return `<div class="chat-msg ${m.who} ${dim ? 'dimmed' : ''} ${searching && !dim && (S.search || S.filter !== 'all') && matches(m) ? 'hit' : ''}" id="m${m.id}">
    ${acts}
    <div class="board-ev-who"><span class="who-dot"></span><b style="color:var(--text)">${who}</b> · ${esc(m.at)}${m.who === 'me' ? tick(m) : ''}${badges.join('')}</div>
    <div class="board-ev-body">${ctx}${quote}${editing ? `<div class="board-editor"><textarea id="editTa">${esc(m.text)}</textarea></div><div class="chat-crow"><span class="grow"></span><button class="action-btn" data-act="editCancel">Cancel</button><button class="action-btn primary" data-act="editSave" data-id="${m.id}">Save</button></div>` : body}${imgs}${extra}${steps}</div>
    ${autos}${reactsHtml(m)}${live}${waitActs}${thread}</div>`;

/* delivery, like Messenger: sent → Claude has it → answered */
function tick(m) {
  if (m.state === 'cancelled') return '';
  if (m.state === 'waiting') {
    const n = S.on[S.scope] ? lineOf(m, S.scope) : 0;
    return `<span class="chat-tick" title="Sent - Alfred holds it until this chat's Claude picks it up">✓ sent${n ? ` · ${nth(n)} in line` : ' · waiting for Claude'}</span>`;
  }
  if (m.state === 'answering') return '<span class="chat-tick got" title="Claude picked it up (board_wait)">✓✓ Claude has it</span>';
  if (m.state === 'stopped') return '<span class="chat-tick">✓✓ stopped</span>';
  return '<span class="chat-tick done" title="Answered">✓✓ answered</span>';
}
function reactsHtml(m) {
  const r = m.reacts || {};
  const keys = Object.keys(r).filter((k) => r[k]);
  return keys.length ? `<div class="chat-reacts">${keys.map((k) => `<button class="board-react mine" data-act="react" data-id="${m.id}" data-r="${k}" title="${k === '❓' ? 'You asked Claude to explain more' : 'Your reaction'}">${k} ${r[k]}</button>`).join('')}</div>` : '';

/* "✓ recorded the UTC decision in the brief · Undo" and "→ sent to the terminal session · urgent · read" (FR-049, FR-051) */
function autoLines(m) {
  const out = [];
  for (const r of m.records || []) {
    out.push(`<div class="chat-auto rec ${r.undone ? 'undone' : ''}"><span class="ic">✓</span><span>${inline(r.text)}</span>${r.undone ? '<span class="st">undone</span>' : canWrite() ? `<button class="board-link" data-act="undoRec" data-id="${m.id}" data-r="${r.id}" style="font-size:.68rem">Undo</button>` : ''}</div>`);
  }
  for (const t of m.sent || []) {
    const it = S.term.items.find((x) => x.id === t);
    if (!it) continue;
    const st = it.state === 'next-turn' ? '<span class="st" title="No extra wake-up: it reaches the terminal with the next turn it takes anyway">rides its next turn</span>' : it.state === 'queued' ? '<span class="st">queued - terminal busy</span>' : it.state === 'read' ? '<span class="st read">read</span>' : it.state === 'undone' ? '<span class="st">taken back</span>' : it.state === 'held' ? '<span class="st">waits for the next terminal session</span>' : '<span class="st">sent</span>';
    const body = it.mirror ? 'mirrored to your terminal session in full <span class="board-dim">(SQL, diffs and charts as references)</span>' : `${it.urgent ? '<span class="st urg">urgent</span> ' : ''}sent to your terminal session: ${inline(it.text)}`;
    out.push(`<div class="chat-auto term ${it.urgent ? 'urgent' : ''} ${it.state === 'undone' ? 'undone' : ''}"><span class="ic">→</span><span>${body}</span>${st}${it.state === 'sent' || it.state === 'held' || it.state === 'next-turn' ? (canWrite() ? `<button class="board-link" data-act="undoSent" data-r="${it.id}" style="font-size:.68rem">Undo</button>` : '') : ''}</div>`);

}

function staleReason(p) {

function proposals(m) {

/* leaving a chat remembers where you read to and what you were typing; opening it brings both back */
function leave(k) { if (!k) return; S.readMark[k] = lastId(k); S.drafts[k] = $('#ta').value; }
function goTo(k) {
  if (S.scope !== k || !S.panel) { leave(S.scope); $('#ta').value = S.drafts[k] || ''; }
  if (S.split === k) S.split = S.scope !== k ? S.scope : null;
  S.scope = k; S.panel = true; S.unread[k] = 0; S.stick = true; S.shared = false;
}

/* the chats bar (Messenger-style): every conversation, newest first, project on top */
/* what in this chat waits on the user: Claude's open questions, proposals, a confirm */
function needsYou(k) {
  let q = 0, p = 0, c = 0;
  for (const m of S.chats[k].msgs) {
    if (m.extra && m.extra.type === 'questions' && !m.extra.sent) q++;
    if (m.extra && m.extra.type === 'consent' && m.extra.state === 'open') c++;
    if (m.proposals) p += m.proposals.filter((x) => x.state === 'open' && !staleReason(x)).length;
  }
  const parts = [];
  if (q) parts.push(`${q} question${q > 1 ? 's' : ''}`);
  if (p) parts.push(`${p} proposal${p > 1 ? 's' : ''}`);
  if (c) parts.push(`${c} to confirm`);
  return parts.length ? parts.join(' · ') + ' waiting on you' : '';
}
function lastOf(k) { const ms = S.chats[k].msgs.filter((m) => m.text && m.kind !== 'sys'); return ms[ms.length - 1]; }
function renderBar() {
  $('#bar').classList.toggle('slim', S.barSlim);

    const waiting = S.chats[k].msgs.filter((x) => x.state === 'waiting').length;
    const un = S.unread[k] || 0;
    const who = m ? (m.who === 'me' ? 'You: ' : '') : '';
    const draft = k !== S.scope && S.drafts[k];
    const need = needsYou(k);
    const prev = need ? `<span class="bar-need">⚑ ${esc(need)}</span>` : draft ? `<span class="bar-prev"><span class="bar-draft">Draft:</span> ${esc(draft)}</span>` : typing ? '<span class="bar-prev typing"><span class="bar-typing"><i></i><i></i><i></i></span>Claude is typing…</span>'
      : `<span class="bar-prev">${esc(who + (m ? plainOf(m.text).replace(/\n/g, ' ') : 'No messages yet'))}</span>`;
    return `<button class="bar-item ${S.scope === k && S.panel ? 'on' : ''} ${un ? 'unread' : ''}" data-chat="${k}" data-tipname="${esc(c.name)}" data-tipline="${esc((S.on[k] ? 'Claude is on · ' : 'No Claude · ') + (typing ? 'typing…' : m ? plainOf(m.text).slice(0, 80) : ''))}">

      ${un ? `<span class="bar-ub">${un}</span>` : ''}</button>`;
  };
  const needKeys = Object.keys(CHATS).filter((k) => needsYou(k) && CHATS[k].name.toLowerCase().includes(q));
  const cycles = Object.keys(CHATS).filter((k) => isCycle(k) && !needKeys.includes(k) && CHATS[k].name.toLowerCase().includes(q));

function loadView() { try { const v = JSON.parse(localStorage.getItem('alfred.chat.view') || '{}'); if (v.view) S.view = v.view; if (v.slim != null) S.barSlim = v.slim; if (v.width) S.width = v.width; } catch { /* fine */ } }

/* ---------------------------------------------------------- sending & Claude */
function send(text, opts = {}) {
  text = text.trim();
  if (!text && !S.imgs) return;
  if (!canWrite()) return;
  const scope = opts.scope || S.scope;
  const c = S.chats[scope];
  const slash = /^\/alfred-[a-z-]+/.exec(text);
  const bridge = scope === 'project' && /^@cycle\b/i.test(text);
  const m = me(text, { ctx: opts.ctx ?? S.ctx.slice(), origin: opts.origin || (slash ? 'skill ' + slash[0] : bridge ? 'asks cycle chat' : undefined) });
  m.quote = S.quote; m.imgs = S.imgs; m.state = 'waiting'; m.urgent = S.urgentNext; S.urgentNext = false; S.drafts[scope] = '';
  S.quote = null; S.imgs = 0; S.askItem = null; S.dismissedCtx.clear();
  c.msgs.push(m); bump(scope);
  S.stick = true;
  renderAll();
  if (bridge) return bridgeAsk(m);
  if (S.on[scope]) queue(scope);
}
function bump(scope) {
  const c = S.chats[scope];
  c.since++;
  if (c.autoOn && c.since >= c.autoN) { c.since = c.autoN; setTimeout(() => compact(scope, true), 400); }
}

/* one queue per Claude, in arrival order (card comments share it in the product) */
const busy = {};
async function queue(scope) {
  if (busy[scope]) return;
  busy[scope] = true;
  try {
    for (;;) {
      while ((S.cardBusy[scope] || 0) > Date.now()) { await sleep(300); }
      if (!S.on[scope]) break;
      const pend = pending(scope);
      const next = pend[0];
      if (!next) break;
      // FR-055c: messages waiting together are answered in one run - one context read, each keeps its own reply
      if (pend.length > 1 && !next.oneRun) pend.forEach((m, i) => { m.oneRun = `one run · ${pend.length} messages`; if (i > 0) m.oneRunSaved = 13000; });
      next.handled = true; next.state = 'answering';
      await answer(scope, next);
    }
  } finally { busy[scope] = false; }
}

/* the line for one Claude: urgent first, then arrival order (card comments share it in the product) */
function pending(scope) {
  const all = S.chats[scope].msgs.filter((m) => m.who === 'me' && m.state === 'waiting' && !m.handled);
  return [...all.filter((m) => m.urgent), ...all.filter((m) => !m.urgent)];
}
function lineOf(m, scope) {
  const i = pending(scope).indexOf(m);
  if (i < 0) return 0;
  const ahead = i + ((S.cardBusy[scope] || 0) > Date.now() ? 1 : 0) + (S.chats[scope].msgs.some((x) => x.state === 'answering') ? 1 : 0);
  return ahead + 1;
}
const nth = (n) => n + (n % 10 === 1 && n !== 11 ? 'st' : n % 10 === 2 && n !== 12 ? 'nd' : n % 10 === 3 && n !== 13 ? 'rd' : 'th');

/* a new copy of the terminal session: the chat continues from it */
function refork(note) {
  const T = S.term;
  T.forkAt = now(); T.seenUpTo = T.newer || now(); T.newer = null; T.chatSession = Math.random().toString(16).slice(2, 10);
  S.chats.cycle.msgs.push({ id: nid(), kind: 'sys', text: note, at: now() });
}
/* FR-050/051: one item for the terminal session - in board_wait as "From the board chat"; held while no terminal is open */
function sendToTerm(text, urgent, why, mirror) {
  const it = { id: nid(), text, urgent: !!urgent, why: why || '', mirror: !!mirror, at: now(), state: !S.term.open ? 'held' : !urgent ? 'next-turn' : 'sent' };
  S.term.items.push(it);
  return it.id;
}
/* every 10 messages that recorded something, a summary goes to the terminal (and on every compact) */
function countRecording() { /* every exchange is mirrored now (FR-050) - no separate batches */ }
function batchToTerm(why) {
  // the terminal already has every exchange in full - a compact sends only a pointer to the summary
  const sum = [...S.chats.cycle.msgs].reverse().find((m) => m.kind === 'summary');
  if (!sum) return;
  sendToTerm(`the chat was compacted - summary at chat_read ${sum.id} (you already have the messages it covers)`, false, why);
  S.chats.cycle.msgs.push({ id: nid(), kind: 'sys', text: '→ told your terminal session the chat was compacted (a pointer, not the text again)', at: now() });
}

async function answer(scope, q) {
  const c = S.chats[scope];
  const plan = reply(q.text, scope);
  // FR-052: the terminal did significant work since the chat's copy - take a new copy before answering
  if (scope === 'cycle' && S.term.newer && S.term.open) {
    if (S.term.compacted) {
      plan.steps = ['re-copy the terminal session (it compacted itself)', ...plan.steps];
      refork(`↻ re-copied terminal session · ${S.term.newer} - it compacted itself, so a delta would not line up; the chat messages it lacked came along`);
      S.term.compacted = false; plan.saved = null;
    } else {
      plan.steps = ['add the terminal\'s new entries (delta, +6.2k)', ...plan.steps];
      refork(`↻ caught up with terminal session · ${S.term.newer} - added its 14 new entries (+6.2k), not a re-copy`);
      plan.saved = { n: 113800, why: 'delta catch-up instead of re-copy' };
    }
  }
  q.live = { steps: [], secs: 0, draft: '' };
  const run = { stop: false, q };
  S.run = run;
  for (const s of plan.steps) {
    if (run.stop || !S.on[scope]) break;
    q.live.steps.push(s); q.live.secs += 1 + Math.floor(Math.random() * 2);
    if (S.scope === scope && S.panel) renderStream();
    renderBar();
    await sleep(520);
  }
  if (!run.stop && S.on[scope]) {
    const words = plan.text.match(/@\[[^\]]+\]|\s+|[^\s@]+|@/g) || [];
    for (let i = 0; i < Math.min(words.length, 22); i += 3) {
      q.live.draft = words.slice(0, i + 3).join(''); if (S.scope === scope && S.panel) renderStream(); await sleep(70);
    }
  }
  if (run.stop || !S.on[scope]) {
    q.live.stopped = true; q.state = S.on[scope] ? 'stopped' : 'waiting'; if (!S.on[scope]) { q.handled = false; }
    renderAll(); return;
  }
  delete q.live;
  q.state = 'answered';
  const r = cl(plan.text, { steps: plan.steps, proposals: plan.proposals, extra: plan.extra });
  if (plan.records) r.records = plan.records.map((x) => ({ ...x, id: nid() }));
  if (q.oneRun) r.origin = q.oneRun;
  const inTok = 12000 + Math.floor(Math.random() * 4000);
  S.meter = { input: inTok, cached: inTok - 900, output: 300 + Math.floor(Math.random() * 500), mirror: scope === 'cycle' ? 420 : 0,
    saved: plan.saved ? plan.saved.n : q.oneRunSaved || (scope === 'cycle' && !S.term.busy ? 12400 : 0),
    why: plan.saved ? plan.saved.why : q.oneRunSaved ? 'one run for waiting messages' : 'mirror rides the terminal\'s next turn' };
  if (plan.toTerm && scope === 'cycle') r.sent = plan.toTerm.map((x) => sendToTerm(x.text, x.urgent, x.why));
  // FR-050: every exchange is mirrored into the terminal in full prose - one item, bulky parts as references
  if (scope === 'cycle' && q.origin !== 'from project chat') (r.sent ||= []).push(sendToTerm(`Q: "${plainOf(q.text).slice(0, 90)}" → A: ${plainOf(r.text).replace(/\n/g, ' ')}${r.extra && /visual|diff|compare|fix/.test(r.extra.type) ? ` · ${r.extra.type} as a reference (chat_read ${r.id}#${r.extra.type})` : ''}`, false, 'exchange', true));
  if (plan.bulk) r.bulk = true;
  c.msgs.push(r); bump(scope);
  if (plan.after) plan.after(r);
  arrived(scope, r);
  renderAll();
}

function arrived(scope, r) {
  const visible = S.panel && (S.scope === scope || S.split === scope);
  const level = S.mute[scope] || 'all';
  const important = (r.extra && r.extra.type === 'questions') || /\b5\d\d\b|ERROR|fail/i.test(plainOf(r.text || ''));
  if (level === 'muted' || (level === 'important' && !important)) return;
  if (!visible) {
    S.unread[scope]++;
    toast(`<b>Claude replied · ${esc(nameOf(scope))}</b>${esc(plainOf(r.text).slice(0, 110))}`, () => { S.panel = true; S.scope = scope; S.unread[scope] = 0; S.stick = true; renderAll(); }, true);

  }
}
const plainOf = (t) => t.replace(/@\[[a-z]+:[^|\]]+\|([^\]]+)\]/g, '$1').replace(/\*\*/g, '');

/* project → cycle bridge: one record, shown in both chats */
async function bridgeAsk(m) {
  const q = m.text.replace(/^@cycle\s*/i, '').replace(/^branch search:\s*/i, '');
  const inCycle = me(q, { origin: 'from project chat' });
  inCycle.state = S.on.cycle ? 'answering' : 'waiting';
  S.chats.cycle.msgs.push(inCycle); bump('cycle');
  m.state = 'answering'; m.text += `\n> sent to cycle **${CYCLE.name}** - its Claude answers in both chats`;
  renderAll();
  if (!S.on.cycle) { m.state = 'waiting'; renderAll(); return; }
  inCycle.handled = true;
  await answer('cycle', inCycle);
  const last = S.chats.cycle.msgs[S.chats.cycle.msgs.length - 1];
  last.origin = 'answer also in project chat';
  m.state = 'answered';
  S.chats.project.msgs.push(cl(last.text, { origin: `from cycle "${CYCLE.name}"` }));
  arrived('project', last);
  renderAll();
}

/* compaction: Claude writes the summary, nothing is deleted */
async function compact(scope, auto) {
  const c = S.chats[scope];
  if (!S.on[scope]) { c.msgs.push({ id: nid(), kind: 'sys', text: `${auto ? 'Auto-compact' : 'Compact'} waiting - runs when Claude starts`, at: now() }); renderAll(); return; }
  const tmp = cl('', {}); tmp.live = { title: 'Compacting', steps: ['reads the messages since the last summary', 'keeps decisions, findings, open questions'], secs: 3, draft: '' };
  tmp.text = auto ? `Auto-compact - ${c.autoN} messages since the last summary.` : 'Compacting on your request.';
  c.msgs.push(tmp); renderAll();
  await sleep(1400);
  const idx = c.msgs.map((m) => m.kind).lastIndexOf('summary');
  const prev = idx >= 0 ? c.msgs[idx] : null;
  const from = idx >= 0 ? idx + 1 : 0;
  // a message still waiting or being answered is never folded - it stays below the summary
  const span = c.msgs.slice(from).filter((m) => m !== tmp);
  const inFlight = (m) => m.state === 'waiting' || m.state === 'answering' || m.live;
  const folded = span.filter((m) => m.kind !== 'sys' && !inFlight(m));
  const kept = span.filter(inFlight);
  // the earlier summary is folded into the new one: one fold, everything before it kept
  c.msgs = c.msgs.slice(0, idx >= 0 ? idx : 0).filter((m) => m !== tmp);
  const prevCovers = prev ? prev.covers : 0;
  c.msgs.push({ id: nid(), kind: 'summary', who: 'claude', at: now(), covers: folded.length + prevCovers, old: [...(prev ? prev.old : []), ...folded],
    text: `**Compacted · ${folded.length + prevCovers} messages folded**\n**Decisions:** AC8 stays WRONG until one branch returns only its rows · Dates in UTC.\n**Findings:** ${M.c49} fixed, waiting for re-test · ${M.c51} new (join added in the build).\n**Open:** confirm the 2 s slowdown after the fix.\nA new Claude chat on this cycle starts from here.` });
  c.msgs.push(...kept);
  c.since = kept.length;
  if (scope === 'cycle') batchToTerm('compact');
  renderAll();
}

/* 🗂 Shared: everything the chat mentions, grouped, newest first - like Messenger's shared media */
function sharedHtml(k) {
  const groups = { call: 'Calls', stmt: 'Statements', log: 'Log lines', card: 'Cards', spec: 'Acceptance items and spec files', code: 'Code', page: 'Pages and reports', chat: 'Chat messages' };
  const seen = {}; const out = {};
  const walk = (m) => {
    for (const x of String(m.text || '').matchAll(/@\[([a-z]+):([^|\]]+)\|([^\]]+)\]/g)) {
      const key = x[1] + ':' + x[2]; if (seen[key]) continue; seen[key] = 1;
      (out[x[1]] ||= []).push({ chip: chip(x[1], x[2], x[3]), id: m.id, at: m.at });
    }
    if (m.extra && m.extra.type === 'visual') (out.visual ||= []).push({ chip: '<span class="board-mention">📊 Search duration chart</span>', id: m.id, at: m.at });
    if (m.extra && m.extra.type === 'report') (out.page ||= []).push({ chip: chip('page', 'c1/status-report', 'page: status report'), id: m.id, at: m.at });
    if (m.imgs) (out.file ||= []).push({ chip: '<span class="board-mention">🖼 screenshot.png</span>', id: m.id, at: m.at });
    (m.replies || []).forEach(walk); (m.old || []).forEach(walk);
  };
  [...S.chats[k].msgs].reverse().forEach(walk);
  groups.visual = 'Visuals'; groups.file = 'Images and files';
  const keys = Object.keys(groups).filter((g) => out[g]);
  if (!keys.length) return '<div class="board-empty">Nothing shared in this chat yet.</div>';
  return `<div class="board-dim" style="margin-bottom:.6rem">Everything this chat mentions - folded messages too. ↗ jumps to the message.</div>` + keys.map((g) => `<div class="shared-group"><h5><span>${groups[g]}</span><span>${out[g].length}</span></h5>${out[g].map((r) => `<div class="shared-row">${r.chip}<span class="board-dim">${esc(r.at)}</span><button class="board-link" data-act="jumpTo" data-id="${r.id}" title="Show the message">↗</button></div>`).join('')}</div>`).join('');
}

/* Ctrl+K: jump to any chat by name */
function quickSwitch() {
  dialog(`<h2>Go to a chat</h2><input class="qs-input" id="qs" placeholder="Type a cycle or project name…"><div class="qs-list" id="qsList"></div><p class="board-dim" style="margin-top:.6rem">↑↓ to choose · Enter opens · Esc closes</p>`);
  let sel = 0;
  const draw = () => {
    const q = $('#qs').value.toLowerCase();
    const ks = Object.keys(CHATS).filter((k) => CHATS[k].name.toLowerCase().includes(q));
    sel = Math.min(sel, Math.max(0, ks.length - 1));
    $('#qsList').innerHTML = ks.map((k, i) => `<div class="picker-row ${i === sel ? 'sel' : ''}" data-qs="${k}"><span class="bar-av ${CHATS[k].kind}" style="width:26px;height:26px;font-size:.62rem">${CHATS[k].av}</span><span>${esc(CHATS[k].name)}</span><span class="d" style="margin-left:auto">${S.on[k] ? '● Claude on' : 'no Claude'}${S.unread[k] ? ` · ${S.unread[k]} new` : ''}${needsYou(k) ? ' · ⚑ needs you' : ''}</span></div>`).join('') || '<div class="board-dim">No chat matches.</div>';
    return ks;
  };
  let ks = draw();
  const qs = $('#qs'); qs.focus();
  qs.oninput = () => { sel = 0; ks = draw(); };
  qs.onkeydown = (e) => {
    if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, ks.length - 1); ks = draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, 0); ks = draw(); e.preventDefault(); }
    if (e.key === 'Enter' && ks[sel]) { closeDialog(); goTo(ks[sel]); renderAll(); }
  };
  $('#qsList').onclick = (e) => { const r = e.target.closest('[data-qs]'); if (r) { closeDialog(); goTo(r.dataset.qs); renderAll(); } };
}

function offerUndo(props, before, what) {
  let done = false;
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<b>${esc(what)}</b>Applied as you. <button class="action-btn" style="margin-left:.4rem">Undo</button> <span class="board-dim" id="undoT">5</span>`;
  $('#toasts').append(t);
  let n = 5; const iv = setInterval(() => { n--; const el = t.querySelector('#undoT'); if (el) el.textContent = n; if (n <= 0) { clearInterval(iv); t.remove(); } }, 1000);
  t.querySelector('button').onclick = (e) => {
    e.stopPropagation(); if (done) return; done = true; clearInterval(iv); t.remove();
    props.forEach((p) => (p.state = 'open'));
    before.forEach((b) => { const c = S.cards.find((x) => x.n === b.n); if (c) { c.col = b.col; c.reason = b.reason; } });
    renderAll(); toast('<b>Undone</b>Back as it was - the proposals are open again.');
  };
}
