<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alfred Streams Mock</title>
<style>
  :root {
    --bg: #141416; --surface: rgba(255,255,255,.05); --surface2: rgba(255,255,255,.035); --well: rgba(0,0,0,.2); --input: rgba(0,0,0,.3);
    --line: rgba(255,255,255,.09); --line2: rgba(255,255,255,.18);
    --text: #f2f2f5; --dim: #8b8b93; --faint: #5f5f68;
    --blue: #5b8def; --blue-l: #8fb2f7; --blue-bg: rgba(91,141,239,.12);
    --green: #34d399; --amber: #fbbf24; --red: #f87171; --violet: #a78bfa; --violet-bg: rgba(167,139,250,.13);
    --drawer: rgba(30,30,33,.94); --pop: #1e1e22;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }

  /* ---- mock controls (not part of Alfred) ---- */
  .sim { position: sticky; top: 0; z-index: 90; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 6px 16px; background: repeating-linear-gradient(135deg, #2a2210 0 10px, #241d0d 10px 20px); border-bottom: 1px solid rgba(251,191,36,.35); font-size: 12px; color: #fde68a; min-height: 33px; }
  .sim b { color: #fff; }
  .sim .who { display: inline-flex; border: 1px solid rgba(251,191,36,.4); border-radius: 7px; overflow: hidden; }
  .sim .who button { background: transparent; border: 0; border-right: 1px solid rgba(251,191,36,.3); padding: 3px 11px; cursor: pointer; color: #fde68a; }
  .sim .who button:last-child { border-right: 0; }
  .sim .who button.on { background: rgba(251,191,36,.25); color: #fff; font-weight: 700; }
  .sim label { display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
  .sim input { accent-color: var(--amber); margin: 0; }
  .sim .sbtn { background: rgba(0,0,0,.25); border: 1px solid rgba(251,191,36,.4); border-radius: 6px; padding: 2px 9px; cursor: pointer; color: #fde68a; }
  .sp { flex: 1; }

  /* ---- Alfred header ---- */
  .hdr { display: flex; align-items: stretch; gap: 2px; padding: 0 24px; border-bottom: 1px solid var(--line); background: var(--bg); position: sticky; top: 33px; z-index: 50; }
  .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; letter-spacing: .08em; color: var(--blue-l); padding-right: 18px; margin-right: 6px; border-right: 1px solid var(--line); white-space: nowrap; }
  .logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
  .logo .hat { font-size: 20px; }
  .tabsx { display: flex; overflow-x: auto; }
  .hdr .tab { display: flex; align-items: center; gap: 5px; padding: 14px 13px; color: var(--dim); font-weight: 600; font-size: 14px; cursor: pointer; white-space: nowrap; border-bottom: 2px solid transparent; }
  .hdr .tab.on { color: var(--blue-l); border-color: var(--blue-l); }
  .hdr .tab:hover { color: var(--text); }
  .new { font-size: 10px; font-weight: 700; background: var(--blue); color: #fff; border-radius: 99px; padding: 0 6px; }
  .hdr .right { margin-left: auto; display: flex; align-items: center; gap: 8px; padding-left: 12px; }
  .hbadge { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line2); background: var(--surface); border-radius: 99px; padding: 3px 10px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .hbadge.warn { border-color: rgba(251,191,36,.5); color: var(--amber); background: rgba(251,191,36,.08); }
  .hbadge.vio { border-color: rgba(167,139,250,.5); color: var(--violet); background: var(--violet-bg); }
  .page { padding: 22px 26px 140px; max-width: 1500px; }
  h1 { font-size: 22px; margin: 0 0 4px; font-weight: 700; }
  .lead { color: var(--dim); margin: 0 0 16px; font-size: 13px; }

  /* ---- common ---- */
  .btn { display: inline-flex; align-items: center; gap: 5px; background: var(--surface); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--text); }
  .btn:hover { border-color: rgba(255,255,255,.3); }
  .btn.p { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.r { color: var(--red); }
  .btn:disabled { opacity: .38; cursor: not-allowed; }
  .ab { display: inline-flex; align-items: center; gap: 4px; background: var(--blue-bg); color: var(--blue-l); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .ab.p { background: var(--blue); color: #fff; border-color: var(--blue); }
  .ab.r { color: var(--red); background: rgba(248,113,113,.08); }
  .ab:disabled { opacity: .38; cursor: not-allowed; }
  .pillf { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--dim); background: var(--surface2); border: 1px solid var(--line); border-radius: 99px; padding: 2px 10px; cursor: pointer; white-space: nowrap; }
  .pillf.on { color: var(--blue-l); border-color: var(--blue); background: var(--blue-bg); }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--line2); background: var(--surface); white-space: nowrap; }
  .c-local { color: var(--dim); border-color: var(--line); }
  .origin { color: var(--violet); border-color: rgba(167,139,250,.5); background: var(--violet-bg); cursor: pointer; font-weight: 600; }
  .origin:hover { filter: brightness(1.2); }
  .out { color: var(--blue-l); border-color: rgba(91,141,239,.5); background: var(--blue-bg); cursor: pointer; font-weight: 600; }
  .c-off { color: var(--dim); border-style: dashed; background: transparent; }
  .c-ok { color: var(--green); border-color: rgba(52,211,153,.4); background: rgba(52,211,153,.07); }
  .c-bad { color: var(--red); border-color: rgba(248,113,113,.45); background: rgba(248,113,113,.07); }
  .ok { color: var(--green); } .bad { color: var(--red); } .warn { color: var(--amber); } .dim { color: var(--dim); } .faint { color: var(--faint); } .small { font-size: 12px; }
  .in { background: var(--input); border: 1px solid var(--line2); border-radius: 8px; padding: 6px 11px; color: var(--text); }
  .in:disabled { opacity: .5; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; border: 0; border-right: 1px solid var(--line2); padding: 5px 12px; cursor: pointer; font-size: 13px; color: var(--dim); }
  .seg button:last-child { border-right: 0; }
  .seg button.on { background: var(--blue); color: #fff; font-weight: 600; }
  .lbl { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 18px 0 8px; font-weight: 600; }
  .lbl .faint { text-transform: none; letter-spacing: 0; }
  .panel { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .empty { color: var(--dim); padding: 18px; border: 1px dashed var(--line2); border-radius: 10px; text-align: center; font-size: 13px; }
  code { background: rgba(0,0,0,.35); padding: 1px 5px; border-radius: 4px; font-size: 12px; font-family: "Cascadia Code", Consolas, monospace; }
  pre { background: rgba(0,0,0,.35); padding: 10px 12px; border-radius: 8px; font-size: 12px; overflow-x: auto; margin: 0 0 8px; white-space: pre-wrap; word-break: break-all; font-family: "Cascadia Code", Consolas, monospace; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 10px; border-bottom: 1px solid var(--line); }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr.click { cursor: pointer; } tr.click:hover td { background: rgba(255,255,255,.03); }
  .m { font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 1px 6px; background: rgba(91,141,239,.18); color: var(--blue-l); font-family: Consolas, monospace; }
  .st { font-size: 10.5px; font-weight: 700; border-radius: 4px; padding: 1px 6px; font-family: Consolas, monospace; }
  .st.g { background: rgba(52,211,153,.15); color: var(--green); } .st.b { background: rgba(248,113,113,.15); color: var(--red); }

  /* ---- board ---- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .picker { position: relative; display: inline-block; }
  .menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; width: min(480px, calc(100vw - 32px)); background: var(--pop); border: 1px solid var(--line2); border-radius: 12px; padding: 8px; box-shadow: 0 16px 40px rgba(0,0,0,.6); max-height: 72vh; overflow: auto; }
  .menu .h { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding: 10px 10px 4px; font-weight: 600; }
  .menu .it { padding: 7px 10px; border-radius: 8px; cursor: pointer; }
  .menu .it:hover { background: var(--surface); }
  .menu .it.on { background: rgba(167,139,250,.16); }
  .menu .it .t { font-weight: 600; }
  .claude { display: inline-flex; border-radius: 8px; overflow: hidden; border: 1px solid rgba(52,211,153,.45); }
  .claude span { padding: 6px 12px; color: var(--green); font-weight: 600; background: rgba(52,211,153,.08); font-size: 13px; }
  .claude span + span { border-left: 1px solid rgba(52,211,153,.45); padding: 6px 9px; }
  .title { font-size: 20px; font-weight: 700; margin: 4px 0 2px; }
  .meta { color: var(--dim); font-size: 13px; margin-bottom: 6px; }
  .meta .flag { color: var(--amber); }
  .stepper { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 8px 0 14px; font-size: 13px; color: var(--dim); }
  .stepper .s { display: inline-flex; align-items: center; gap: 6px; }
  .stepper .n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line2); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; }
  .stepper .done .n { border-color: var(--green); color: var(--green); }
  .stepper .cur .n { background: var(--blue); border-color: var(--blue); color: #fff; }
  .stepper .cur { color: var(--text); font-weight: 600; }
  .stepper .ln { width: 28px; height: 1px; background: var(--line2); }
  .strip { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; border-radius: 12px; padding: 10px 14px; margin-bottom: 12px; font-size: 13px; }
  .strip.out { border: 1px solid rgba(91,141,239,.4); background: rgba(91,141,239,.07); }
  .strip.in { border: 1px solid rgba(167,139,250,.45); background: rgba(167,139,250,.07); }
  .strip.warn { border: 1px solid rgba(251,191,36,.45); background: rgba(251,191,36,.07); }
  .strip .ic { font-size: 16px; }
  .rec { display: flex; gap: 10px; align-items: center; margin: 8px 0 12px; font-size: 13px; color: var(--dim); flex-wrap: wrap; }
  .recbtn { color: var(--red); border: 1px solid rgba(248,113,113,.5); border-radius: 99px; padding: 3px 12px; background: rgba(248,113,113,.06); cursor: pointer; font-weight: 600; }
  .recbtn:disabled { opacity: .4; cursor: not-allowed; }
  .btabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; flex-wrap: wrap; background: var(--surface2); border-radius: 12px 12px 0 0; padding: 0 8px; }
  .btabs a { padding: 11px 14px; cursor: pointer; color: var(--dim); border-bottom: 2px solid transparent; font-size: 14.4px; }
  .btabs a.on { color: var(--text); border-color: var(--blue-l); }
  .cnt { font-size: 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 0 6px; margin-left: 4px; color: var(--dim); }
  .cols { display: grid; grid-template-columns: repeat(5, minmax(230px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 8px; }
  .col { background: var(--well); border: 1px solid var(--line); border-radius: 12px; padding: 8px; min-height: 220px; }
  .col.over { border-color: var(--blue); background: rgba(91,141,239,.08); }
  .col .ch { display: flex; justify-content: space-between; color: var(--dim); font-size: 12px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 6px 10px; font-weight: 600; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; margin-bottom: 8px; cursor: pointer; }
  .tile:hover { border-color: var(--line2); }
  .tile[draggable=true] { cursor: grab; }
  .tile .top { display: flex; gap: 6px; align-items: center; margin-bottom: 5px; flex-wrap: wrap; }
  .num { font-size: 10.5px; font-weight: 700; border: 1px solid var(--line2); border-radius: 99px; padding: 0 6px; background: var(--surface); }
  .kind { font-size: 9.6px; font-weight: 700; border-radius: 4px; padding: 1px 6px; }
  .k-BUG { background: rgba(248,113,113,.16); color: var(--red); } .k-TASK { background: rgba(52,211,153,.15); color: var(--green); } .k-NOTE { background: rgba(143,178,247,.15); color: var(--blue-l); }
  .tile .tt { font-weight: 600; font-size: 14px; line-height: 1.35; }
  .tile .ft { display: flex; gap: 6px; align-items: center; margin-top: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--dim); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 11px 14px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .row.click { cursor: pointer; } .row.click:hover { border-color: var(--line2); }
  .stats { display: flex; gap: 26px; align-items: flex-end; margin-bottom: 12px; flex-wrap: wrap; }
  .stats div b { font-size: 20px; display: block; }
  .stats div span { font-size: 10.5px; color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
  .dotrec { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--amber); flex: none; }
  .dotrec.live { background: var(--red); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* ---- drawers, chat, popovers ---- */
  .drawer { position: fixed; top: 33px; right: 0; bottom: 0; width: min(640px, 100vw); background: var(--drawer); backdrop-filter: blur(18px); border-left: 1px solid var(--line2); z-index: 70; display: flex; flex-direction: column; box-shadow: -12px 0 40px rgba(0,0,0,.5); }
  .dh { display: flex; gap: 8px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .dh .tt { font-weight: 700; font-size: 15px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { background: transparent; border: 0; color: var(--dim); font-size: 18px; cursor: pointer; padding: 0 4px; }
  .dtabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .dtabs a { padding: 9px 12px; cursor: pointer; color: var(--dim); border-bottom: 2px solid transparent; font-size: 14px; }
  .dtabs a.on { color: var(--text); border-color: var(--blue-l); }
  .db { flex: 1; overflow: auto; padding: 14px 16px; }
  .df { border-top: 1px solid var(--line); padding: 10px 16px 14px; }
  .note { font-size: 12px; color: var(--dim); margin-top: 6px; }
  .cm { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .cm .w { font-size: 12px; color: var(--dim); margin-bottom: 3px; }
  .cm .w b { color: var(--text); }
  .cm .tx { white-space: pre-wrap; }
  .banner { border-radius: 10px; padding: 8px 12px; font-size: 12.5px; margin-bottom: 10px; }
  .banner.vio { background: var(--violet-bg); border: 1px solid rgba(167,139,250,.4); }
  .banner.amb { background: rgba(251,191,36,.08); border: 1px solid rgba(251,191,36,.4); }
  .chatchip { position: fixed; right: 20px; bottom: 18px; z-index: 65; }
  .chatchip .c { display: flex; gap: 10px; align-items: center; background: var(--pop); border: 1px solid var(--line2); border-radius: 14px; padding: 9px 14px; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.5); font-weight: 600; font-size: 13px; max-width: 340px; }
  .av { width: 28px; height: 28px; border-radius: 50%; background: #1d3a37; color: #7fd1c4; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none; position: relative; }
  .av.vio { background: #2b2347; color: var(--violet); }
  .av i { position: absolute; right: -1px; bottom: -1px; width: 9px; height: 9px; border-radius: 50%; background: var(--green); border: 2px solid var(--pop); }
  .chat { position: fixed; right: 20px; bottom: 76px; z-index: 66; width: min(560px, calc(100vw - 24px)); height: min(600px, calc(100vh - 140px)); background: var(--pop); border: 1px solid var(--line2); border-radius: 14px; display: flex; flex-direction: column; box-shadow: 0 16px 50px rgba(0,0,0,.6); }
  .chat .ch { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-bottom: 1px solid var(--line); }
  .chat .msgs { flex: 1; overflow: auto; padding: 12px 14px; }
  .msg { border-radius: 12px; padding: 9px 12px; margin-bottom: 10px; background: var(--surface); border: 1px solid var(--line); max-width: 92%; white-space: pre-wrap; font-size: 13.5px; }
  .msg.u { margin-left: auto; background: var(--blue-bg); border-color: rgba(91,141,239,.35); }
  .msg .w { font-size: 11.5px; color: var(--dim); margin-bottom: 3px; white-space: normal; }
  .composer { margin: 0 12px 12px; border: 1px solid var(--line2); border-radius: 12px; padding: 8px 10px; background: var(--input); }
  .composer textarea { width: 100%; border: 0; background: transparent; resize: none; outline: none; min-height: 40px; color: var(--text); }
  .composer .bar { display: flex; gap: 12px; align-items: center; color: var(--dim); font-size: 13px; }
  .send { margin-left: auto; width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line2); background: var(--surface); cursor: pointer; color: var(--text); }
  .send:disabled { opacity: .35; cursor: not-allowed; }
  .popover { position: fixed; z-index: 85; width: min(400px, calc(100vw - 24px)); background: var(--pop); border: 1px solid rgba(167,139,250,.55); border-radius: 12px; padding: 12px 14px; box-shadow: 0 16px 44px rgba(0,0,0,.65); font-size: 13px; max-height: calc(100vh - 80px); overflow: auto; }
  .popover.outp { border-color: rgba(91,141,239,.55); }
  .pv-t { font-weight: 700; margin-bottom: 8px; }
  .pv-r { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 8px; padding: 3px 0; }
  .pv-sep { height: 1px; background: var(--line); margin: 8px 0; }
  .pv-box { background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; margin-bottom: 8px; }
  .stack { position: fixed; right: 20px; bottom: 76px; z-index: 80; display: flex; flex-direction: column; gap: 10px; width: min(430px, calc(100vw - 24px)); }
  .req { background: var(--pop); border: 1px solid rgba(251,191,36,.6); border-radius: 12px; padding: 12px 14px; box-shadow: 0 12px 34px rgba(0,0,0,.55); font-size: 13px; }
  .req.link { border-color: rgba(91,141,239,.6); }
  .diff { background: rgba(0,0,0,.35); border-radius: 6px; padding: 6px 10px; margin: 8px 0; font-family: Consolas, monospace; font-size: 12px; white-space: pre-wrap; }
  .del { color: var(--red); text-decoration: line-through; } .ins { color: var(--green); }
  .toast { background: #1d2a25; border: 1px solid rgba(52,211,153,.45); border-radius: 10px; padding: 9px 12px; font-size: 13px; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
  .toast.e { background: #2c1d20; border-color: rgba(248,113,113,.5); }
  .tray { position: absolute; right: 0; top: calc(100% + 8px); width: min(480px, calc(100vw - 24px)); background: var(--pop); border: 1px solid var(--line2); border-radius: 12px; padding: 10px; box-shadow: 0 16px 40px rgba(0,0,0,.6); z-index: 60; max-height: 70vh; overflow: auto; }
  .code6 { font-family: Consolas, monospace; font-size: 22px; letter-spacing: .3em; background: rgba(0,0,0,.35); padding: 6px 14px; border-radius: 8px; display: inline-block; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 88; display: flex; align-items: flex-start; justify-content: center; padding: 60px 16px; overflow: auto; }
  .dialog { width: 100%; max-width: 620px; background: var(--pop); border: 1px solid var(--line2); border-radius: 14px; padding: 18px 20px; }
  .dialog h3 { margin: 0 0 14px; font-size: 16px; }
  .field { margin-bottom: 14px; }
  .field > .fl { font-size: 12px; color: var(--dim); margin-bottom: 6px; font-weight: 600; }
  .settings { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 22px; }
  .snav a { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--dim); font-weight: 600; font-size: 14px; border: 1px solid transparent; }
  .snav a.on { background: var(--blue-bg); color: var(--text); border-color: rgba(91,141,239,.4); }
  .grp { background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 14px; overflow-x: auto; }
  .grp .gh { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px 14px; }
  .help { position: fixed; left: 16px; bottom: 16px; z-index: 64; width: min(430px, calc(100vw - 32px)); background: #221c0c; border: 1px solid rgba(251,191,36,.45); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.5); color: #fde68a; }
  .help .hd { padding: 8px 12px; display: flex; align-items: center; cursor: pointer; font-weight: 700; font-size: 13px; }
  .help ol { margin: 0; padding: 0 14px 12px 30px; font-size: 12.5px; max-height: 46vh; overflow: auto; color: #f5e7b8; }
  .help li { margin-bottom: 7px; }

/* ---- Claude (host only, simulated) ---- */
function claudeAnswer(bid, text) {
  const b = S.boards[bid];
  const q = text.toLowerCase();
  const cyc = b.cycles.map(r => ({ r, a: access(r.o, r.id, bid), c: S.cycles[r.id] }));
  const reach = cyc.filter(x => live(x.a));
  const away = cyc.filter(x => x.a.state === 'offline');
  const where = x => x.a.state === 'local' ? 'local' : '⇇ ' + nm(V, x.r.o);
  const fail = reach.flatMap(x => x.c.calls.filter(c => c.st >= 500).map(c => ({ x, c })));
  let out;
  if (/listen/.test(q)) {
    const t = cyc.find(x => q.includes(x.c.name.split(' ')[0])) || reach.find(x => x.r.o !== V) || reach[0];
    out = t ? `Listening to ${t.c.name} [${where(t)}]. ${t.r.o === V ? 'New calls arrive here.' : nm(V, t.r.o) + ' signals each new call (ids only); I read and check each one here.'} Findings land as cards on this board - yours, stored here.` : 'Nothing I can reach to listen to.';
  } else if (/triage/.test(q)) {
    const inbox = b.cards.filter(c => c.status === 'Inbox');
    out = inbox.length ? `Inbox: ${inbox.map(c => '#' + c.n + ' ' + c.title).join('; ')}.\n#12 looks like #7 (same branch IN-list 500) - merge into #7? Your call.` : 'The Inbox is empty.';
  } else if (/(open|make|create).*card/.test(q)) {
    const f = fail.find(k => k.x.r.o !== V) || fail[0];
    if (!f) out = 'No failed call to open a card for.';
    else {
      apply({ type: 'card.create', board: bid, kind: 'BUG', remote: f.x.r.o === V ? null : nm(V, f.x.r.o), title: `${f.c.m} ${f.c.p} → ${f.c.st} (${f.x.c.name})`, comment: evidenceText(f.c, f.x.r.o) }, 'Claude');
      out = `Opened #${b.cards[b.cards.length - 1].n} in the Inbox for ${f.c.m} ${f.c.p} [${where(f.x)}], SQL and log lines attached. It is your card, stored here${f.x.r.o === V ? '' : '; ' + nm(V, f.x.r.o) + ' was not asked'}.`;
    }
  } else if (/fail|why|500|error/.test(q)) {
    out = fail.length ? fail.map(({ x, c }) => `[${where(x)}] ${x.c.name}: ${c.m} ${c.p} → ${c.st}\n  ${c.sql[0] || ''}${c.logs.length ? '\n  ' + c.logs.join('\n  ') : ''}`).join('\n') : 'No failed calls in the cycles I can read.';
  } else {
    out = 'I can read: ' + (reach.map(x => `${x.c.name} [${where(x)}, ${x.c.calls.length} calls]`).join('; ') || 'nothing') + '.';
  }
  if (away.length) out += `\nI cannot reach ${away.map(x => where(x) + ' (' + x.c.name + ')').join(', ')} now - left out.`;
  return out;
}

function pageCycles() {

      : `<button class="ab" disabled title="Recording stays with its owner">Record</button>${l ? `<button class="ab" data-a="openCycleCalls" data-x="${bid || ''}" data-c="${cid}" data-o="${o}">Open</button>` : ''}${bid && S.boards[bid].owner === V ? `<button class="ab" data-a="removeRef" data-x="${bid}" data-c="${cid}">Remove from board</button>` : ''}${l && !a.via && (!bid || S.boards[bid].owner === V) ? `<button class="ab" data-a="keepCopy" data-x="${cid}" data-o="${o}" data-b="${bid || ''}">⧉ Keep a copy</button>` : ''}`;

  sharedBoards.forEach(s => { const b = S.boards[s.target]; groups.push({ head: `<span style="color:var(--violet)">▦</span> <b>${h(b.key)} · ${h(b.name)}</b> ${pill(s.owner, null, 'board', s.target, null)} <span class="dim small">${online(s.owner) ? h(b.project) + ' · ' + b.cycles.length + ' cycle(s)' : 'offline'}</span>`, open: online(s.owner) ? s.target : null, rows: online(s.owner) ? b.cycles.map(r => row(r.o, r.id, s.target)) : [] }); });
  const onBoards = new Set(myBoards.flatMap(([, b]) => b.cycles.map(r => r.id)));

  if (loose.length) groups.push({ head: '<span style="color:var(--violet)">⇇</span> <b>Streamed to this Alfred</b> <span class="dim small">on none of your boards</span>', rows: loose.map(s => row(s.owner, s.target, null)) });

/* ---- popover, dialogs, popups ---- */
function popover() {
  const p = ui.pop;

  const st = `left:${p.x}px;top:${p.y}px`;
  const rows = list => list.filter(Boolean).map(([k, v]) => `<div class="pv-r"><span class="dim">${k}</span><span>${v}</span></div>`).join('');
  if (p.out) {
    const list = S.streams.filter(s => s.owner === V && s.kind === p.kind && s.target === p.id && s.active);
    const what = p.kind === 'board' ? S.boards[p.id].key + ' · ' + S.boards[p.id].name : S.cycles[p.id].name;
    return `<div class="popover outp" style="${st}"><div class="pv-t" style="color:var(--blue-l)">⇉ ${h(what.slice(0, 60))}</div><div class="dim small" style="margin-bottom:8px">Kept here and streamed live - nothing is copied to the readers.</div>
      ${list.map(s => `<div class="pv-box">${rows([['To', `<b>${h(nm(V, s.to))}</b> <span class="dim">${h(S.alfreds[s.to].addr)}</span>`], ['State', online(s.to) ? '<span class="ok">● connected</span>' : '<span class="dim">offline</span>'], ['They may', s.mode === 'comment' ? 'comment (requests)' : 'view'], ['Auto-accept', s.auto], ['Pass on', s.passOn ? 'yes · ' + s.passMode : 'no'], ['Secrets', s.unmasked ? '<span class="warn">sent unmasked</span>' : 'masked here'], ['Since', s.at], ['To approve', String(S.requests.filter(r => r.streamId === s.id && r.state === 'waiting').length)]])}
        <div style="display:flex;gap:6px;margin-top:8px"><button class="ab" data-a="editStream" data-x="${s.id}">Change</button><button class="ab r" data-a="stopStream" data-x="${s.id}">Stop</button></div></div>`).join('')}</div>`;
  }
  const isBoard = p.kind === 'board';
  const a = isBoard ? boardAccess(p.id) : access(p.o, p.id, p.b || null);
  const o = p.o;
  const s = a.stream || anyStream(o, V, p.kind, p.id);
  const stTxt = { ok: '<span class="ok">● live</span>', offline: '<span class="dim">offline · nothing shown, no copy here</span>', ended: '<span class="dim">stream ended</span>', name: '<span class="warn">not shared here</span>' }[a.state] || '';
  let facts = [];
  if (isBoard) { const b = S.boards[p.id]; if (a.state === 'ok') facts = [['Project', h(b.project)], ['Cards', String(b.cards.length)], ['Cycles', String(b.cycles.length)], ['Azure', b.azure ? `${b.azure.id} · read-only copy` : '-']]; }
  else {
    const c = S.cycles[p.id];
    const on = hostBoards().filter(([, b]) => b.cycles.some(r => r.id === p.id)).map(([, b]) => h(b.key));
    if (a.state === 'ok') facts = [['Project', h(c.project)], ['Calls', `${c.calls.length} · <span class="${c.calls.some(x => x.st >= 400) ? 'bad' : 'ok'}">${c.calls.filter(x => x.st >= 400).length} failed</span>`], ['Status', c.recording ? `<span class="bad">● recording on ${h(nm(V, o))}</span>` : 'paused'], ['Created', h(c.created)]];
    facts.push(['On your boards', on.join(', ') || 'none']);
  }
  const ids = [
    ['Name', `<b>${h(isBoard ? S.boards[p.id].key + ' · ' + S.boards[p.id].name : S.cycles[p.id].name)}</b>`],
    ['Kind', isBoard ? 'board' : 'cycle'],
    ['Lives on', `<b>${h(nm(V, o))}</b> <span class="dim">${h(S.alfreds[o].addr)}</span>`],
    a.via ? ['Through', `${h(nm(V, a.via))} <span class="dim">(passed on; ${h(S.alfreds[o].short)} set the mode)</span>`] : null,
    ['State', stTxt],
    a.mode && a.state !== 'name' ? ['You may', a.mode === 'comment' ? 'comment - each a request' : 'view only'] : null,
    s && a.state !== 'name' ? ['Their auto-accept', s.auto] : null,
    s && a.state !== 'name' ? ['Secrets', s.unmasked ? '<span class="warn">unmasked</span>' : `masked by ${h(nm(V, o))}`] : null,
    s ? ['Streamed since', s.at] : null,
    ['Stored here', 'nothing - read live from its owner'],
    ['Ref tag', `<code>&lt;uuid&gt;@${h(a.via ? S.alfreds[o].short : nm(V, o))}</code>`]
  ];
  const mb = hostBoards();

  editStream: d => { const s = S.streams.find(x => x.id === d.x); ui.dialog = { kind: 'stream', kindStream: s.kind, target: s.target, to: s.to, mode: s.mode, auto: s.auto, passOn: s.passOn, passMode: s.passMode, unmasked: s.unmasked }; ui.pop = null; },

  cancelLink: () => { S.pendingLink = null; },
  linkFound: d => { S.pendingLink = { from: V, to: d.x, code: String(Math.floor(100000 + Math.random() * 899999)).replace(/(\d{3})(\d{3})/, '$1 $2'), name: S.alfreds[d.x].says }; toast(`Asked "${S.alfreds[d.x].says}". It shows a one-time code there; switch to ${S.alfreds[d.x].short} in the mock bar to accept.`); },
  announce: () => { S.alfreds[V].announce = !S.alfreds[V].announce; toast(S.alfreds[V].announce ? 'Announcing on the LAN again.' : 'No longer announced - others can still link by typing the address.'); },
  keepCopy: d => {

  unlink: d => { const l = linkOf(V, d.x); S.links = S.links.filter(x => x !== l); S.streams.filter(s => s.active && ((s.owner === V && s.to === d.x) || (s.owner === d.x && s.to === V))).forEach(s => { s.active = false; }); toast('Unlinked - every stream on it ended.'); },
  exportCall: d => { const a = access(d.x, ui.drawer.cycle, ui.drawer.board || null); if (a.state === 'ok') readLog(d.x, `exported a call of ${S.cycles[ui.drawer.cycle].name} (.html)`); if (d.x !== V && a.state !== 'ok') return toast(`${nm(V, d.x)} is offline - the call cannot be fetched for export now.`, true); toast(d.x === V ? 'Exported the call as .html.' : `Exported as .html - fetched in full from ${nm(V, d.x)} just now${masked(a) ? ', secrets masked as ' + nm(V, d.x) + ' sends them' : ''}.`); },

document.addEventListener('click', e => {
