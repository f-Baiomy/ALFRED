<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>At a Glance options</title>
<style>
:root { --bg: #0f1012; --card: #1a1b1f; --inner: #141518; --border: rgba(255,255,255,.09); --strong: rgba(255,255,255,.16);
  --text: #e9ebf0; --dim: #9aa0ad; --faint: #646a78; --link: #c4b5fd; --red: #f07178; --amber: #f2b13c; --green: #6ee7a8; --cyan: #7dd3fc;
  --mono: "Cascadia Code", Consolas, monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Segoe UI", system-ui, sans-serif; }
.page { max-width: 1040px; margin: 0 auto; padding: 18px 16px 50px; }
h1 { font-size: 18px; margin: 0 0 4px; } .intro { color: var(--dim); font-size: 13px; margin: 0 0 12px; }
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tabs a { padding: 5px 12px; border-radius: 8px; cursor: pointer; color: var(--dim); border: 1px solid var(--border); }
.tabs a.on { color: var(--text); background: rgba(196,181,253,.14); border-color: rgba(196,181,253,.4); }
.why { color: var(--dim); font-size: 13px; margin: 0 0 10px; } .why b { color: var(--text); }
.glance { background: var(--card); border: 1px solid var(--strong); border-radius: 12px; padding: 14px 18px 16px; }
.glance h2 { margin: 0 0 8px; font-size: 17px; }
.counts { color: var(--dim); font-size: 12.5px; margin-bottom: 10px; } .counts b { color: var(--text); } .counts .x { color: var(--red); } .counts .w { color: var(--amber); }
.overview { border-left: 3px solid var(--link); background: rgba(196,181,253,.06); border-radius: 0 8px 8px 0; padding: 7px 12px; margin-bottom: 12px; font-size: 13.5px; }
.overview .who { font-size: 11px; color: var(--link); font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.overview p { margin: 3px 0; }
.by { font-size: 10px; font-weight: 700; color: var(--link); background: rgba(196,181,253,.12); border-radius: 4px; padding: 0 5px; margin-right: 6px; vertical-align: 1px; }
.cl { font-family: var(--mono); font-size: 11.5px; color: var(--link); text-decoration: none; white-space: nowrap; }
.m { font-size: 10px; font-weight: 700; border-radius: 5px; padding: 0 5px; background: rgba(125,211,252,.12); color: var(--cyan); }
.path { font-family: var(--mono); font-size: 12px; color: var(--dim); }
.ok { color: var(--green); font-family: var(--mono); font-size: 11.5px; }

/* B - story timeline */
.tl { position: relative; margin-left: 10px; padding-left: 22px; border-left: 2px solid var(--border); }
.tl .stepm { position: relative; margin: 14px 0 6px; font-weight: 700; font-size: 13.5px; }
.tl .stepm::before { content: attr(data-n); position: absolute; left: -36px; top: -1px; width: 26px; height: 26px; border-radius: 50%; background: var(--card);
  border: 2px solid var(--link); color: var(--link); font-size: 11px; display: flex; align-items: center; justify-content: center; }
.tl .stepm .rg { font-weight: 400; font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-left: 8px; }
.tl .ev { position: relative; margin: 4px 0; padding: 6px 10px; border-radius: 8px; background: var(--inner); border: 1px solid var(--border); font-size: 13px; }
.tl .ev::before { content: ''; position: absolute; left: -27px; top: 12px; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.tl .ev .h { display: flex; gap: 8px; align-items: baseline; font-size: 12px; margin-bottom: 2px; }
.tl .quiet { color: var(--faint); font-size: 12px; margin: 2px 0 2px; }

/* C - table */
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-size: 11px; color: var(--faint); font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 4px 8px; border-bottom: 1px solid var(--strong); }
table.t td { padding: 5px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
table.t tr.step td { background: rgba(196,181,253,.07); font-weight: 600; font-size: 13px; padding-top: 7px; }
table.t tr.step td .rg { font-weight: 400; font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-left: 8px; }
table.t td.c { width: 62px; } table.t td.r { width: 300px; }
table.t .clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
table.t .clamp.open { -webkit-line-clamp: unset; }

/* D - two columns */
.two { display: grid; grid-template-columns: 300px minmax(0,1fr); gap: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; min-height: 360px; }
.toc { background: var(--inner); border-right: 1px solid var(--border); padding: 6px; }
.toc a { display: grid; grid-template-columns: 20px minmax(0,1fr) auto; gap: 6px; padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 12.5px; color: var(--dim); }
.toc a.on { background: rgba(196,181,253,.14); color: var(--text); }
.toc a .n { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.toc a .k { font-size: 10.5px; color: var(--link); }
.pane { padding: 10px 14px; }
.pane h3 { margin: 0 0 2px; font-size: 14px; } .pane .rg { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-bottom: 8px; }
.pane .row { border-top: 1px dashed var(--border); padding: 6px 0; font-size: 13px; }
.pane .row .h { display: flex; gap: 8px; align-items: baseline; font-size: 12px; margin-bottom: 2px; }
.md { background: var(--inner); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; color: #cfd3dc; margin-top: 12px; }
.mdh { font-size: 12px; color: var(--dim); margin-top: 12px; }
</style>
</head>
<body>
<div class="page">
<h1>"At a Glance" - three more layouts</h1>
<p class="intro">Same cycle, same notes. Pick one (or mix): each tab shows the .html look and, under it, what the .md file would contain.</p>
<div class="tabs"><a class="on" data-t="B">B · Story timeline</a><a data-t="C">C · Table</a><a data-t="D">D · Steps + reader</a></div>
<div id="out"></div>
</div>
<script>
const STEPS = [
  ['Login (successful attempt)', 1, 1, [[1, 'POST', 'Admin2/loginAction', 200, 'Login attempt 4 of 4: succeeds (200), session created.']]],
  ['Open flight search page: branches, settings, agencies', 2, 5, [
    [2, 'GET', 'Master2/Branch/lookup/branches', 200, 'Flight search page opens: loads the branch dropdown (branch 948 used in every search).'],
    [3, 'GET', 'v2/settings/Up-Selling', 200, 'Reads the Up-Selling setting, which decides whether upgrade options are offered once a fare is picked.'],
    [4, 'GET', 'v2/settings/CHECK-SUPPLIER-REQUEST-RESPONSE', 200, 'Reads CHECK-SUPPLIER-REQUEST-RESPONSE, which decides whether supplier XML is viewable in the UI.'],
    [5, 'POST', 'Admin2/agency/by-branch', 200, 'Loads the agencies of the selected branch.']]],
  ['Select origin RUH and destination SHJ (airport autocomplete)', 6, 7, []],
  ['Search #1 – RUH→SHJ 31-10-2026, 1 ADT → G9155, 5 fares', 8, 14, [[8, 'POST', 'Booking2/flight-search/search', 200, 'Search #1: availability for RUH→SHJ on 31-Oct, 1 adult. The response lists G9155 with 5 fares; pricing then runs once per fare (calls 9-13).']]],
  ['Fare confirm #1 – Basic, class P, 15,707.95 EGP → price unchanged', 15, 17, [[15, 'POST', 'Booking2/fare-confirm', 200, 'SELECTED OFFER: Basic, class P. fareStatus 2 = price unchanged.']]],
  ['Back to search → Search #2 RUH→SHJ again', 18, 27, []],
  ['Fare confirm #2 – Ultimate (bundle 66589), 17,195.16 EGP → price unchanged', 28, 30, [[28, 'POST', 'Booking2/fare-confirm', 200, 'SELECTED OFFER: Ultimate, bundle 66589. fareStatus 2 = price unchanged.']]],
];
const rg = (a, b) => `calls ${a}${b > a ? '–' + b : ''}`;
const head = `<h2>🔎 At a Glance</h2><div class="counts"><b>30</b> calls · <b>7</b> steps · <b>31</b> notes · <b class="x">0</b> failed · <b class="w">1</b> error inside a 200</div>
<div class="overview"><div class="who">🤖 Claude · cycle overview · on call 1</div><p>This cycle shows only the successful flow of the 06-Oct session. After login, the agent searches RUH→SHJ on 31-Oct-2026 for 1 adult twice; each search is followed by a fare confirmation - Basic after #1, Ultimate after #2. Both return fareStatus 2 (price unchanged).</p></div>`;
const V = {
  B: () => ['<b>Story timeline:</b> the cycle reads top to bottom like a story - numbered step markers on a rail, each note a card under its step with its call; steps without notes are one quiet line. Nothing to click to read it.',
    head + '<div class="tl">' + STEPS.map(([l, a, b, cs], i) => `<div class="stepm" data-n="${i}">${l}<span class="rg">${rg(a, b)}</span></div>` +
      (cs.length ? cs.map(([n, m, p, s, t]) => `<div class="ev"><div class="h"><a class="cl" href="#">call ${n}</a><span class="m">${m}</span><span class="path">${p}</span><span class="ok">${s}</span></div><span class="by">Claude</span>${t}</div>`).join('')
        : '<div class="quiet">no notes</div>')).join('') + '</div>',
    `### Story\n\n**0 · Login (successful attempt)** · call 1\n\n- [call 1](#call-1) \`POST\` Admin2/loginAction → 200\n  > 🤖 Login attempt 4 of 4: succeeds (200), session created.\n\n**1 · Open flight search page** · calls 2–5\n\n- [call 2](#call-2) \`GET\` Master2/Branch/lookup/branches → 200\n  > 🤖 Flight search page opens: loads the branch dropdown …\n\n**2 · Select origin RUH and destination SHJ** · calls 6–7 · _no notes_`],
  C: () => ['<b>Table:</b> densest - one row per note, step rows as bands, long notes clamp to 2 lines (click to expand). Best for many notes; scans fast, prints well.',
    head + '<table class="t"><thead><tr><th>Call</th><th>Request</th><th>Note</th></tr></thead><tbody>' + STEPS.map(([l, a, b, cs], i) =>
      `<tr class="step"><td colspan="3">${i} · ${l}<span class="rg">${rg(a, b)}${cs.length ? '' : ' · no notes'}</span></td></tr>` +
      cs.map(([n, m, p, s, t]) => `<tr><td class="c"><a class="cl" href="#">${n}</a></td><td class="r"><span class="m">${m}</span> <span class="path">${p}</span> <span class="ok">${s}</span></td><td><div class="clamp" onclick="this.classList.toggle('open')">${t}</div></td></tr>`).join('')).join('') + '</tbody></table>',
    `### Steps and notes\n\n| Call | Request | Note |\n|---|---|---|\n| **0 · Login (successful attempt)** | | |\n| [1](#call-1) | \`POST\` Admin2/loginAction → 200 | 🤖 Login attempt 4 of 4: succeeds (200), session created. |\n| **1 · Open flight search page** | | |\n| [2](#call-2) | \`GET\` Master2/Branch/lookup/branches → 200 | 🤖 Flight search page opens: … |`],
  D: () => ['<b>Steps + reader:</b> the steps are a list on the left (with note counts); the right shows the chosen step\'s calls and notes. Shortest page, like an inbox - one step at a time. (In .md it falls back to headings, since a file cannot have a clickable side list.)',
    head + '<div class="two"><div class="toc" id="toc">' + STEPS.map(([l, a, b, cs], i) => `<a data-i="${i}"${i === 1 ? ' class="on"' : ''}><span class="n">${i}</span><span>${l}</span><span class="k">${cs.length || ''}</span></a>`).join('') + '</div><div class="pane" id="pane"></div></div>',
    `### Steps\n\n1. [Login (successful attempt)](#step-0) - call 1 · 1 note\n2. [Open flight search page](#step-1) - calls 2–5 · 4 notes\n…\n\n#### Step 1 · Open flight search page (calls 2–5)\n\n- [call 2](#call-2) \`GET\` … → 200 - 🤖 Flight search page opens: …`],
};
function pane(i) {
  const [l, a, b, cs] = STEPS[i];
  document.getElementById('pane').innerHTML = `<h3>${i} · ${l}</h3><div class="rg">${rg(a, b)}</div>` + (cs.map(([n, m, p, s, t]) => `<div class="row"><div class="h"><a class="cl" href="#">call ${n}</a><span class="m">${m}</span><span class="path">${p}</span><span class="ok">${s}</span></div><span class="by">Claude</span>${t}</div>`).join('') || '<div class="row" style="color:var(--faint)">no notes on these calls</div>');
}
function show(t) {
  const [why, html, md] = V[t]();
  document.getElementById('out').innerHTML = `<p class="why">${why}</p><div class="glance">${html}</div><div class="mdh">.md file:</div><div class="md"></div>`;
  document.querySelector('.md').textContent = md;
  if (t === 'D') { pane(1); document.querySelectorAll('#toc a').forEach((a) => (a.onclick = () => { document.querySelectorAll('#toc a').forEach((b) => b.classList.toggle('on', b === a)); pane(+a.dataset.i); })); }
}
document.querySelectorAll('.tabs a').forEach((a) => (a.onclick = () => { document.querySelectorAll('.tabs a').forEach((b) => b.classList.toggle('on', b === a)); show(a.dataset.t); }));
show('B');
</script>
</body>
</html>
