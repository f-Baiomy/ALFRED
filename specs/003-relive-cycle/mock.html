<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alfred · Relive Cycle - UX mock</title>
<!--
  UX approval mock for specs/003-relive-cycle. Self-contained: no build, no network.
  Uses Alfred's own theme tokens (styles.scss :root) and component vocabulary (tab nav, method/status
  badges, depth rails, pills, dialogs) so it reads like the real app.
  Everything is simulated in this file - nothing is sent anywhere.
-->
<style>
:root{
  --bg:#0a0e2a; --nav:#11163d; --card:#141a45; --card-2:#101636; --inner:#070a24; --pop:#161c4a;
  --border:rgba(139,92,246,.22); --border-s:rgba(139,92,246,.45);
  --purple:#8b5cf6; --purple-l:#c4b5fd; --cyan:#22d3ee; --green:#34d399; --amber:#fbbf24; --red:#f87171; --orange:#fb923c;
  --text:#e5e9f5; --dim:#93a0c2; --faint:#5c6690;
  --d0:#8b5cf6; --d1:#38bdf8; --d2:#e879f9; --d3:#818cf8;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:13px/1.45 'Segoe UI',system-ui,sans-serif;background:radial-gradient(ellipse at top,#131a4a 0%,#0a0e2a 55%);color:var(--text)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:var(--text);background:var(--inner);border:1px solid var(--border-s);border-radius:8px;padding:6px 9px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--purple)}
.mono{font-family:Consolas,'Cascadia Mono',monospace}
.faint{color:var(--faint)} .dim{color:var(--dim)}
/* ---- mock banner ---- */
.mockbar{display:flex;gap:10px;align-items:center;padding:6px 16px;background:#2a1a55;color:var(--purple-l);font-size:12px;border-bottom:1px solid var(--border-s)}
.mockbar b{color:#fff}
.mockbar .sp{flex:1}
.mockbar button{border:1px solid var(--border-s);border-radius:6px;padding:2px 8px}
/* ---- app nav ---- */
.nav{display:flex;align-items:center;gap:4px;padding:0 24px;background:linear-gradient(120deg,#1a1247,#0f1438 60%,#1a1247);border-bottom:1px solid var(--border-s)}
.nav a{padding:12px 14px;color:var(--dim);text-decoration:none;font-weight:600;border-bottom:2px solid transparent;cursor:pointer}
.nav a.on{color:var(--purple-l);border-bottom-color:var(--purple)}
.nav .new{font-size:10px;background:var(--purple);color:#fff;border-radius:6px;padding:1px 5px;margin-left:4px;vertical-align:1px}
.page{max-width:1320px;margin:0 auto;padding:18px 24px 60px}
h1{font:700 20px Montserrat,'Segoe UI',sans-serif;margin:0}
h2{font:700 15px Montserrat,'Segoe UI',sans-serif;margin:0}
.sub{color:var(--dim);margin-top:2px}
/* ---- generic ---- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:9px;border:1px solid var(--border-s);background:var(--card);font-weight:600;white-space:nowrap}
.btn:hover{background:#1c2358}
.btn.primary{background:var(--purple);border-color:var(--purple);color:#fff}
.btn.primary:hover{background:#7c4ff0}
.btn.danger{border-color:rgba(248,113,113,.5);color:var(--red)}
.btn.sm{padding:3px 9px;border-radius:7px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
.link{color:var(--purple-l);font-size:12px}
.link:hover{text-decoration:underline}
.card{background:linear-gradient(160deg,#141a45,#101636);border:1px solid var(--border);border-radius:14px}
.row{display:flex;align-items:center;gap:8px}
.spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid;white-space:nowrap;letter-spacing:.02em}
.p-live{color:#fb923c;border-color:rgba(251,146,60,.6);background:rgba(251,146,60,.14)}
.p-replay{color:var(--cyan);border-color:rgba(34,211,238,.45);background:rgba(34,211,238,.1)}
.p-global{color:#93c5fd;border-color:rgba(147,197,253,.45);background:rgba(147,197,253,.1)}
.p-cycle{color:var(--purple-l);border-color:var(--border-s);background:rgba(139,92,246,.15)}
.p-mod{color:var(--amber);border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.1)}
.p-diff{color:var(--amber);border-color:rgba(251,191,36,.5);background:rgba(251,191,36,.12)}
.p-fail{color:var(--red);border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.12)}
.p-wait{color:var(--dim);border-color:var(--border);background:rgba(148,163,194,.1)}
.p-ok{color:var(--green);border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.1)}
.p-secret{color:var(--dim);border-color:var(--border)}
.p-pause{color:#f0abfc;border-color:rgba(232,121,249,.5);background:rgba(232,121,249,.12)}
.st.paused{color:#3b0a3b;background:#e879f9;border-color:#e879f9}
.pausebox{border:1px solid rgba(232,121,249,.55);background:rgba(232,121,249,.08);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.pausebox h3{margin:0 0 6px;font-size:13px;color:#f5d0fe}
.haltbox{border:1px solid rgba(248,113,113,.55);background:rgba(248,113,113,.08);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.haltbox.diff{border-color:rgba(251,191,36,.55);background:rgba(251,191,36,.08)}
.haltbox h3{margin:0 0 6px;font-size:13px;color:#fecaca}
.haltbox.diff h3{color:#fde68a}
.re-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.re-col{border:1px solid var(--border);border-radius:10px;padding:8px 10px;min-height:90px}
.re-col h4{margin:0 0 6px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.re-act{display:flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:8px;padding:4px 8px;margin-bottom:5px;font-size:12px;background:rgba(255,255,255,.02)}
.re-pick{border:1px solid var(--border-s);border-radius:10px;padding:8px 10px;margin-top:8px;max-height:260px;overflow:auto}
.re-pick .grp{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:8px 0 3px}
.re-pick .it{display:block;width:100%;text-align:left;padding:4px 8px;border-radius:6px;font-size:12px;color:var(--text)}
.re-pick .it:hover{background:rgba(139,92,246,.18)}
.cmp{border:1px solid rgba(251,191,36,.35);border-radius:12px;padding:10px 12px;margin-bottom:12px;background:rgba(0,0,0,.18)}
.cmp .strip{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.cmp .strip button{border:1px solid var(--border);border-radius:8px;padding:4px 8px;text-align:left;font-size:11.5px;color:var(--text);min-width:88px}
.cmp .strip button small{display:block;color:var(--faint);font-size:10.5px}
.cmp .strip button.on{border-color:var(--border-s);background:rgba(139,92,246,.2)}
.cmp .bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;border:1px solid var(--border);border-radius:10px;padding:5px 8px;margin:8px 0;font-size:11.5px}
.cmp .dl{font-family:ui-monospace,monospace;font-size:11.5px;padding:1px 8px;white-space:pre}
.cmp .dl.del{background:rgba(248,113,113,.16)} .cmp .dl.add{background:rgba(74,222,128,.14)}
.cmp .dl.del::before{content:'– ';color:#f87171} .cmp .dl.add::before{content:'+ ';color:#4ade80} .cmp .dl.same::before{content:'  '}
.cmp .dbox{border:1px solid var(--border);border-radius:8px;padding:4px 0;max-height:220px;overflow:auto}
#extwatch{position:fixed;left:18px;bottom:18px;z-index:500;display:flex;flex-direction:column;gap:8px;width:min(430px,92vw)}
.extnote{border:1px solid rgba(251,146,60,.7);background:#2a1a10;border-radius:12px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.45);font-size:12.5px;animation:fadein .2s}
.extnote b{color:#fed7aa}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.p-new{color:#86efac;border-color:rgba(134,239,172,.5);background:rgba(134,239,172,.1)}
.ring{width:46px;height:46px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:#f5d0fe;flex:none}
.attempts{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.attempts button{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border)}
.attempts button.on{background:rgba(139,92,246,.28);color:#fff;border-color:var(--border-s)}
.pickpage{position:fixed;inset:0;background:radial-gradient(ellipse at top,#131a4a 0%,#0a0e2a 55%);z-index:45;overflow:auto}
.pickbar{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;background:var(--pop);border:1px solid var(--purple);box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:46}
.m{font:700 10px Consolas,monospace;padding:1px 5px;border-radius:4px;min-width:40px;text-align:center;display:inline-block;border:1px solid}
.m-GET{color:var(--cyan);background:rgba(34,211,238,.12);border-color:rgba(34,211,238,.35)}
.m-POST{color:var(--purple-l);background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.4)}
.m-PUT{color:#93c5fd;background:rgba(59,130,246,.15);border-color:rgba(59,130,246,.35)}
.dir{font-size:12px;width:14px;text-align:center;flex:none}
.dir.in{color:var(--green)} .dir.out{color:var(--cyan)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin:14px 0 12px}
.tabs button{padding:8px 12px;color:var(--dim);font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:var(--purple-l);border-bottom-color:var(--purple)}
.tabs .cnt{font-size:10px;color:var(--faint);margin-left:4px}
.seg{display:inline-flex;padding:2px;border-radius:8px;background:var(--inner);border:1px solid var(--border);gap:2px}
.seg button{padding:3px 9px;border-radius:6px;font-size:11.5px;color:var(--dim);font-weight:600}
.seg button.on{background:rgba(139,92,246,.28);color:#fff}
.seg.mode button.on.live{background:rgba(251,146,60,.28);color:#fed7aa}
.seg.mode button.on.replay{background:rgba(34,211,238,.2);color:#a5f3fc}
/* ---- list page ---- */
.cycles{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:16px}
.cyc{padding:14px 16px;cursor:pointer}
.cyc:hover{border-color:var(--border-s)}
/* ---- cycle page ---- */
.head{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
.head input.name{font:700 19px Montserrat,'Segoe UI',sans-serif;background:transparent;border:1px solid transparent;padding:2px 6px;margin-left:-6px;width:380px}
.head input.name:hover{border-color:var(--border)}
.dirty{font-size:11px;color:var(--amber);border:1px solid rgba(251,191,36,.4);border-radius:999px;padding:1px 8px}
.summary{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px}
.layout.nodrawer{grid-template-columns:minmax(0,1fr)}
.panel{padding:12px}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.toolbar input.search{width:200px;padding:5px 9px}
/* step tree */
.step{display:flex;align-items:center;gap:8px;min-height:38px;padding:4px 8px;border-radius:9px;border:1px solid transparent;background:rgba(255,255,255,.015);margin-bottom:3px;position:relative}
.step:hover{background:rgba(139,92,246,.07)}
.step.sel{border-color:var(--purple);background:rgba(139,92,246,.1)}
.step.off{opacity:.45}
.step.child{margin-left:34px}
.step.child::before{content:'';position:absolute;left:-18px;top:-6px;bottom:50%;border-left:2px solid rgba(56,189,248,.45);border-bottom:2px solid rgba(56,189,248,.45);width:12px;border-bottom-left-radius:6px}
.step.dragging{opacity:.4}
.step.dropabove{box-shadow:0 -2px 0 var(--purple)}
.grip{color:var(--faint);cursor:grab;width:14px;text-align:center;flex:none;user-select:none}
.num{color:var(--faint);width:18px;text-align:right;font-size:11px;flex:none}
.lbl{min-width:0;flex:1;display:flex;align-items:center;gap:6px}
.lbl .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl .u{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11.5px}
.fold{width:16px;color:var(--dim);flex:none}
.icb{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--dim);flex:none}
.icb:hover{background:rgba(139,92,246,.18);color:var(--text)}
.ext-banner{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;background:rgba(251,146,60,.1);border:1px solid rgba(251,146,60,.4);color:#fed7aa;margin-bottom:10px;font-size:12.5px}
.warnlist{margin:0 0 10px;padding:8px 10px;border-radius:9px;background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.3);font-size:12px}
.warnlist div{padding:2px 0}
.blk{color:var(--red)} .wrn{color:var(--amber)}
/* drawer */
.drawer{padding:0;position:sticky;top:12px;max-height:calc(100vh - 40px);overflow:auto}
.dhead{padding:12px 14px;border-bottom:1px solid var(--border);position:sticky;top:0;background:#131947;z-index:2}
.dbody{padding:12px 14px}
.sect{margin-bottom:14px}
.sect h3{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:4px 10px;font-size:12px}
pre{margin:0;padding:8px 10px;background:var(--inner);border:1px solid var(--border);border-radius:8px;font:11.5px/1.45 Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto}
.hl{background:rgba(251,191,36,.18);border-radius:3px}
.var{color:var(--purple-l);background:rgba(139,92,246,.18);border-radius:3px;padding:0 2px}
.dtabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:10px}
.dtabs button{font-size:11.5px;padding:4px 9px;border-radius:7px;color:var(--dim);border:1px solid var(--border)}
.dtabs button.on{color:#fff;background:rgba(139,92,246,.25);border-color:var(--border-s)}
/* variables / rules */
table.grid{width:100%;border-collapse:collapse;font-size:12.5px}
table.grid th{text-align:left;font-size:11px;color:var(--faint);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--border)}
table.grid td{padding:7px 8px;border-bottom:1px solid rgba(139,92,246,.1);vertical-align:middle}
.rulecard{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--border);border-radius:9px;margin-bottom:6px;background:rgba(255,255,255,.015)}
.rulecard.muted{opacity:.45}
/* run */
.progress{height:8px;border-radius:999px;background:var(--inner);border:1px solid var(--border);overflow:hidden;flex:1}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--purple),var(--cyan));transition:width .4s}
.st{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none;border:1.5px solid}
.st.pending{color:var(--faint);border-color:var(--faint)}
.st.waiting{color:var(--dim);border-color:var(--dim);border-style:dashed}
.st.running{color:var(--purple-l);border-color:var(--purple);animation:pulse 1.1s infinite}
.st.ok{color:#052e1f;background:var(--green);border-color:var(--green)}
.st.diff{color:#3b2a00;background:var(--amber);border-color:var(--amber)}
.st.fail{color:#3b0a0a;background:var(--red);border-color:var(--red)}
.st.skip,.st.cancel,.st.notcalled{color:var(--faint);border-color:var(--faint);border-style:dotted}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(139,92,246,.6)}60%{box-shadow:0 0 0 6px rgba(139,92,246,0)}}
.dur{font-size:11px;color:var(--faint);width:62px;text-align:right;flex:none}
.filters{display:flex;gap:4px;flex-wrap:wrap}
.filters button{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border);color:var(--dim)}
.filters button.on{background:rgba(139,92,246,.25);color:#fff;border-color:var(--border-s)}
.varpanel{margin-top:12px}
.varrow{display:flex;gap:8px;align-items:center;padding:4px 0;font-size:12px;border-bottom:1px dashed rgba(139,92,246,.12)}
.varrow .nm{width:120px;color:var(--purple-l)}
.flash{animation:flash 1.2s}
@keyframes flash{0%{background:rgba(139,92,246,.45)}100%{background:transparent}}
/* diff */
.drow{display:grid;grid-template-columns:118px 1fr 1fr auto;gap:8px;align-items:start;padding:6px 0;border-bottom:1px solid rgba(139,92,246,.12);font-size:12px}
.drow .old{color:#fca5a5;background:rgba(248,113,113,.08);border-radius:5px;padding:2px 6px;font-family:Consolas,monospace;word-break:break-all}
.drow .new{color:#86efac;background:rgba(52,211,153,.08);border-radius:5px;padding:2px 6px;font-family:Consolas,monospace;word-break:break-all}
.drow.noise{opacity:.5}
details.noisebox summary{cursor:pointer;color:var(--dim);font-size:12px;padding:6px 0}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(3,5,20,.66);display:flex;align-items:flex-start;justify-content:center;padding-top:6vh;z-index:50}
.modal{width:min(720px,94vw);max-height:86vh;overflow:auto;padding:18px 20px}
.modal h2{margin-bottom:4px}
.pick{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;border:1px solid transparent}
.pick:hover{background:rgba(139,92,246,.08)}
.pick.child{margin-left:26px}
.choice{display:flex;gap:4px}
.choice button{font-size:11px;padding:2px 7px;border-radius:6px;border:1px solid var(--border);color:var(--dim)}
.choice button.on{background:rgba(139,92,246,.28);border-color:var(--border-s);color:#fff}
.hint{font-size:11.5px;color:var(--faint)}
.toast{position:fixed;right:18px;bottom:18px;background:var(--pop);border:1px solid var(--border-s);border-radius:10px;padding:9px 13px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.4)}
@media (max-width:1100px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .drawer{position:fixed;right:12px;top:70px;bottom:12px;width:min(430px,94vw);max-height:none;z-index:40;box-shadow:0 20px 60px rgba(0,0,0,.55)}
}
.guided{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px dashed var(--border-s);background:rgba(139,92,246,.08);margin-bottom:10px}
</style>
</head>

function stepFromRecorded(r, parentKey=null){

function tops(){ return S.steps.filter(s=>!s.parentKey); }

/* ===== The call rule: one real ALFRED rule per call. Mode buttons only edit it; the mode is read back from it. ===== */
const ACT={mock:'Mock response (never contact upstream)',replace:'Reply with a different response',pauseReq:'Pause and wait for me (before forwarding)',pauseRes:'Pause the response and wait for me',cond:'Condition — look at the request, then decide',body:'Replace the request body'};
function kindOf(t){ return Object.keys(ACT).find(k=>ACT[k]===t)||'other'; }
function mkAct(t,s){ const k=kindOf(t); const a={id:'a'+(uid++),t,on:true,kind:k};
  if(k==='mock'||k==='replace') a.data={status:s?s.status:200,headers:'Content-Type: application/json',body:s?s.res:''};
  if(k==='pauseReq'||k==='pauseRes') a.data={timeout:s&&s.cp?s.cp.timeout:60};
  if(k==='cond') a.data={els:'FAIL',fail:{status:502,headers:'Content-Type: application/json',body:'{\n  "error": "Request differs from the recording - blocked by ALFRED Relive"\n}'}};
  if(k==='body') a.data={body:s?s.req:''};

function findAct(s,k){ return [...s.rule.request,...s.rule.response].find(a=>a.kind===k); }

function applyFields(s){ // a button (or anything outside the editor) changed the mode: write it into the rule
  if(!s.rule) s.rule={request:[],response:[]};
  const cond=findAct(s,'cond');
  if(s.mode==='REPLAY'){ ensureAct(s,'mock',true); if(s.onChanged==='REPLAY'||!s.parentKey) removeAct(s,'cond'); else ensureAct(s,'cond',true).data.els=({LIVE:'SEND',ASK:'PAUSE',FAIL:'FAIL'})[s.onChanged]; const r=findAct(s,'replace'); if(r) r.on=false; }
  else { const m=findAct(s,'mock'); if(m) m.on=false; if(cond) cond.on=false; const r=findAct(s,'replace'); if(s.mode==='LIVE_MOCKED') ensureAct(s,'replace',true); else if(r) r.on=false; }
  if(s.cp.before) ensureAct(s,'pauseReq',true); else removeAct(s,'pauseReq');
  if(s.cp.after) ensureAct(s,'pauseRes',true); else removeAct(s,'pauseRes');
  if(s.reqEdited){ const b=findAct(s,'body')||ensureAct(s,'body',true); b.on=true; b.data.body=s.req; } else { const b=findAct(s,'body'); if(b) b.on=false; }
}
function deriveFields(s){ // read the mode back from the rule
  const on=k=>{ const a=findAct(s,k); return a&&a.on; };
  s.mode = on('mock') ? 'REPLAY' : on('replace') ? 'LIVE_MOCKED' : (s.parentKey?'LIVE':null);
  { const c=findAct(s,'cond'); if(s.mode==='REPLAY' && s.parentKey) s.onChanged = c&&c.on ? ({SEND:'LIVE',PAUSE:'ASK',FAIL:'FAIL'})[c.data.els] : 'REPLAY'; }
  s.cp.before=!!on('pauseReq'); s.cp.after=!!on('pauseRes');
  const pa=findAct(s,'pauseReq')||findAct(s,'pauseRes'); if(pa) s.cp.timeout=pa.data.timeout;

function syncRule(s){ if(!s.rule||s._sig!==sigOf(s)){ applyFields(s); deriveFields(s); } }
function ruleEdits(s){ return !!(s.override || s.matchCustom || [...s.rule.request,...s.rule.response].some(a=>a.on&&(a.kind==='other'||a.kind==='body'))); }
function liveSteps(){ return S.steps.filter(isExternal); }
/* ===== External-reach watcher: anything the user does that lets a call reach a real system is announced ===== */
function extReason(s){
  if(!s.enabled || !s.parentKey || s.host.endsWith('.internal') || !s.rule) return null;
  const m=findAct(s,'mock'), c=findAct(s,'cond'), r=findAct(s,'replace');
  const other=[...s.rule.request].find(a=>a.on&&a.kind==='other'&&/Send the call to the host|Rewrite URL/.test(a.t));
  if(s.mode==='LIVE_MOCKED') return 'LIVE, reply mocked still calls the real host - only the answer odeysys gets is the recording';
  if(c&&c.on&&c.data.els==='SEND'&&m&&m.on) return '“When the request differs” is set to Call live - a differing request goes to the real host';
  if(s.mode==='LIVE') return !m ? 'the Mock response was deleted from its call rule' : m.on===false ? 'the Mock response in its call rule is turned off' : 'it is set to LIVE';
  if(other) return 'its call rule has “'+other.t+'”';

}
function extSet(){ const o={}; S.steps.forEach(x=>{ const why=extReason(x); if(why) o[x.key]={label:x.label,host:x.host,why}; });
  if(S.unexp==='SEND_REAL'||(S.unexp==='RULES'&&S.unexpFallback==='SEND_REAL')) o.__unexp={label:'Unexpected outbound calls',host:'any host',why:S.unexp==='SEND_REAL'?'the unexpected-call policy is “Send to the real system”':'unexpected calls no rule matches fall back to “Send to real”'};
  Object.entries(S.unattributed||{}).forEach(([k,v])=>{ const x=stepByKey(k); if(v==='SEND_REAL'&&x&&x.enabled) o['__un'+k]={label:x.label,host:x.host,why:'calls ALFRED can\'t tell are yours are sent to the real system'}; });
  return o; }
function watchExternal(){
  if(!S||!S.steps) return; const now=extSet(); const was=S._ext;
  if(was && !S._quiet){ const fresh=Object.keys(now).filter(k=>!was[k]); if(fresh.length) notifyExternal(fresh.map(k=>now[k]), S._extSnap); }
  S._ext=now; S._quiet=false; S._extSnap=JSON.stringify({steps:S.steps,unexp:S.unexp,unexpFallback:S.unexpFallback,unattributed:S.unattributed});
}
function notifyExternal(items, snap){

    <div class="row" style="margin-top:6px"><button class="btn sm" onclick="undoExternal('${id}')">↶ Undo</button><button class="btn sm primary" onclick="document.getElementById('${id}').remove()">That's intended</button></div></div></div>`;

function undoExternal(id){ const snap=JSON.parse(window.__extSnaps[id]); S.steps=snap.steps; S.unexp=snap.unexp; S.unexpFallback=snap.unexpFallback; S.unattributed=snap.unattributed; S._quiet=true; document.getElementById(id)?.remove(); toast('Undone - nothing new reaches a real system'); render(); }
/* the app's request to a REPLAY child may differ from the recording, e.g. because its inbound step was edited */
function reqChanges(c){ const rec=findRecDeep(c.rec); if(c.reqEdited&&rec&&c.req!==rec.req) return [{path:'body (your edit)',a:rec.req.replace(/\s+/g,' '),b:c.req.replace(/\s+/g,' ')}];

const CHANGED_LABEL={REPLAY:'Replay the recorded answer (default)',LIVE:'Send to the real supplier ⚠',ASK:'Hold and ask me'};

function mayUnattributed(s){ return s.parentKey && s.mode==='REPLAY' && s.host==='api.supplier-c.io'; }

  const f=[]; const names=new Set(S.vars.map(v=>v.name));

/* drag & drop reorder (top-level steps; children move with their parent) */
function bindDnD(){

    el.addEventListener('dragend',()=>el.classList.remove('dragging'));
    el.addEventListener('dragover',e=>{ e.preventDefault(); el.classList.add('dropabove'); });
    el.addEventListener('dragleave',()=>el.classList.remove('dropabove'));

function moveBefore(src,dst){

function modeButtons(s){

function actLine(a){ const d=a.data||{};

function callRuleSection(s){
  const acts=s.rule; const order=s.parentKey?'#'+(kids(s.parentKey).filter(c=>c.host===s.host).indexOf(s)+1)+' in '+esc(stepByKey(s.parentKey).label):'sent by ALFRED';

function setCp(k,w){ const s=stepByKey(k); s.cp[w]=!s.cp[w]; syncRule(s); markDirty(); toast((s.cp[w]?'Added':'Removed')+' “'+(w==='before'?ACT.pauseReq:ACT.pauseRes)+'” '+(s.cp[w]?'to':'from')+' the call rule'); render(); }
const CHG={FAIL:['Mock a failure (default)','ALFRED answers 502 (editable) - the supplier is never contacted.'],ASK:['Ask me','The call is held and you decide. No decision in time = mocked failure. Never sent without your yes.'],
  REPLAY:['Replay recording anyway','The recorded answer is given even though the request changed.'],LIVE:['Call live ⚠','A differing request goes to the REAL supplier. Dangerous - you confirm this.']};
function openChanged(k,why){ const s=stepByKey(k);
  $('#modal').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="card modal" style="width:560px"><h2>When ${esc(s.label)}'s request differs from the recording</h2>

   ${Object.entries(CHG).map(([v,[l,d]])=>`<button class="rulecard" style="width:100%;text-align:left;${s.onChanged===v?'border-color:var(--border-s);background:rgba(139,92,246,.18)':''}${v==='LIVE'?';border-color:rgba(251,146,60,.6)':''}" onclick="${v==='LIVE'?`confirmCallLive('${k}')`:`setChanged('${k}','${v}')`}"><b style="${v==='LIVE'?'color:#fed7aa':''}">${l}</b><span class="dim" style="flex:1">${d}</span>${s.onChanged===v?'<span class="pill p-cycle">current</span>':''}</button>`).join('')}
   ${s.onChanged==='FAIL'?`<div class="kv" style="margin-top:8px"><span class="dim">Failure status</span><input class="mono" value="${esc((findAct(s,'cond')||{data:{fail:{status:502}}}).data.fail.status)}" oninput="const c=findAct(stepByKey('${k}'),'cond'); if(c) c.data.fail.status=this.value"></div>`:''}
   <div class="hint" style="margin-top:8px">“Request matches a recorded call” is a new condition in ALFRED's Condition action - global rules can use it too.</div></div></div>`; }
function setChanged(k,v){ const x=stepByKey(k); x.onChanged=v; x.askedChanged=true; if(v==='REPLAY') removeAct(x,'cond'); syncRule(x); markDirty(); closeModal(); toast(x.label+': when the request differs → '+CHG[v][0]); render(); }
function confirmCallLive(k){ const x=stepByKey(k);

function askIfEdited(k){ const x=stepByKey(k); if(x.parentKey&&x.mode==='REPLAY'&&x.reqEdited&&!x.askedChanged) openChanged(k,'You edited this call\'s request, so it will differ from the recording at run time.'); }
function confirmReset(k){ const s=stepByKey(k);

function doReset(k){ const s=stepByKey(k), r=findRec(s.rec); s.rule=null; s.mode=s.parentKey?'REPLAY':null; s.cp={before:false,after:false,timeout:60}; s.onChanged='FAIL'; s.reqEdited=false; s.askedChanged=false; s.matchCustom=false; s.override=false; if(r) s.req=r.req; s._sig=null; syncRule(s); closeModal(); markDirty(); toast(s.label+': call rule reset to the cycle default'); render(); }

/* ---------- Rule editor: the one from Interception → Rules, with a scope ---------- */
const CATALOG={
  request:[['Timing',['Delay request']],['Variables',['Capture request variable','Set request variable']],['Headers & trailers',['Set request header','Remove request header','Set request trailer','Remove request trailer']],
    ['URL & method',['Rewrite URL','Set method','Set query parameter','Remove query parameter']],['Body',['Set JSON field in request body','Remove request JSON field','Find & replace in request body','Replace the request body','Set form field']],
    ['Cookies',['Set request cookie','Remove request cookie']],['Transport',['Disable cache (always get the full response)','Disable compression']],
    ['Answer instead of the host',['Answer with a recorded call (never contact upstream)','Answer with an uploaded file (never contact upstream)','Mock response (never contact upstream)','Simulate a failure (network, not a status)','Abort request (kill the connection)']],
    ['Control',['Pause and wait for me (before forwarding)','Condition — look at the request, then decide','Send the call to the host']]],
  response:[['Timing',['Delay response']],['Variables',['Capture response variable']],['Status & headers',['Set response status','Set response header','Remove response header']],['Body',['Set JSON field in response body','Find & replace in response body']],
    ['Cookies',['Set response cookie']],['Replace the whole response',['Reply with a different response','Replace with a recorded response','Replace with an uploaded file']],['Control',['Pause the response and wait for me','Condition — look at the response, then decide']]]};
const GOALS=[['all','All',null],['slow','Make it slow',['Timing']],['fail','Make it fail',['Answer instead of the host','Transport']],['fake','Fake the answer',['Answer instead of the host','Replace the whole response']],['change','Change it',['Headers & trailers','URL & method','Body','Cookies','Status & headers','Variables']],['redirect','Send it elsewhere',['URL & method']],['inspect','Stop and inspect',['Control']]];
function catalog(phase){ const c=CATALOG[phase].map(([g,a])=>[g,[...a]]); if(S.newAction) c.find(x=>x[0]===(phase==='request'?'Transport':'Timing'))[1].push(phase==='request'?'Throttle bandwidth':'Throttle response bandwidth'); return c; }
function ruleSummary(r){ const a=[...(r.actions?.request||[]),...(r.actions?.response||[])]; return a.length?a.join(' → '):(r.desc||'no actions yet'); }
function openRuleEditor(scope,key,idx){
  const s=key?stepByKey(key):null;
  if(scope==='call'){ S.re={scope,key,idx:null,name:'Call rule · '+s.label,actions:JSON.parse(JSON.stringify(s.rule)),cond:'',method:s.m,host:s.host||'odeysys',path:s.path.split('?')[0],picker:null,goal:'all',q:''}; renderRuleEditor(); return; }
  const src = scope==='unexpected' ? (idx!=null?S.unexpRules[idx]:null) : scope==='cycle' ? (idx!=null?S.cycleRules[idx]:null) : scope==='step' ? (idx!=null?s.rules[idx]:null) : null;
  S.re={scope,key,idx,name:src?src.name:(scope==='match'?'Match '+s.label:scope==='step'?s.label+' rule':scope==='unexpected'?'Unexpected calls':'New cycle rule'),
    actions:{request:[...(src?.actions?.request||[])],response:[...(src?.actions?.response||[])]},
    cond:src?.cond||'', method:s?s.m:'ANY', host:s?s.host:(src?.host||''), path:s?s.path.split('?')[0]:'', picker:null, goal:'all', q:''};
  renderRuleEditor();
}
function renderRuleEditor(){

    : e.scope==='step'?'<span class="pill p-replay">STEP rule</span><span class="faint">applies only to <b>'+esc(s.label)+'</b> in this cycle</span>'
    : '<span class="pill p-mod">MATCH rule</span><span class="faint">how ALFRED recognises <b>'+esc(s.label)+'</b></span>';
  const col=(ph)=>`<div class="re-col"><h4>${ph==='request'?'1 Request - before it leaves ALFRED':'2 Response - after the host answers'}</h4>
     ${e.actions[ph].map((a,i)=>{ const t=typeof a==='string'?a:a.t; const o=typeof a==='object'; return `<div class="re-act" style="${o&&!a.on?'opacity:.5':''}"><span class="faint">${i+1}</span><span style="flex:1">${esc(t)}${o&&a.data&&(a.kind==='mock'||a.kind==='replace')?`<div class="row" style="margin-top:4px;gap:4px"><input class="mono" style="width:60px" value="${esc(a.data.status)}" oninput="S.re.actions.${ph}[${i}].data.status=this.value"><input class="mono" style="flex:1" value="${esc(a.data.headers)}" oninput="S.re.actions.${ph}[${i}].data.headers=this.value"></div><textarea class="mono" style="width:100%;height:54px;margin-top:4px" oninput="S.re.actions.${ph}[${i}].data.body=this.value">${esc(a.data.body)}</textarea>`:''}${o&&a.kind==='cond'?`<div class="faint" style="font-size:11.5px">if <b>request matches a recorded call</b> (new condition) → Mock response · else → <select onchange="S.re.actions.${ph}[${i}].data.els=this.value"><option value="SEND" ${a.data.els==='SEND'?'selected':''}>Send the call to the host</option><option value="PAUSE" ${a.data.els==='PAUSE'?'selected':''}>Pause and wait for me</option></select></div>`:''}${o&&a.kind==='body'?`<textarea class="mono" style="width:100%;height:54px;margin-top:4px" oninput="S.re.actions.${ph}[${i}].data.body=this.value">${esc(a.data.body)}</textarea>`:''}</span>${t.startsWith('Throttle')?'<span class="pill p-new">new</span>':''}${o?`<button class="btn sm" title="Turn off - keeps its data" onclick="S.re.actions.${ph}[${i}].on=!S.re.actions.${ph}[${i}].on;renderRuleEditor()">${a.on?'on':'off'}</button>`:''}<button class="icb" title="Delete" onclick="S.re.actions.${ph}.splice(${i},1);renderRuleEditor()">✕</button></div>`; }).join('')||'<div class="faint" style="font-size:12px">nothing yet</div>'}
     <button class="btn sm" onclick="S.re.picker='${ph}';renderRuleEditor()">＋ Add action</button></div>`;
  const pick=()=>{ const ph=e.picker; const goal=GOALS.find(g=>g[0]===e.goal); const q=e.q.toLowerCase();
    const groups=catalog(ph).filter(([g])=>!goal[2]||goal[2].includes(g)).map(([g,a])=>[g,a.filter(x=>!q||x.toLowerCase().includes(q)||g.toLowerCase().includes(q))]).filter(([,a])=>a.length);
    return `<div class="re-pick"><div class="row" style="flex-wrap:wrap;gap:4px"><div class="choice">${GOALS.map(([id,l])=>`<button class="${e.goal===id?'on':''}" onclick="S.re.goal='${id}';renderRuleEditor()">${l}</button>`).join('')}</div>
      <input placeholder="Search actions…" value="${esc(e.q)}" oninput="S.re.q=this.value;renderRuleEditor();const i=document.querySelector('.re-pick input');i.focus();i.setSelectionRange(i.value.length,i.value.length)" style="flex:1;min-width:140px"><button class="icb" onclick="S.re.picker=null;renderRuleEditor()">✕</button></div>
      ${groups.map(([g,a])=>`<div class="grp">${esc(g)}</div>${a.map(x=>`<button class="it" onclick="S.re.actions.${ph}.push(S.re.scope==='call'?mkAct('${x.replace(/'/g,"\\'")}',stepByKey(S.re.key)):'${x.replace(/'/g,"\\'")}');S.re.picker=null;renderRuleEditor()">${esc(x)} ${x.startsWith('Throttle')?'<span class="pill p-new">new in ALFRED</span>':''}</button>`).join('')}`).join('')||'<div class="faint">no action matches</div>'}</div>`; };
  $('#modal').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="card modal" style="width:min(820px,96vw)">

function saveRuleEditor(){
  const e=S.re; const s=e.key?stepByKey(e.key):null;

  if(e.scope==='call'){ s.rule=e.actions; if(e.matchTouched||e.cond) s.matchCustom=true; deriveFields(s); closeModal(); markDirty(); toast(s.label+'\'s call rule saved - mode is now '+(s.mode||'LIVE').replace('_',' ')); render(); if([...s.rule.request].some(a=>a.on&&(a.kind==='body'||a.kind==='other')&&/request|header|query|URL|body|method|cookie|form/i.test(a.t))){ s.reqEdited=s.reqEdited||true; askIfEdited(s.key); } return; }
  if(e.scope==='match'){ s.matchCustom=true; }
  else if(e.scope==='unexpected'){ const u={...rule,host:e.host}; if(e.idx!=null) S.unexpRules[e.idx]=u; else S.unexpRules.push(u); }
  else if(e.scope==='step'){ if(e.idx!=null) s.rules[e.idx]={...s.rules[e.idx],...rule}; else s.rules.push(rule); }
  else { if(e.idx!=null) S.cycleRules[e.idx]={...S.cycleRules[e.idx],...rule,copiedFrom:S.cycleRules[e.idx].copiedFrom}; else S.cycleRules.push({...rule,copiedFrom:null}); }
  closeModal(); markDirty(); toast(e.scope==='unexpected'?'Rule saved for unexpected calls':e.scope==='match'?'Match rule saved for '+s.label:e.scope==='step'?'Rule saved for '+s.label+' only':'CYCLE rule saved'); render();
}

function applyRebuild(mode){

function startRun(){

  order.forEach(s=>S.run.results[s.key]={state:s.enabled?'PENDING':'SKIPPED'});
  S.tab='run'; S.sel=null; render(); toast(S.driver==='GUIDED'?'Guided run started - use the app, ALFRED follows':'Run started');

function tick(){

  const s=stepByKey(key); const res=r.results[key];
  if(!s.enabled || (!s.parentKey && res.state==='SKIPPED')){ r.idx++; return tick(); }
  if(s.parentKey && ['NOT_CALLED','CANCELLED','SKIPPED'].includes(res.state)){ r.idx++; return tick(); }
  if(!s.parentKey) kids(s.key).forEach(c=>{ if(c.enabled&&r.results[c.key].state==='PENDING') r.results[c.key].state='WAITING'; });
  if(s.cp.before && !res.okBefore) return pauseAt(key,'BEFORE');
  if(s.parentKey && s.mode==='REPLAY' && reqChanges(s).length && s.onChanged==='ASK' && !res.changeDecided) return pauseAt(key,'CHANGED');

function planFor(s,res){

  return base;

function runStep(key){

  else if(s.mode==='LIVE_MOCKED') p={outcome:'COMPLETED',state:'LIVE',status:s.status,ms:(s.ms||300)+40,actRes:s.res,diffs:[],rules:[{tier:'STEP',name:'call rule · Reply with a different response',act:'host called ('+s.host+' answered 200) - odeysys got the recorded answer'}]};

    Object.assign(res,{...p,effReq:p.effReq||s.req,log:[...(res.log||[]),head,...(p.rules||[]).map(x=>'RULE_APPLIED ['+x.tier+'] '+x.name),...(p.produced||[]).map(v=>'VARIABLE_SET '+v.n),p.error?'ERROR '+p.error:'DONE '+p.status+' in '+p.ms+' ms']});

function afterSettle(key){

  if((failed && S.onFail==='HOLD') || (diff && S.onDiff==='HOLD')){ r.halt={key,reason:failed?'FAILED':'DIFF'}; render(); return; }

}
function decideChanged(v){
  const r=S.run, p=r.pause, s=stepByKey(p.key), res=r.results[p.key];
  if(v==='EDIT'){ $('#modal').innerHTML=`<div class="backdrop"><div class="card modal" style="width:520px"><h2>Answer for ${esc(s.label)} - this run</h2><div class="sub" style="margin:4px 0 8px">Edit the recorded response ALFRED will give. The cycle keeps its answer unless you save this.</div><textarea class="mono" style="width:100%;height:120px">${esc(s.res)}</textarea><label class="row" style="font-size:12.5px;margin-top:6px"><input type="checkbox"> Also save to the cycle</label><div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="closeModal();S.run.results['${p.key}'].answerEdited=true;decideChanged('REPLAY')">↩ Save &amp; replay</button></div></div></div>`; return; }

/* ---- hold after a failure / differences ---- */
const PRODUCES={Login:['token'],Search:['searchId'],Book:['bookingId']};
function dependents(key){
  const r=S.run, s=stepByKey(key); const lost=(PRODUCES[s.label]||[]).filter(n=>!r.vars[n] && !(S.vars.find(v=>v.name===n)||{}).value);
  if(!lost.length) return [];
  return r.order.slice(r.order.indexOf(key)+1).map(stepByKey).filter(x=>x&&x.enabled&&!x.parentKey&&['PENDING','CANCELLED'].includes(r.results[x.key].state))
    .map(x=>({s:x,needs:varRefs(x.path+' '+x.req).filter(n=>lost.includes(n))})).filter(d=>d.needs.length);
}
function skipDependents(key){
  const r=S.run, src=stepByKey(key);
  dependents(key).forEach(d=>{ const res=r.results[d.s.key]; res.state='SKIPPED'; res.error='Skipped - needs {{'+d.needs.join('}}, {{')+'}}, which '+src.label+' did not produce';

}
function haltBox(){
  const r=S.run, h=r&&r.halt; if(!h) return '';

  const left=r.order.slice(r.order.indexOf(h.key)+1).map(stepByKey).filter(x=>x&&x.enabled&&!x.parentKey).length;

}
function haltRetry(){ const r=S.run, k=r.halt.key, res=r.results[k]; r.halt=null; res.attempt=(res.attempt||1)+1; runStep(k); }
function haltEdit(){ const r=S.run, k=r.halt.key, res=r.results[k]; r.halt=null; r.pause={key:k,at:'AFTER'}; (res.pauses=res.pauses||[]).push({at:'AFTER',since:Date.now()}); pEditReplay(); }
function haltContinue(){ const r=S.run, k=r.halt.key; const n=dependents(k).length; skipDependents(k); r.halt=null; r.continued=(r.continued||0)+1;
  (r.results[k].log=r.results[k].log||[]).push('CONTINUED past this step by user'); toast('Continuing with the next calls'+(n?' - '+n+' step'+(n>1?'s':'')+' skipped for a missing value':'')); r.idx++; render(); setTimeout(tick,350); }
function haltEnd(){ const r=S.run; r.halt=null; r.order.forEach(k=>{ const st=r.results[k]; if(st.state==='PENDING'||st.state==='WAITING') st.state='CANCELLED'; }); r.status='RUNNING'; finish(); }
function resumeRun(key){
  const r=S.run; const at=r.order.indexOf(key)+1+kids(key).length;
  r.order.slice(at).forEach(k=>{ const st=r.results[k]; if(st.state==='CANCELLED') st.state='PENDING'; });

function policySection(rerender){

    <div class="row" style="padding:2px 0"><span style="width:190px;font-size:12.5px">A step <b style="color:var(--red)">fails</b></span><div class="choice">${b('onFail','HOLD','Hold and ask me (default)')}${b('onFail','CONTINUE','Keep going')}</div></div>
    <div class="row" style="padding:2px 0"><span style="width:190px;font-size:12.5px">A step has <b style="color:var(--amber)">differences</b></span><div class="choice">${b('onDiff','CONTINUE','Keep going (default)')}${b('onDiff','HOLD','Hold and ask me')}</div></div>
    <div class="hint" style="margin-top:4px">Holding lets you retry, edit &amp; retry, <b>continue with the next calls</b>, or end the run. Steps that need a value the failed step didn't produce are skipped, never sent with a gap.</div></div>`;

/* ---- checkpoints ---- */
function pauseAt(key,at){
  const r=S.run, s=stepByKey(key), res=r.results[key];

    clearInterval(r.holdTimer);
    r.holdTimer=setInterval(()=>{ if(!S.run||!S.run.pause||S.run.pause.key!==key){ clearInterval(r.holdTimer); return; }
      S.run.pause.left--; if(S.run.pause.left<=0){ clearInterval(r.holdTimer); res.pauses[res.pauses.length-1].choice='TIMEOUT'; toast(s.label+': no decision in '+s.cp.timeout+' s - continued automatically'); pContinue(true); } else updateRing(); },200);

function updateRing(){ const el=document.getElementById('ring'); const p=S.run.pause; if(!el||!p) return; const s=stepByKey(p.key); const pct=Math.round(p.left/s.cp.timeout*360); el.style.background='conic-gradient(#e879f9 '+pct+'deg, rgba(232,121,249,.15) 0)'; el.firstElementChild.textContent=p.left+'s'; }
function pContinue(byTimeout){
  const r=S.run, p=r.pause; if(!p) return; const res=r.results[p.key];

function lineDiff(a,b){
  const A=String(a||'').split('\n'), B=String(b||'').split('\n'); const n=A.length, m=B.length;
  const L=Array.from({length:n+1},()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const out=[]; let i=0,j=0; while(i<n&&j<m){ if(A[i]===B[j]){out.push(['same',A[i]]);i++;j++;} else if(L[i+1][j]>=L[i][j+1]) out.push(['del',A[i++]]); else out.push(['add',B[j++]]); }
  while(i<n) out.push(['del',A[i++]]); while(j<m) out.push(['add',B[j++]]); return out;
}

  const strip=[['Recorded call',s.m+' · '+s.status+' · '+s.ms+' ms'],['Your edits',res.edited||s.reqEdited||res.answerEdited?'edited':'none'],['Variables',(res.used||[]).length?(res.used.length+' used'):'none'],
    ['Sent',s.parentKey?('by odeysys'+((res.reqDiff||[]).length?' · request changed':'')):'to odeysys'],['Rules',(res.rules||[]).length+' applied'],
    [s.parentKey?(live?'Upstream':'ALFRED answered'):'Upstream',s.parentKey?(live?s.host+' · '+(res.ms||'-')+' ms':'supplier not contacted'):'odeysys · '+(res.ms||'-')+' ms'],['Response',(res.status??'-')+' · was '+s.status]];
  const rec=c.half==='request'?recReq:recRes, act=c.half==='request'?actReq:actRes;
  const hdr=lineDiff(fakeHeaders(s,res,'rec').join('\n'),fakeHeaders(s,res,'act').join('\n'));
  const body=lineDiff(rec,act);
  const pane=(lines)=>`<div class="dbox">${lines.map(([k,t])=>`<div class="dl ${k}">${esc(t)}</div>`).join('')||'<div class="dl same faint">empty</div>'}</div>`;
  const view = c.view==='rec'?pane(String(rec||'').split('\n').map(t=>['same',t])) : c.view==='act'?pane(String(act||'').split('\n').map(t=>['same',t]))
    : `${c.half==='response'?`<div class="row" style="font-size:12px;margin:4px 0"><span class="faint" style="width:60px">Status</span><span class="mono">${s.status} → ${res.status??'-'}</span></div>`:''}
       ${c.part!=='body'?`<div class="faint" style="font-size:10.5px;letter-spacing:.06em;margin:6px 0 3px">HEADERS</div>${pane(hdr)}`:''}
       ${c.part!=='headers'?`<div class="faint" style="font-size:10.5px;letter-spacing:.06em;margin:8px 0 3px">BODY</div>${pane(body)}`:''}`;
  const changed=[s.status!==res.status?'status '+s.status+' → '+res.status:'', body.some(x=>x[0]!=='same')?'body differs':'', 'headers differ'].filter(Boolean).join(', ');
  const b=(k,v,l)=>`<button class="${c[k]===v?'on':''}" onclick="S.cmp.${k}=${typeof v==='number'?v:`'${v}'`};render()">${l}</button>`;
  return `<div class="cmp"><div class="row"><b>↻ ${live?'Live':'Replayed'} in this run</b><span class="mono faint" style="font-size:11.5px">${(res.reqDiff||[]).length?'request changed':'request unchanged'} · response ${res.status===s.status&&!body.some(x=>x[0]!=='same')?'unchanged':'changed: '+changed}</span></div>
    <div class="strip">${strip.map(([t,sub],i)=>`<button class="${c.step===i+1?'on':''}" onclick="S.cmp.step=${i+1};S.cmp.half='${i<4?'request':'response'}';render()">${i+1} · ${esc(t)}<small>${esc(sub)}</small></button>`).join('')}</div>
    <div class="seg" style="margin-bottom:6px">${b('half','request','Request')}${b('half','response','Response')}</div>
    <div class="seg">${b('view','rec','Recorded '+c.half)}${b('view','act','This run\'s '+c.half)}${b('view','diff','Diff')}</div>
    <div class="bar"><span class="pill p-cycle">JSON</span><input placeholder="Find in this view…" style="flex:1;min-width:120px"><span class="faint">IN</span><div class="choice">${b('part','all','All')}${b('part','headers','Headers')}${b('part','body','Body')}</div><span class="faint">COPY</span><div class="choice"><button onclick="toast('Copied the diff')">Diff</button><button onclick="toast('Copied headers')">Headers</button><button onclick="toast('Copied body')">Body</button></div></div>
    ${view}
    <div class="hint" style="margin-top:6px">Red is what the recording had; green is what happened this run. The same compare ALFRED shows for a resent call.</div></div>`;
}
function diffTab(s,res){
  const d=res.diffs||[];
  const rq=(res.reqDiff||[]).length?`<div class="sect"><h3>Request - what odeysys sent vs the recording</h3>${res.reqDiff.map(x=>`<div class="drow"><span class="mono">${esc(x.path)}</span><span class="old">${esc(x.a)}</span><span class="new">${esc(x.b)}</span><span class="faint">${res.liveNow?'sent to the real supplier':'replayed anyway'}</span></div>`).join('')}</div>`:'';
  const row=(x,i)=>`<div class="drow ${x.kind.startsWith('NOISE')?'noise':''}"><span class="mono">${esc(x.path)}</span><span class="old">${esc(x.a)}</span><span class="new">${esc(x.b)}</span>
    <span>${x.kind==='UNEXPECTED'?(S.ignored[s.label+x.path]?'<span class="pill p-wait">ignored</span>':`<button class="btn sm" onclick="ignoreField('${esc(s.label)}','${esc(x.path)}')" title="Mark as noise for this step or the whole cycle">Ignore this field</button>`):x.kind==='EXPECTED'?`<span class="pill p-cycle" title="${esc(x.why)}">expected</span>`:`<span class="pill p-wait" title="${esc(x.why)}">noise</span>`}</span></div>`;
  const unexpected=d.filter(x=>x.kind==='UNEXPECTED'), expected=d.filter(x=>x.kind==='EXPECTED'), noise=d.filter(x=>x.kind.startsWith('NOISE'));
  return compareBox(s,res)+rq+`<div class="sect"><h3>What ALFRED makes of it</h3></div><div class="sect"><h3>Unexpected (${unexpected.length})</h3><div class="drow faint" style="border:0"><span>field</span><span>recorded</span><span>now</span><span></span></div>${unexpected.map(row).join('')||'<div class="faint">none</div>'}</div>
   <div class="sect"><h3>Expected - caused by this cycle (${expected.length})</h3>${expected.map(x=>row(x)+`<div class="hint" style="margin:-2px 0 6px">because of ${esc(x.why)}</div>`).join('')||'<div class="faint">none</div>'}</div>
   <details class="noisebox"><summary>Ignored as noise (${noise.length}) - ALFRED filters values that change every run</summary>${noise.map(x=>row(x)+`<div class="hint" style="margin:-2px 0 6px">${esc(x.why)}</div>`).join('')||'<div class="faint">none</div>'}</details>`;
}
function ignoreField(label,path){
  $('#modal').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="card modal" style="width:440px"><h2>Ignore <span class="mono">${esc(path)}</span></h2><div class="sub" style="margin:6px 0 12px">It stops counting as a difference from the next comparison. You can un-ignore it in the cycle's configuration.</div>
   <div class="row"><button class="btn" onclick="doIgnore('${label}','${path}','step')">Only for ${esc(label)}</button><button class="btn primary" onclick="doIgnore('${label}','${path}','cycle')">For the whole cycle</button></div></div></div>`;
}
function doIgnore(label,path,scope){ S.ignored[label+path]=scope; closeModal(); const r=S.run; const s=S.steps.find(x=>x.label===label); if(r&&s){ const res=r.results[s.key]; const left=(res.diffs||[]).filter(d=>d.kind==='UNEXPECTED'&&!S.ignored[label+d.path]).length; if(res.state==='COMPLETED_WITH_DIFFERENCES'&&!left) res.state='COMPLETED'; } toast(`${path} ignored ${scope==='step'?'for '+label:'for the whole cycle'}`); render(); }

/* ---------- Live-call log: every call that reached a real system is kept ---------- */
function logLive(s,res,why){ const r=S.run;
  S.liveLog.unshift({id:'lv'+(uid++),when:new Date().toLocaleTimeString(),run:r?(r.runId=r.runId||'run-'+(uid++)):'-',key:s.key,label:s.label,m:s.m,host:s.host,path:s.path,why,status:res.status,ms:res.ms,
    req:res.actReq||(res.reqDiff||[]).reduce((t,x)=>t.replace(x.a,x.b),res.effReq||s.req||''),res:res.realRes||res.actRes||''});
  (res.log=res.log||[]).push('SAVED to the cycle\'s live-call log (never pruned)'); res.savedLive=true; }
function liveLogPanel(){
  return `<div class="toolbar" style="margin-top:18px"><h2>Live calls <span class="pill p-live">${S.liveLog.length}</span></h2><span class="hint">every call that reached a real system, in full - kept even when its run is pruned; only you delete them</span></div>
  ${S.liveLog.length?`<table class="grid"><tr><th>When</th><th>Call</th><th>Why it went live</th><th>Status</th><th></th></tr>
  ${S.liveLog.map(l=>`<tr><td>${esc(l.when)}<div class="faint" style="font-size:11px">${esc(l.run)}</div></td><td><b>${esc(l.label)}</b> <span class="mono dim" style="font-size:11.5px">${esc(l.m)} ${esc(l.host)}${esc(l.path)}</span></td><td class="dim">${esc(l.why)}</td><td><span class="pill ${l.status<400?'p-ok':'p-fail'}">${l.status}</span> <span class="faint">${l.ms} ms</span></td>
    <td style="white-space:nowrap"><button class="btn sm" onclick="useAsRecording('${l.id}')" ${stepFor(l)?'':'disabled title="no matching step in this cycle"'}>Use as recording</button> <button class="btn sm" onclick="mockWith('${l.id}')">Mock with it</button> <button class="btn sm" onclick="openLiveCompare('${l.id}')">Compare</button> <button class="btn sm" onclick="toast('Opens ALFRED\\'s resend for this call - it is LIVE, so the usual confirmation shows first')">Resend</button> <button class="btn sm" onclick="toast('.md / .json / .html / cURL - existing exports, never truncated')">Export ▾</button> <button class="icb" title="Delete" onclick="delLive('${l.id}')">✕</button></td></tr>`).join('')}</table>`:'<div class="faint">No call has reached a real system yet.</div>'}`;
}
function stepFor(l){ return (l.key&&stepByKey(l.key)) || S.steps.find(x=>x.parentKey&&x.host===l.host&&x.path===l.path); }
function liveById(id){ return S.liveLog.find(x=>x.id===id); }
function useAsRecording(id){ const l=liveById(id), st=stepFor(l);
  $('#modal').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="card modal" style="width:620px"><h2>Use this live call as ${esc(st.label)}'s recording?</h2>
   <div class="sub" style="margin:4px 0 10px">The step's recording and its call rule's <b>Mock response</b> get the real answer from ${esc(l.when)}. Past runs keep what they used.</div>
   <div class="cmp"><div class="dbox">${lineDiff(st.res,l.res).map(([k,t])=>`<div class="dl ${k}">${esc(t)}</div>`).join('')}</div><div class="hint" style="margin-top:4px">Red: current recording · green: the live answer</div></div>
   <div class="row"><span class="spacer"></span><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="applyRecording('${id}')">Use as recording</button></div></div></div>`; }
function applyRecording(id){ const l=liveById(id), st=stepFor(l); const before={res:st.res,status:st.status,mock:JSON.stringify(findAct(st,'mock')?.data||null)};
  st.res=l.res; st.status=l.status; const m=findAct(st,'mock'); if(m){ m.data.body=l.res; m.data.status=l.status; } deriveFields(st); markDirty(); closeModal(); render();
  window.__undoRec=()=>{ st.res=before.res; st.status=before.status; const mm=findAct(st,'mock'); if(mm&&before.mock!=='null') mm.data=JSON.parse(before.mock); deriveFields(st); render(); toast('Recording restored'); };
  toastHtml(`${esc(st.label)} now replays the live answer · <a class="link" onclick="window.__undoRec()">Undo</a>`); }
function mockWith(id){ const l=liveById(id);
  $('#modal').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="card modal" style="width:480px"><h2>Mock with this live answer</h2><div class="sub" style="margin:4px 0 10px">Puts status ${l.status}, its headers and body into a Mock response.</div>
   ${S.steps.filter(x=>x.parentKey).map(x=>`<button class="rulecard" style="width:100%;text-align:left" onclick="applyMockWith('${id}','${x.key}')"><b>${esc(x.label)}</b><span class="dim">${esc(x.host)}</span><span class="spacer"></span><span class="faint">its call rule's Mock response</span></button>`).join('')}
   <button class="rulecard" style="width:100%;text-align:left" onclick="closeModal();S.re=null;openRuleEditor('cycle');S.re.actions.request.push('Mock response (never contact upstream)');S.re.name='Mock from live ${esc(l.label)}';renderRuleEditor()"><b>＋ New cycle rule</b><span class="dim">with a Mock response holding this answer</span></button></div></div>`; }
function applyMockWith(id,k){ const l=liveById(id), x=stepByKey(k); if(x.mode!=='REPLAY'){ x.mode='REPLAY'; syncRule(x); } const m=findAct(x,'mock'); m.data.body=l.res; m.data.status=l.status; deriveFields(x); markDirty(); closeModal(); toast(x.label+'’s Mock response now holds the live answer'); render(); }
function openLiveCompare(id){ const l=liveById(id), st=stepFor(l);
  $('#modal').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="card modal" style="width:760px"><div class="row"><h2>${esc(l.label)} · live ${esc(l.when)} vs recording</h2><span class="spacer"></span><button class="icb" onclick="closeModal()">✕</button></div>
   ${st?compareBox(st,{status:l.status,ms:l.ms,actReq:l.req,actRes:l.res,liveNow:true,rules:[],used:[]}):'<div class="faint">No step to compare with.</div>'}</div></div>`; }
function delLive(id){ const l=liveById(id);
  $('#modal').innerHTML=`<div class="backdrop" onclick="if(event.target===this)closeModal()"><div class="card modal" style="width:440px"><h2>Delete this live call?</h2><div class="sub" style="margin:6px 0 12px">${esc(l.label)} → ${esc(l.host)} (${esc(l.when)}). A real supplier answered this - it can't be fetched again without calling it again.</div>
   <div class="row"><span class="spacer"></span><button class="btn" onclick="closeModal()">Keep it</button><button class="btn danger" onclick="S.liveLog=S.liveLog.filter(x=>x.id!=='${id}');closeModal();render()">Delete</button></div></div></div>`; }
function toastHtml(h){ const t=$('#toast'); t.innerHTML=`<div class="toast">${h}</div>`; clearTimeout(toast.t); toast.t=setTimeout(()=>t.innerHTML='',6000); }

/* ---------- History ---------- */
function historyPanel(){
  return `<div class="toolbar"><h2>Runs</h2><span class="hint">each run keeps exactly what it executed, even after you edit the cycle · newest 50 kept</span></div>
  <table class="grid"><tr><th>When</th><th>Status</th><th>Summary</th><th>Duration</th><th></th></tr>
  ${S.runs.map((r,i)=>`<tr><td>${esc(r.when)}</td><td>${r.status==='FAILED'?'<span class="pill p-fail">✕ failed</span>':r.status==='STOPPED'?'<span class="pill p-wait">■ stopped</span>':r.status.includes('DIFF')?'<span class="pill p-diff">⚠ differences</span>':'<span class="pill p-ok">✓ completed</span>'}</td><td class="dim">${esc(r.sum)}</td><td>${esc(r.dur)}</td>
    <td><button class="btn sm" onclick="S.tab='run';render()">Open</button> ${i>0?`<button class="btn sm" onclick="compare()">Compare with newest</button>`:''}</td></tr>`).join('')}</table>
  <div id="cmp"></div>${liveLogPanel()}`;
}
function compare(){
  $('#cmp').innerHTML=`<div class="card" style="padding:12px;margin-top:12px"><h2 style="margin-bottom:8px">Compare runs</h2>
   <table class="grid"><tr><th>Step</th><th>Yesterday</th><th>Now</th><th>Change</th></tr>
   <tr><td>Supplier B</td><td><span class="pill p-diff">⚠ 2</span></td><td><span class="pill p-diff">⚠ 2</span></td><td class="dim">same fields differ</td></tr>
   <tr><td>Price</td><td><span class="pill p-ok">✓</span></td><td><span class="pill p-diff">⚠ total 450 → 455</span></td><td class="wrn">new difference</td></tr>
   <tr><td>Book</td><td><span class="pill p-fail">✕ 500</span></td><td><span class="pill p-fail">✕ 500</span></td><td class="dim">still failing - PRICE_CHANGED</td></tr></table></div>`;
}

/* ---------- walkthrough ---------- */
function resetAll(){ initState(); closeModal(); render(); }
function ensureCycle(){ S._ext=null; if(!S.steps.length){ RECORDED.slice(0,5).forEach(addRecorded); const lo=S.steps.find(s=>s.label==='Logout'); lo.enabled=false; const b=S.steps.find(s=>s.label==='Supplier B'); b.mode='LIVE'; b.cp={before:true,after:false,timeout:30}; S.steps.find(s=>s.label==='Book').cp.after=true; } S.view='cycle'; }
function tour(n){
  closeModal();
  if(n===1){ initState(); S.view='list'; render(); toast('Click “＋ New cycle” - pick calls - then drag ⋮⋮ to reorder'); return; }
  ensureCycle();
  if(n===2){ S.tab='steps'; S.sel=S.steps.find(s=>s.label==='Supplier C').key; S.detailTab='overview'; render(); toast('Each outbound child has its own REPLAY / LIVE switch and match rule'); }
  if(n===3){ S.tab='rules'; S.sel=null; render(); toast('Choose GLOBAL participation, or “Copy into cycle” to edit a copy'); }
  if(n===4){ S.tab='steps'; S.sel=null; render(); openPrerun(); toast('Pre-run check: fix the unresolved {{bookingRef}}, confirm LIVE, start'); }
  if(n===5){ initState(); ensureCycle(); if(!S.vars.some(v=>v.name==='bookingRef')) S.vars.push({name:'bookingRef',value:'QA-1',secret:false,src:'defined'}); S.driver='AUTOMATIC'; startRun(); toast('Supplier B pauses before (held, 30 s timer) · Book pauses after - replay it, edit & replay, then continue'); return; }
  if(n===7){ S.tab='steps'; S.sel=null; render(); openAdd(); return; }
  if(n===8){ S.tab='steps'; S.sel=null; render(); openRebuild(); return; }
  if(n===9){ openLiveCalls(); toast('Tick a few calls, then open Relive ▾ in the bulk bar'); return; }
  if(n===10){ initState(); ensureCycle(); if(!S.vars.some(v=>v.name==='bookingRef')) S.vars.push({name:'bookingRef',value:'QA-1',secret:false,src:'defined'});
    S.vars.push({name:'bookingId',value:'',secret:false,src:'extracted · Book → response.body.bookingId'});
    addRecorded(RECORDED[6]); addRecorded(RECORDED[5]); const lo=S.steps.find(s=>s.label==='Logout'); S.steps=S.steps.filter(x=>x!==lo); S.steps.push(lo); lo.enabled=true;
    S.steps.forEach(x=>x.cp={...x.cp,before:false,after:false}); S.driver='AUTOMATIC'; S.onFail='HOLD'; startRun(); toast('Book fails - the run holds. Continue with next calls: Booking details is skipped (needs {{bookingId}}), Profile and Logout run'); return; }
  if(n===12){ initState(); ensureCycle(); if(!S.vars.some(v=>v.name==='bookingRef')) S.vars.push({name:'bookingRef',value:'QA-1',secret:false,src:'defined'});
    S.steps.forEach(x=>x.cp={...x.cp,before:false,after:false}); const se=S.steps.find(x=>x.label==='Search'); se.req=se.req.replace('2026-10-04','2026-10-11'); se.reqEdited=true;
    S.steps.find(x=>x.label==='Supplier A').onChanged='ASK'; S.unexp='RULES'; S.unexpRules=[{id:'u1',name:'Loyalty stub',host:'loyalty',cond:'',actions:{request:['Mock response (never contact upstream)'],response:[]},on:true}];
    S.simUnexpected=true; S.tab='steps'; S.sel=se.key; S.detailTab='overview'; render(); toast('Search was edited (date → 11 Oct). See the banner, then Run: Supplier A holds and asks, the loyalty call is caught by your rule'); return; }
  if(n===11){ initState(); ensureCycle(); S.tab='steps'; S.sel=S.steps.find(s=>s.label==='Supplier C').key; S.detailTab='overview'; render(); openRuleEditor('call',S.sel); toast('Supplier C\'s call rule: REPLAY = Mock response with the recording. Turn it off, add actions, save'); return; }
  if(n===6){ initState(); ensureCycle(); if(!S.vars.some(v=>v.name==='bookingRef')) S.vars.push({name:'bookingRef',value:'QA-1',secret:false,src:'defined'}); S.steps.forEach(x=>x.cp={...x.cp,before:false,after:false}); S.driver='AUTOMATIC'; startRun(); const wait=setInterval(()=>{ if(S.run.status!=='RUNNING'){ clearInterval(wait); S.sel=S.steps.find(s=>s.label==='Supplier B').key; S.detailTab='diff'; render(); toast('Supplier B: 2 unexpected, 1 expected (GLOBAL rule), 1 noise'); } },300); }
}
render();
</script>
