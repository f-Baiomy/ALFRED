services:

  # The mitmproxy interceptor - a standard HTTP/HTTPS forward proxy. Any client that's been made
  # proxy-aware (e.g. via http.proxyHost/https.proxyHost JVM system properties, injected into an
  # already-running JVM or set normally) gets every call it makes logged, for whatever real
  # hostname it actually calls - no hosts-file redirect or hostname convention needed on this
  # end. See proxy/log_and_route.py for the logging/webhook side.
  proxy:
    image: mitmproxy/mitmproxy:latest
    container_name: proxy
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.2 (not .1) on 443 (the HTTPS default, so a client's https.proxyPort can
      # just be 443) so this doesn't conflict with anything already using 127.0.0.1:443 (e.g. a
      # locally-running app server) - 127.0.0.0/8 is entirely loopback, so any 127.x.x.x address
      # behaves the same.
      - "127.0.0.2:443:8080"
    environment:
      # The proxy only calls the webhook now - backend owns persistence (RECENT_CALLS.log).
      # Container-name DNS works because both services share alfred-net. WEBHOOK_SECRET is a
      # placeholder - use a real secret for any deployment reachable outside a trusted docker
      # network.
      - WEBHOOK_URL=http://backend:5000/calls/webhook
      - WEBHOOK_SECRET=change-me-in-production
    volumes:
      - ./proxy/log_and_route.py:/home/mitmproxy/log_and_route.py:ro
      - ./proxy/certs:/home/mitmproxy/.mitmproxy
    working_dir: /home/mitmproxy
    command: mitmdump -q -s log_and_route.py --mode regular -p 8080 --set connection_strategy=lazy
    # Guardrail, not a tuned limit - normal usage sits well under this (observed ~65MB); caps a
    # runaway connection/large-body burst from taking down the rest of the host.
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alfred-net

  # Reverse-mode mitmproxy sitting in front of the external WildFly server, so the
  # frontend's own calls to WildFly get logged the same way - see
  # proxy/log_and_route_reverse.py. WildFly must be reachable at wildfly-proxy's
  # WILDFLY_UPSTREAM (default localhost:8081, one port above WildFly's usual 8080 -
  # see the port-offset VM option this setup requires on WildFly's own run
  # config). This container owns host port 8080 permanently; logging itself is
  # toggled on/off live via toggle-wildfly-reverse-proxy.sh/.bat (also wired into
  # start.py/restart.py's --wildfly-reverse-proxy flag), which just flips
  # ./proxy/reverse-proxy-enabled.flag - no restart of this container needed.
  wildfly-proxy:
    image: mitmproxy/mitmproxy:latest
    container_name: wildfly-proxy
    restart: unless-stopped
    # Only started when the "inbound-logging" profile is active - start.py/restart.py set
    # COMPOSE_PROFILES=inbound-logging in .env based on settings.properties's inbound_logging_enabled
    # setting, so
    # this container (and the whole feature) simply doesn't exist for a deployment that opts out.
    profiles:
      - inbound-logging
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - WEBHOOK_URL=http://backend:5000/internal-calls/webhook
      - WEBHOOK_SECRET=change-me-in-production
      - TOGGLE_FILE=/home/mitmproxy/reverse-proxy-enabled.flag
      # WildFly runs on the host (started via IntelliJ), not in this compose stack -
      # host.docker.internal resolves to the host machine from inside the container.
      # Override WILDFLY_UPSTREAM (below, baked into the command) if WildFly's
      # port-offset differs from the default +1.
      - WILDFLY_UPSTREAM=http://host.docker.internal:8081
    volumes:
      - ./proxy/log_and_route_reverse.py:/home/mitmproxy/log_and_route_reverse.py:ro
      - ./proxy/reverse-proxy-enabled.flag:/home/mitmproxy/reverse-proxy-enabled.flag
      - ./proxy/certs:/home/mitmproxy/.mitmproxy
    working_dir: /home/mitmproxy
    # sh -c so $WILDFLY_UPSTREAM expands into --mode's argument - Compose's own
    # ${VAR} substitution only applies to the compose file itself, not to values
    # inside a literal `command:` string at container runtime.
    entrypoint: ["sh", "-c"]
    command: ["mitmdump -q -s log_and_route_reverse.py --mode reverse:$$WILDFLY_UPSTREAM -p 8080 --set connection_strategy=lazy"]
    extra_hosts:
      # Docker Desktop (Windows/Mac) already resolves host.docker.internal without
      # this; host-gateway is what makes the same hostname work on Linux too.
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alfred-net

  # Backend - persists calls the proxy's webhook sends it (RECENT_CALLS.log) and serves them
  # over an API, plus a WebSocket push to the dashboard for each new one.
  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    ports:
      # BACKEND_PORT lets a deployment whose default 5000 is already taken by something else
      # (confirmed live: gunicorn already listening on stg-app-210) pick a different host port via
      # a .env file next to this docker-compose.yml, with zero code changes - the frontend service
      # below reads the same variable so both stay in sync from this one place. Only the HOST-side
      # port changes; the container still listens on 5000 internally regardless.
      - "${BACKEND_PORT:-5000}:5000"
      # Remote JDWP debug port - attach IntelliJ's "Remote JVM Debug" run config to
      # localhost:BACKEND_DEBUG_PORT. suspend=n so the JVM starts normally when nothing's
      # attached. Override BACKEND_DEBUG_PORT in .env if 5006 collides with another
      # project's own debug port on this machine.
      - "${BACKEND_DEBUG_PORT:-5006}:5006"
    environment:
      # Picked up automatically by the JVM at startup (no Dockerfile/CMD change needed).
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
      # Recent calls now live here, written by backend itself after each webhook call from
      # the proxy - not read from the proxy's filesystem at all anymore.
      # RECENT_CALLS_FILE/COMMENTS_FILE/SESSION_CYCLES_FILE/SESSION_CYCLES_DIR/PROFILES_FILE/
      # FILTER_SETTINGS_FILE are the legacy flat-file locations - each SQLite adapter checks these
      # on startup and migrates any data found there into its *_DB_FILE below exactly once (see
      # each slice's SqliteXxxMigration/migrateLegacyFileIfPresent), then renames the legacy file
      # to *.migrated. Still set so that migration (and the type=file fallback) keeps working.
      - RECENT_CALLS_FILE=/appdata/RECENT_CALLS.log
      # RECENT_CALLS.log is a ring buffer capped at this many calls - only relevant if
      # alfred.storage.calls.type is switched back to "file"; the SQLite adapter's retention is
      # size-based instead (ALFRED_CALLS_MAX_SIZE_BYTES below).
      - RECENT_CALLS_MAX_LIMIT=200
      - COMMENTS_FILE=/appdata/comments.json
      - SESSION_CYCLES_FILE=/appdata/session-cycles/session-cycles.json
      - SESSION_CYCLES_DIR=/appdata/session-cycles
      - PROFILES_FILE=/appdata/profiles.json
      - FILTER_SETTINGS_FILE=/appdata/filter-settings.json
      # SQLite database files - one per slice, the new default storage (see application.properties'
      # alfred.storage.*.type=sqlite). All inside the same /appdata volume as the legacy files above.
      - CALLS_DB_FILE=/appdata/calls.db
      - SESSION_CYCLES_DB_FILE=/appdata/session-cycles.db
      - PROFILES_DB_FILE=/appdata/profiles.db
      - COMMENTS_DB_FILE=/appdata/comments.db
      - FILTER_SETTINGS_DB_FILE=/appdata/settings.db
      # Retention target for calls.db - once it exceeds this many bytes, the oldest calls are
      # dropped until back under it. Default 100GB; override for a smaller/larger deployment.
      - ALFRED_CALLS_MAX_SIZE_BYTES=107374182400
      # Must match the proxy's WEBHOOK_SECRET above - validates POST /calls/webhook.
      - WEBHOOK_SECRET=change-me-in-production
      # Separate store for calls captured by wildfly-proxy (frontend -> WildFly
      # traffic) - same CallRecord/CallSummary JSON shape as calls.db, kept apart so
      # WildFly traffic never mixes with external supplier-call history.
      - INTERNAL_CALLS_FILE=/appdata/internal-calls.log
      # Same file wildfly-proxy's TOGGLE_FILE points at (bind-mounted a second time here,
      # at a different in-container path) - lets GET/POST /internal-calls/logging-enabled
      # flip the same switch toggle-wildfly-reverse-proxy.sh/.bat already do by hand.
      - REVERSE_PROXY_TOGGLE_FILE=/appdata/reverse-proxy-enabled.flag
      # Deploy-time flag from settings.properties (via .env) - whether the inbound-logging feature
      # exists at all for this deployment. false hides Settings' "Inbound logging" panel
      # entirely; wildfly-proxy itself is gated separately, by the profiles: key above.
      - INBOUND_LOGGING_ENABLED=${INBOUND_LOGGING_ENABLED:-false}
    volumes:
      - ./backend/data:/appdata
      - ./proxy/reverse-proxy-enabled.flag:/appdata/reverse-proxy-enabled.flag
    depends_on:
      - proxy
    # Gives the JVM's -XX:MaxRAMPercentage (see backend/Dockerfile) a real ceiling to be a
    # percentage OF, instead of the whole host - without this, the container has no cgroup memory
    # limit at all and the JVM sizes its heap off the host's total RAM. Raised from 512m: nothing
    # loads a whole dataset into memory anymore (every adapter is SQLite-backed and paginated), but
    # the JDBC driver/connection pools/WAL page cache across five databases need real headroom,
    # and the one-time legacy-file migration still streams through memory once at startup.
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alfred-net

  # Frontend - dashboard that queries backend to display captured calls.
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Read by docker-entrypoint.d/10-generate-env.sh at container start to generate env.js,
      # which tells the browser which port to reach the backend on - see the backend service's
      # BACKEND_PORT comment above for why this needs to be configurable at all.
      - BACKEND_PORT=${BACKEND_PORT:-5000}
    depends_on:
      - backend
    # Guardrail, not a tuned limit - nginx serving a static bundle observed at ~9MB.
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alfred-net

networks:
  alfred-net:
    driver: bridge
