services:

  # The mitmproxy interceptor - a standard HTTP/HTTPS forward proxy. Any client that's been made
  # proxy-aware (e.g. via http.proxyHost/https.proxyHost JVM system properties, injected into an
  # already-running JVM or set normally) gets every call it makes logged, for whatever real
  # hostname it actually calls - no hosts-file redirect or hostname convention needed on this
  # end. See proxy/log_and_route.py for the logging/webhook side.
  #
  # A project can additionally opt into OUTBOUND attribution by adding an outboundProxyHost
  # (:outboundProxyPort, defaults to 443) to its entry in settings.properties's
  # internal_call_services - proxy/forward-proxy-entrypoint.sh then gives this container one
  # extra forward-mode listener for that project alongside the default one below (see
  # FORWARD_PROXY_PORT_MAP), so every outbound call from that project's own HTTP client (pointed
  # at its own dedicated address) gets tagged with which project made it. See
  # docs/supplier-integrations.md.
  #
  # NOTE: each opted-in project's outboundProxyHost:outboundProxyPort publish lives in the
  # GENERATED docker-compose.override.yml (written by start.py/restart.py), not here - same
  # reason reverse-proxy's per-project listenPort publishes do (Compose can't expand a
  # variable-length port list from an env var).
  proxy:
    image: mitmproxy/mitmproxy:latest
    container_name: proxy
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.2 (not .1) on 443 (the HTTPS default, so a client's https.proxyPort can
      # just be 443) so this doesn't conflict with anything already using 127.0.0.1:443 (e.g. a
      # locally-running app server) - 127.0.0.0/8 is entirely loopback, so any 127.x.x.x address
      # behaves the same.
      - "127.0.0.2:443:8080"
    environment:
      # The proxy only calls the webhook now - backend owns persistence (RECENT_CALLS.log).
      # Container-name DNS works because both services share alfred-net. WEBHOOK_SECRET is a
      # placeholder - use a real secret for any deployment reachable outside a trusted docker
      # network.
      - WEBHOOK_URL=http://backend:5000/calls/webhook
      - WEBHOOK_SECRET=change-me-in-production
      # Must match the default listener's own internal port - forward-proxy-entrypoint.sh falls
      # back to this same default if unset, kept explicit here so both stay in sync.
      - FORWARD_PROXY_DEFAULT_PORT=8080
      # One "name:internalPort" pair per project that opted into outbound attribution, baked into
      # .env from settings.properties's internal_call_services by start.py/restart.py (single
      # source of truth - don't set this directly here). May be empty (no project opted in yet),
      # in which case only the default listener above is active, exactly as before this feature
      # existed.
      - FORWARD_PROXY_PORT_MAP=${FORWARD_PROXY_PORT_MAP:-}
      # Traffic interception / fault injection. Rules are evaluated ENTIRELY inside this container
      # against the snapshot backend writes into the shared ./proxy/interception directory - a
      # proxied request never costs a backend round trip or a database query, and rules keep
      # applying while backend is down. Absent or empty file = no interception at all, byte for
      # byte the behaviour this container had before the feature existed. See
      # proxy/interception.py and backend-interception's FileRulesPublisherAdapter.
      - INTERCEPTION_RULES_FILE=/home/mitmproxy/interception/rules.json
      # Where a PAUSED call goes to wait for a human. Derived from WEBHOOK_URL when unset; stated
      # here because the breakpoint path is the one thing in this feature that does talk to
      # backend on the request path (see proxy/breakpoints.py for why that is acceptable there
      # and nowhere else).
      - INTERCEPTION_API_URL=http://backend:5000
    # Resolve supplier hostnames through explicit public DNS rather than Docker Desktop's relay to
    # the host's own resolvers. WHY: Windows assigns most interfaces the legacy site-local
    # placeholders fec0:0:0:ffff::1/2/3 (and link-local fe80::1), which answer nothing - only the
    # active interface carries a real resolver. Windows itself never notices, because it orders
    # resolvers by interface metric; Docker Desktop's relay does not, so a container lookup that
    # lands on a dead placeholder just times out. That surfaces as mitmproxy reporting
    # "[Errno -3] Temporary failure in name resolution" (EAI_AGAIN - the query timed out, NOT
    # NXDOMAIN, which would be -2) for a supplier host that resolves perfectly well seconds later.
    # Intermittent by nature, and invisible on the direct path: a JVM bypassing this proxy resolves
    # via Windows (correct resolver order, plus an OS-level DNS cache absorbing any blip), whereas
    # this container has no DNS cache at all - glibc doesn't cache and there's no nscd in the image
    # - so every single lookup is exposed to the relay live.
    #
    # Does NOT break container-name resolution (backend:5000 for the webhook above): alfred-net is
    # a user-defined bridge, so /etc/resolv.conf still points at Docker's embedded resolver
    # 127.0.0.11, which keeps answering service names itself and only forwards what it can't answer
    # on to these. Verified: `backend` still resolves after this was applied.
    #
    # Swap these for your own internal DNS if a supplier host ever needs split-horizon resolution
    # that public resolvers can't see.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./proxy/log_and_route.py:/home/mitmproxy/log_and_route.py:ro
      - ./proxy/interception.py:/home/mitmproxy/interception.py:ro
      - ./proxy/breakpoints.py:/home/mitmproxy/breakpoints.py:ro
      # The DIRECTORY, not the file. backend publishes the snapshot by writing a temp file beside
      # it and moving it into place, which is what stops a proxy ever reading a half-written rule
      # set - and a single-file bind mount cannot survive that, since the move swaps the inode the
      # mount is pinned to and updates would silently stop arriving.
      - ./proxy/interception:/home/mitmproxy/interception:ro
      - ./proxy/forward-proxy-entrypoint.sh:/home/mitmproxy/forward-proxy-entrypoint.sh:ro
      - ./proxy/certs:/home/mitmproxy/.mitmproxy
    working_dir: /home/mitmproxy
    entrypoint: ["sh", "/home/mitmproxy/forward-proxy-entrypoint.sh"]
    # Guardrail, not a tuned limit - normal usage sits well under this (observed ~65MB); caps a
    # runaway connection/large-body burst from taking down the rest of the host.
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alfred-net

  # Reverse-mode mitmproxy fronting any number of NAMED upstream projects (e.g. multiple
  # WildFly-style apps, each already running on its own port) - one listener per project inside
  # this single container, see proxy/reverse-proxy-entrypoint.sh (builds one "--mode reverse:"
  # flag per project from REVERSE_PROXY_PORT_MAP) and proxy/log_and_route_reverse.py (logs each
  # call, identifying the project by the port it arrived on - it does not route).
  #
  # Add a project by adding a "name:listenPort:upstreamPort" triple to settings.properties's
  # internal_call_services: Alfred then listens on that NEW listenPort and forwards to the
  # project's own unchanged port, so callers just swap http://localhost:<upstreamPort>/... for
  # http://localhost:<listenPort>/.... No hostnames, no hosts-file entries, and nothing moves
  # off its own port. Staying on "localhost" is deliberate - a per-project hostname would make
  # every browser API call cross-site and get its session cookie dropped.
  #
  # NOTE: the per-project listenPort publishes live in the GENERATED docker-compose.override.yml
  # (written by start.py/restart.py from that same list), not here - Compose can't expand a
  # variable-length port list from an env var.
  #
  # Each project's logging is toggled on/off independently, live, from the Settings UI (GET/POST
  # /internal-calls/services...) or toggle-wildfly-reverse-proxy.sh/.bat <name> [on|off] - both
  # just flip a line in ./proxy/reverse-proxy-enabled.flag, no restart of this container needed.
  reverse-proxy:
    image: mitmproxy/mitmproxy:latest
    container_name: reverse-proxy
    restart: unless-stopped
    # Only started when the "inbound-logging" profile is active - start.py/restart.py set
    # COMPOSE_PROFILES=inbound-logging in .env based on settings.properties's
    # reverse_proxy_enabled setting, so this container (and the whole feature) simply doesn't
    # exist for a deployment that only needs OUTBOUND logging (the "proxy" service, unaffected
    # by this flag and always running).
    profiles:
      - inbound-logging
    environment:
      - WEBHOOK_URL=http://backend:5000/internal-calls/webhook
      - WEBHOOK_SECRET=change-me-in-production
      - TOGGLE_FILE=/home/mitmproxy/reverse-proxy-enabled.flag
      # One "name:listenPort:upstreamPort" triple per project, comma-separated, no spaces - the
      # SAME list backend's INTERNAL_CALL_SERVICES below is given (single source of truth, baked
      # into .env from settings.properties's internal_call_services by start.py/restart.py -
      # don't set this directly here, edit settings.properties instead). May be empty (no
      # projects configured yet), in which case this container starts and idles.
      - REVERSE_PROXY_PORT_MAP=${INTERNAL_CALL_SERVICES:-}
      # All upstreams are assumed to run on the host machine (e.g. started via IntelliJ), not in
      # this compose stack - host.docker.internal resolves to the host from inside the container.
      # Override only if some project's upstream lives elsewhere.
      - REVERSE_PROXY_UPSTREAM_HOST=host.docker.internal
      # Same interception rule set as the forward proxy - one file, both directions. A rule scopes
      # itself to a direction with its own `source` matcher rather than by living in a different
      # file (see proxy/interception.py's Match).
      - INTERCEPTION_RULES_FILE=/home/mitmproxy/interception/rules.json
      - INTERCEPTION_API_URL=http://backend:5000
    volumes:
      - ./proxy/log_and_route_reverse.py:/home/mitmproxy/log_and_route_reverse.py:ro
      - ./proxy/interception.py:/home/mitmproxy/interception.py:ro
      - ./proxy/breakpoints.py:/home/mitmproxy/breakpoints.py:ro
      # See the forward proxy's identical mount for why this is the directory and not the file.
      - ./proxy/interception:/home/mitmproxy/interception:ro
      - ./proxy/reverse-proxy-entrypoint.sh:/home/mitmproxy/reverse-proxy-entrypoint.sh:ro
      - ./proxy/reverse-proxy-enabled.flag:/home/mitmproxy/reverse-proxy-enabled.flag
      - ./proxy/certs:/home/mitmproxy/.mitmproxy
    working_dir: /home/mitmproxy
    entrypoint: ["sh", "/home/mitmproxy/reverse-proxy-entrypoint.sh"]
    extra_hosts:
      # Docker Desktop (Windows/Mac) already resolves host.docker.internal without
      # this; host-gateway is what makes the same hostname work on Linux too.
      - "host.docker.internal:host-gateway"
    mem_limit: 256m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alfred-net

  # Backend - persists calls the proxy's webhook sends it (RECENT_CALLS.log) and serves them
  # over an API, plus a WebSocket push to the dashboard for each new one.
  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    ports:
      # BACKEND_PORT lets a deployment whose default 5000 is already taken by something else
      # (confirmed live: gunicorn already listening on stg-app-210) pick a different host port via
      # a .env file next to this docker-compose.yml, with zero code changes - the frontend service
      # below reads the same variable so both stay in sync from this one place. Only the HOST-side
      # port changes; the container still listens on 5000 internally regardless.
      - "${BACKEND_PORT:-5000}:5000"
      # Remote JDWP debug port - attach IntelliJ's "Remote JVM Debug" run config to
      # localhost:BACKEND_DEBUG_PORT. suspend=n so the JVM starts normally when nothing's
      # attached. Override BACKEND_DEBUG_PORT in .env if 5006 collides with another
      # project's own debug port on this machine.
      - "${BACKEND_DEBUG_PORT:-5006}:5006"
    environment:
      # Picked up automatically by the JVM at startup (no Dockerfile/CMD change needed).
      - JAVA_TOOL_OPTIONS=-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006
      # Recent calls now live here, written by backend itself after each webhook call from
      # the proxy - not read from the proxy's filesystem at all anymore.
      # RECENT_CALLS_FILE/COMMENTS_FILE/SESSION_CYCLES_FILE/SESSION_CYCLES_DIR/PROFILES_FILE/
      # FILTER_SETTINGS_FILE are the legacy flat-file locations - each SQLite adapter checks these
      # on startup and migrates any data found there into its *_DB_FILE below exactly once (see
      # each slice's SqliteXxxMigration/migrateLegacyFileIfPresent), then renames the legacy file
      # to *.migrated. Still set so that migration (and the type=file fallback) keeps working.
      - RECENT_CALLS_FILE=/appdata/RECENT_CALLS.log
      # RECENT_CALLS.log is a ring buffer capped at this many calls - only relevant if
      # alfred.storage.calls.type is switched back to "file"; the SQLite adapter's retention is
      # size-based instead (ALFRED_CALLS_MAX_SIZE_BYTES below).
      - RECENT_CALLS_MAX_LIMIT=200
      - COMMENTS_FILE=/appdata/comments.json
      - SESSION_CYCLES_FILE=/appdata/session-cycles/session-cycles.json
      - SESSION_CYCLES_DIR=/appdata/session-cycles
      - PROFILES_FILE=/appdata/profiles.json
      - FILTER_SETTINGS_FILE=/appdata/filter-settings.json
      # SQLite database files - one per slice, the new default storage (see application.properties'
      # alfred.storage.*.type=sqlite). All inside the same /appdata volume as the legacy files above.
      - CALLS_DB_FILE=/appdata/calls.db
      - SESSION_CYCLES_DB_FILE=/appdata/session-cycles.db
      - PROFILES_DB_FILE=/appdata/profiles.db
      - COMMENTS_DB_FILE=/appdata/comments.db
      - FILTER_SETTINGS_DB_FILE=/appdata/settings.db
      # Retention target for calls.db - once it exceeds this many bytes, the oldest calls are
      # dropped until back under it. 10GB.
      #
      # This was 100GB, which is larger than the free disk on any machine Alfred has actually run
      # on - so retention could never fire, and the disk would fill first (measured: ~230KB per
      # call against real traffic, so 100GB is ~437,000 calls while 27GB of free space runs out at
      # ~117,000). A cap above your free space is not a cap. 10GB is ~45,000 calls at that average;
      # raise it only to something the volume can genuinely hold, and remember call sizes vary
      # hugely (measured 396 bytes to 640KB), which is why this is bytes and not a row count.
      - ALFRED_CALLS_MAX_SIZE_BYTES=10737418240
      # Must match the proxy's WEBHOOK_SECRET above - validates POST /calls/webhook.
      - WEBHOOK_SECRET=change-me-in-production
      # Separate store for calls captured by reverse-proxy (frontend/other clients -> whichever
      # upstream project owns the listenPort the request arrived on, per REVERSE_PROXY_PORT_MAP) -
      # same CallRecord/CallSummary JSON shape as calls.db, kept apart so inbound traffic never
      # mixes with external supplier-call history.
      - INTERNAL_CALLS_FILE=/appdata/internal-calls.log
      # How many inbound calls that ring-buffer file keeps. Deploy-time setting from
      # settings.properties's inbound_calls_retention_rows (baked into .env by start.py/
      # restart.py, single source of truth) - don't set it here, edit settings.properties. The
      # fallback only applies to a deployment whose .env predates this setting; start.py always
      # writes it. NOT the same as alfred.internal-calls.max-limit, which is only the largest
      # page GET /internal-calls will serve - see docs/architecture.md.
      - INTERNAL_CALLS_RETENTION_ROWS=${INTERNAL_CALLS_RETENTION_ROWS:-1500}
      # Same file reverse-proxy's TOGGLE_FILE points at (bind-mounted a second time here,
      # at a different in-container path) - lets GET/POST /internal-calls/services/{name}/
      # logging-enabled flip the same per-project lines toggle-wildfly-reverse-proxy.sh/.bat
      # already do by hand.
      - REVERSE_PROXY_TOGGLE_FILE=/appdata/reverse-proxy-enabled.flag
      # The SAME "name:listenPort:upstreamPort" list as reverse-proxy's REVERSE_PROXY_PORT_MAP
      # above (single source of truth, baked into .env from settings.properties's
      # internal_call_services) - lets backend know every configured project's name/ports to
      # list in GET /internal-calls/services, without duplicating that list separately here.
      - INTERNAL_CALL_SERVICES=${INTERNAL_CALL_SERVICES:-}
      # Deploy-time flag from settings.properties's reverse_proxy_enabled (via .env) - whether
      # the inbound-logging feature exists at all for this deployment. false hides Settings'
      # "Inbound logging" panel entirely; reverse-proxy itself is gated separately, by the
      # profiles: key above - both read the same setting, kept in sync by start.py/restart.py.
      - REVERSE_PROXY_ENABLED=${REVERSE_PROXY_ENABLED:-false}
      # Interception rules: authored and stored here, published as a snapshot both proxies read.
      # The .db is the store of record (it keeps disabled rules, descriptions and timestamps);
      # rules.json holds only what the engine needs to evaluate, and is rewritten on every change
      # plus once at startup, so a lost or stale file can never leave the UI and the traffic
      # disagreeing about what is running.
      - INTERCEPTION_DB_FILE=/appdata/interception.db
      - INTERCEPTION_RULES_FILE=/appdata/interception/rules.json
    volumes:
      - ./backend/data:/appdata
      - ./proxy/reverse-proxy-enabled.flag:/appdata/reverse-proxy-enabled.flag
      # Writable here, read-only in both proxies - backend is the only writer.
      - ./proxy/interception:/appdata/interception
    depends_on:
      - proxy
    # Gives the JVM's -XX:MaxRAMPercentage (see backend/Dockerfile) a real ceiling to be a
    # percentage OF, instead of the whole host - without this, the container has no cgroup memory
    # limit at all and the JVM sizes its heap off the host's total RAM. The JDBC driver/connection
    # pools/WAL page cache across five databases need real headroom, and the one-time legacy-file
    # migration still streams through memory once at startup.
    #
    # Raised from 1g, which was sized on the premise that "every adapter is SQLite-backed and
    # paginated" - true of every slice EXCEPT backend-internal-calls, the one slice with no SQLite
    # adapter (see CLAUDE.md). That one keeps its whole retained window resident in memory:
    # alfred.internal-calls.retention-rows (1500) x ~28 KB per real call is a ~42 MB file, cached as
    # both raw line text and parsed records, so ~90 MB is simply always live there.
    #
    # At 1g, MaxRAMPercentage=50 gave a 512 MB heap with only ~512 MB left for EVERYTHING else the
    # JVM needs - metaspace, code cache, thread stacks, GC structures, Jackson buffers - which is no
    # headroom at all. Measured: the container sat pegged at 1019 MiB of 1024 MiB and threw
    # OutOfMemoryError under concurrent inbound traffic, silently dropping calls (the proxy delivered
    # every webhook; the handler OOMed before persisting). Sequential traffic was unaffected, which
    # is what made it look intermittent. 2g keeps the same 50% split but leaves the JVM ~1 GB of
    # non-heap headroom, which is the conventional ratio.
    mem_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alfred-net

  # Frontend - dashboard that queries backend to display captured calls.
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Read by docker-entrypoint.d/10-generate-env.sh at container start to generate env.js,
      # which tells the browser which port to reach the backend on - see the backend service's
      # BACKEND_PORT comment above for why this needs to be configurable at all.
      - BACKEND_PORT=${BACKEND_PORT:-5000}
    depends_on:
      - backend
    # Guardrail, not a tuned limit - nginx serving a static bundle observed at ~9MB.
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - alfred-net

networks:
  alfred-net:
    driver: bridge
