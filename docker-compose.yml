services:

  # The mitmproxy interceptor - logs every supplier request/response
  alfred:
    image: mitmproxy/mitmproxy:latest
    container_name: alfred
    restart: unless-stopped
    ports:
      - "8444:8080"
    environment:
      - LOG_FILE=/home/mitmproxy/logs/calls.log
    volumes:
      - ./proxy/log_and_route.py:/home/mitmproxy/log_and_route.py:ro
      - ./proxy/logs:/home/mitmproxy/logs
      - ./proxy/certs:/home/mitmproxy/.mitmproxy
    working_dir: /home/mitmproxy
    command: mitmdump -q -s log_and_route.py --mode reverse:https://placeholder.invalid -p 8080 --set upstream_cert=false --set connection_strategy=lazy
    networks:
      - alfred-net

  # Backend - reads the proxy's log file and serves it over an API.
  # Scope/endpoints to be expanded once discussed further.
  pennyworth:
    build:
      context: ./backend
    container_name: pennyworth
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - LOG_FILE=/data/calls.log
      - COMMENTS_FILE=/appdata/comments.json
    volumes:
      - ./proxy/logs:/data:ro
      - ./backend/data:/appdata
    depends_on:
      - alfred
    networks:
      - alfred-net

  # Frontend - dashboard that queries pennyworth to display captured calls.
  manor:
    build:
      context: ./frontend
    container_name: manor
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - pennyworth
    networks:
      - alfred-net

networks:
  alfred-net:
    driver: bridge
