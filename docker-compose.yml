services:

  # The mitmproxy interceptor - logs every supplier request/response
  proxy:
    image: mitmproxy/mitmproxy:latest
    container_name: proxy
    restart: unless-stopped
    ports:
      # Bound to 127.0.0.2 (not .1) on 443 (the HTTPS default, so "-proxy" URLs never need an
      # explicit port) so this doesn't conflict with anything already using 127.0.0.1:443 -
      # 127.0.0.0/8 is entirely loopback, so any 127.x.x.x address behaves the same. hosts file
      # entries for "-proxy" hostnames (written by start.ps1/start.sh) point here, not at .1.
      - "127.0.0.2:443:8080"
    environment:
      # The proxy only calls the webhook now - backend owns persistence (RECENT_CALLS.log).
      # Container-name DNS works because both services share alfred-net. WEBHOOK_SECRET is a
      # placeholder - use a real secret for any deployment reachable outside a trusted docker
      # network.
      - WEBHOOK_URL=http://backend:5000/calls/webhook
      - WEBHOOK_SECRET=change-me-in-production
    volumes:
      - ./proxy/log_and_route.py:/home/mitmproxy/log_and_route.py:ro
      - ./proxy/certs:/home/mitmproxy/.mitmproxy
    working_dir: /home/mitmproxy
    command: mitmdump -q -s log_and_route.py --mode reverse:https://placeholder.invalid -p 8080 --set upstream_cert=false --set connection_strategy=lazy
    networks:
      - alfred-net

  # Backend - persists calls the proxy's webhook sends it (RECENT_CALLS.log) and serves them
  # over an API, plus a WebSocket push to the dashboard for each new one.
  backend:
    build:
      context: ./backend
    container_name: backend
    restart: unless-stopped
    ports:
      # BACKEND_PORT lets a deployment whose default 5000 is already taken by something else
      # (confirmed live: gunicorn already listening on stg-app-210) pick a different host port via
      # a .env file next to this docker-compose.yml, with zero code changes - the frontend service
      # below reads the same variable so both stay in sync from this one place. Only the HOST-side
      # port changes; the container still listens on 5000 internally regardless.
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      # Recent calls now live here, written by backend itself after each webhook call from
      # the proxy - not read from the proxy's filesystem at all anymore.
      - RECENT_CALLS_FILE=/appdata/RECENT_CALLS.log
      # RECENT_CALLS.log is a ring buffer capped at this many calls - both the file's own
      # trimming and the GET /calls?limit= clamp read this same value.
      - RECENT_CALLS_MAX_LIMIT=200
      - COMMENTS_FILE=/appdata/comments.json
      # Session-cycle metadata (one shared file) and per-cycle captured-call files (one per
      # cycle, in this directory) - both inside the same /appdata volume as the two files above.
      - SESSION_CYCLES_FILE=/appdata/session-cycles/session-cycles.json
      - SESSION_CYCLES_DIR=/appdata/session-cycles
      - PROFILES_FILE=/appdata/profiles.json
      # Must match the proxy's WEBHOOK_SECRET above - validates POST /calls/webhook.
      - WEBHOOK_SECRET=change-me-in-production
    volumes:
      - ./backend/data:/appdata
    depends_on:
      - proxy
    networks:
      - alfred-net

  # Frontend - dashboard that queries backend to display captured calls.
  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      # Read by docker-entrypoint.d/10-generate-env.sh at container start to generate env.js,
      # which tells the browser which port to reach the backend on - see the backend service's
      # BACKEND_PORT comment above for why this needs to be configurable at all.
      - BACKEND_PORT=${BACKEND_PORT:-5000}
    depends_on:
      - backend
    networks:
      - alfred-net

networks:
  alfred-net:
    driver: bridge
