# Alfred deployment settings.
#
# key=value lines only - blank lines and lines starting with # are ignored. Read by
# start.py/restart.py before "docker compose up" and used to fill in .env (REVERSE_PROXY_ENABLED,
# INTERNAL_CALL_SERVICES, INTERNAL_CALLS_RETENTION_ROWS), so every setting here is a DEPLOY-TIME
# flag: editing this file has no effect until you re-run start.py or restart.py - it is not
# picked up live.
#
# A value may reference the environment with ${ENV_VAR} or ${ENV_VAR:default} - the same
# ${x:default} syntax backend/backend-app's application.properties already uses for Spring -
# resolved against the process environment start.py/restart.py run in. ${ENV_VAR:default} uses
# ENV_VAR when it's set, the default otherwise; ${ENV_VAR} with no default and no such variable
# set is left as the literal text, unresolved, so a required value that's actually missing stays
# visibly wrong instead of silently blank. This is what lets one settings.properties (committed,
# shared by everyone) hold a value that still differs per machine or CI run - see wildfly_home
# below for a real one.
#
# NATIVE INSTALL (specs/012-server-program, docs/server.md): the same file ships with the installer
# and holds the DEFAULT of every setting in its ${ENV_NAME:default} placeholder. The native install
# reads .env in the Alfred folder (created on first start with every setting at its default); a key
# missing from .env uses the default here. The Settings tab's Server section and "alfred config"
# edit .env, never this file. Shipped defaults are neutral: no projects, inbound logging off - a
# team's own values live in its .env.
#
# ONLY FILLS IN A GAP - once a setting has a real value in .env (gitignored, never touched by
# git), THAT is what's actually running, and this file's value for that same setting is ignored
# from then on. This is what lets this file be reset to whatever's committed - e.g. by
# "python3 deploy.py"'s "git reset --hard", which discards local edits to any tracked file the
# same way - without a deploy ever reverting a setting you already have running: nothing already
# in .env gets overwritten, and a setting added here in a newer commit still gets adopted the
# first time your deployment sees it (it isn't in .env yet). To CHANGE a setting that's already
# running, editing this file alone is not enough: edit .env directly, or delete that setting's
# line from .env and re-run start.py/restart.py so it re-derives it from here.

# Whether reverse-proxy (INBOUND frontend/other-client -> project logging) is used at all for
# this deployment. Many environments only ever need OUTBOUND logging (the always-running
# "proxy" service, unaffected by this flag) and have no inbound project to front - this keeps
# reverse-proxy from starting at all for them, rather than starting an idle container with
# nothing configured.
#
# false (default): reverse-proxy is never started, and the "Inbound logging" Settings panel is
#   hidden entirely - there would be nothing for it to control. internal_call_services below is
#   ignored either way.
# true: reverse-proxy starts along with everything else, fronting whichever projects are
#   listed in internal_call_services below (may still be empty - it'll just have nothing to
#   route yet), and Settings shows the "Inbound logging" panel.
#
# ${REVERSE_PROXY_ENABLED:...} - same name .env/docker-compose.yml already use for this exact
# setting once it's synced, so exporting it before running start.py/restart.py overrides the
# default below without editing this file.
reverse_proxy_enabled=${REVERSE_PROXY_ENABLED:false}

# The projects reverse-proxy fronts for inbound logging, and/or the "proxy" service fronts for
# per-project OUTBOUND attribution - the inbound part (first 3 fields) is only relevant when
# reverse_proxy_enabled=true above; the outbound part (optional 4th/5th fields) is independent
# of that flag and always available.
#
# One entry per project, comma-separated, no spaces:
#   name:listenPort:upstreamPort[:outboundProxyHost[:outboundProxyPort]]
#
#   name              what to call it in the dashboard/Settings, e.g. "odeysys"
#   listenPort        a NEW, free port Alfred listens on for this project's INBOUND traffic,
#                     e.g. 9001
#   upstreamPort      that project's OWN real port, unchanged, e.g. 8080
#   outboundProxyHost OPTIONAL - a loopback alias (e.g. 127.0.0.2, 127.0.0.3, ... - a different
#                     one per project) this project's own OUTBOUND HTTP client points its
#                     HTTP_PROXY/HTTPS_PROXY (or JVM http.proxyHost) at, so every external call
#                     it makes gets tagged with which project made it instead of showing up as
#                     unattributed "External" traffic. Omit entirely for a project that doesn't
#                     need outbound attribution.
#   outboundProxyPort OPTIONAL, only meaningful if outboundProxyHost is also set - defaults to
#                     443 (matching the existing forward-proxy's conventional port) when omitted.
#
# Inbound callers reach the project at http://localhost:<listenPort>/... instead of
# http://localhost:<upstreamPort>/... - nothing about the project itself changes, Alfred just
# adds a logged front door in front of it. Routing is by which listenPort a request arrived on,
# so no hosts-file entries and no hostnames are involved at all: staying on "localhost" is what
# keeps session cookies working (a different hostname would be cross-site, and browsers drop
# SameSite=Lax cookies there - see docs/supplier-integrations.md).
#
# Examples - three projects, showing all three entry shapes at once:
#   internal_call_services=odeysys:9001:8080:127.0.0.2,core-service:9002:8083:127.0.0.3:9443,legacy-app:9003:8090
# odeysys gets inbound logging AND outbound attribution on 127.0.0.2:443; core-service gets both,
# with outbound attribution on 127.0.0.3:9443; legacy-app (today's original 3-field format) gets
# only inbound logging, no outbound attribution at all.
#
# Each project's INBOUND logging can be switched on/off independently, LIVE (no restart, unlike
# this list itself), from the Settings UI's "Inbound logging" panel, or via
# toggle-wildfly-reverse-proxy.sh/.bat <name> [on|off|status] from a terminal. Outbound
# attribution has no separate on/off toggle - a project either has an outboundProxyHost
# configured here or it doesn't.
#
# ${INTERNAL_CALL_SERVICES:...} - same name .env/docker-compose.yml already use for this exact
# setting once it's synced, so exporting it before running start.py/restart.py overrides the
# default below without editing this file (e.g. a per-machine port list in CI).
internal_call_services=${INTERNAL_CALL_SERVICES:}

# How many INBOUND calls Alfred keeps in its live list before the oldest is dropped.
#
# Inbound calls are stored in a database (internal-calls.db) since specs/013-inbound-calls-store, and this
# count is kept alongside a total-size cap (inbound_calls_max_size_bytes below): the oldest calls are removed
# when either is reached, a few at a time, never by rewriting everything. Outbound calls are unaffected - they
# live in calls.db, capped by total size (ALFRED_CALLS_MAX_SIZE_BYTES).
#
# Session cycles are also unaffected: a call already captured into a cycle stays there forever
# regardless of this, which is the reliable way to keep a call you care about.
#
# The count no longer costs memory: until 2026-10-09 inbound calls were kept in a flat file held entirely in
# memory (835 MB live at 7,000 calls in a 1 GB heap, and stalls long enough to lose calls' reports). That store
# still exists as an opt-out - INTERNAL_CALLS_STORAGE=file in .env - and only there does this count cost memory
# (~28-67 KB per call). On first start the database takes over the calls the file was serving and keeps the file
# as internal-calls.log.migrated.
#
# ${INTERNAL_CALLS_RETENTION_ROWS:...} - same name .env/docker-compose.yml/backend's own
# application.properties all already use for this exact setting (not "INBOUND_..." - the key here
# predates that naming, the env var name doesn't), so exporting it before running
# start.py/restart.py overrides the default below without editing this file.
inbound_calls_retention_rows=${INTERNAL_CALLS_RETENTION_ROWS:1500}

# Total size kept for inbound calls (bytes), alongside the count above - whichever is reached first.
inbound_calls_max_size_bytes=${INTERNAL_CALLS_MAX_SIZE_BYTES:10737418240}

# Whether to apply WildFly's -Djboss.socket.binding.port-offset=1 VM option automatically -
# LEGACY/OPTIONAL now that reverse-proxy takes its own listenPort per project rather than
# claiming a project's own port outright. Only turn this on if you specifically want WildFly
# reachable on its ORIGINAL port both proxied and unproxied at once. Not required for inbound
# logging to work at all - just add WildFly's name:listenPort:upstreamPort to
# internal_call_services above like any other project instead, and leave this false.
#
# ${WILDFLY_PORT_OFFSET_ENABLED:...} - read only by sync-wildfly-port-offset.py, straight from
# this file, never synced into .env/docker-compose.yml (nothing in a container needs it) - so
# unlike the settings above, this env var name has no other significance; it just gives you the
# same per-machine override without editing this file.
wildfly_port_offset_enabled=${WILDFLY_PORT_OFFSET_ENABLED:false}

# WildFly's install directory (the folder containing bin/standalone.conf(.bat)) - only read when
# wildfly_port_offset_enabled=true above. ${WILDFLY_HOME:} is a real property placeholder now
# (see the file header above), not a hardcoded fallback: it resolves to the WILDFLY_HOME
# environment variable when that's set, and to "" (skipping the port-offset step, with a warning)
# when it isn't - the same behavior as before, just no longer a special case in the code that
# reads this. Replace the whole ${...} with a literal path instead if every machine that deploys
# this should use the same install directory. Restart WildFly after enabling/disabling for the
# change to take effect either way.
wildfly_home=${WILDFLY_HOME:}

# Host folder whose files the Logs Explorer can load ("File on server") or follow ("Follow a
# file"). Mounted read-only into backend at /logs - backend never writes to it. Relative paths are
# relative to this repo. Synced into .env as ALFRED_LOGS_DIR.
logs_drop_dir=${ALFRED_LOGS_DIR:./logs-drop}

# Folders the Logs Explorer LISTENS ON live (Logs > New source > Watch a folder) - separate from
# logs_drop_dir, which is only for loading files. "name:path" pairs, comma separated, e.g.
#   wildfly:/opt/wildfly/standalone/log,portal:/srv/portal/logs   (Linux)
#   wildfly:D:\wildfly\standalone\log                          (Windows)
# Each is mounted read-only into backend at /watch/<name>. New lines show up live, as they are
# written - nothing polls. Synced into .env as ALFRED_LOGS_WATCH_DIRS; after changing it, run
# restart.py (Docker only adds mounts when it recreates the container).
logs_watch_dirs=${ALFRED_LOGS_WATCH_DIRS:}
# How changes are noticed: events = the backend is notified by the kernel (Linux hosts, or a log
# writer sharing a Docker volume); agent = a small host program (log-agent/agent.py) receives the
# OS notifications and reports them (needed on Docker Desktop for Windows/macOS, which passes no
# host file events into containers); auto = agent on Windows/macOS, events on Linux.
# Synced into .env as ALFRED_LOGS_WATCH_MODE.
logs_watch_mode=${ALFRED_LOGS_WATCH_MODE:auto}

# ---------------------------------------------------------------------------------------------
# Settings added for the native install (specs/012-server-program). Docker reads the ones it can
# use from .env too; the others only mean something to the native install, as noted.
# ---------------------------------------------------------------------------------------------

# The one port for the UI, the API and Claude's tools (/mcp). Native install only - Docker
# publishes the gateway on 3000 in docker-compose.yml.
ui_port=${ALFRED_UI_PORT:3000}

# The address Java apps send their outbound calls to (http.proxyHost/https.proxyHost + port).
# 127.0.0.2 rather than 127.0.0.1 so it never collides with an app server on 127.0.0.1:443.
outbound_proxy_listen=${ALFRED_OUTBOUND_PROXY_LISTEN:127.0.0.2:443}

# Who may change server settings and restart Alfred from the Settings tab: local (this machine),
# lan (private network addresses), and/or addresses and CIDR ranges, comma separated. Requests
# through the Cloudflare tunnel are always read-only. Native install only.
settings_edit_from=${ALFRED_SETTINGS_EDIT_FROM:local,lan}

# Updates (native install). off: never look for new releases. check: look once a day and show an
# update in the Server card and `alfred status`. auto: also install it, inside update_window.
update_mode=${ALFRED_UPDATE_MODE:check}

# The latest.json a release publishes next to its installers (build_dist.py writes it, the release
# workflow uploads it). A file:// URL to a folder on a share serves servers without internet.
update_url=${ALFRED_UPDATE_URL:https://github.com/f-Baiomy/ALFRED/releases/latest/download/latest.json}

# When an automatic update may stop and start Alfred: HH:MM-HH:MM, server time zone. Empty = any time.
update_window=${ALFRED_UPDATE_WINDOW:02:00-04:00}

# Total size kept for outbound calls (bytes; 10 GB is what docker-compose.yml has always used).
calls_max_size_bytes=${ALFRED_CALLS_MAX_SIZE_BYTES:10737418240}

# Total size kept for captured database statements and Redis commands (bytes).
db_capture_max_size_bytes=${ALFRED_DB_CAPTURE_MAX_SIZE_BYTES:4294967296}
redis_capture_max_size_bytes=${ALFRED_REDIS_CAPTURE_MAX_SIZE_BYTES:2147483648}

# Java heap for the backend (-Xmx). Native install only - Docker uses mem_limit in docker-compose.yml.
memory=${ALFRED_MEMORY:2g}

# Shared secrets. Empty here on purpose: the native installer generates WEBHOOK_SECRET into .env,
# and the log agent's secret is generated the first time it is needed. Never commit a real one.
webhook_secret=${WEBHOOK_SECRET:}
logs_agent_secret=${ALFRED_LOGS_AGENT_SECRET:}
