# Alfred deployment settings.
#
# key=value lines only - blank lines and lines starting with # are ignored. Read once by
# start.py/restart.py before "docker compose up" and baked into .env
# (COMPOSE_PROFILES/INBOUND_LOGGING_ENABLED), so every setting here is a DEPLOY-TIME flag:
# editing this file has no effect until you re-run start.py or restart.py - it is not picked up
# live.

# Whether the inbound (frontend -> WildFly) reverse-proxy logging feature is enabled at all for
# this deployment.
#
# false (default): wildfly-proxy is never started, and the "Inbound logging" panel is hidden
#   from Settings entirely - there would be nothing for it to control. This is the safe default
#   for a deployment with no WildFly server to log at all.
# true: wildfly-proxy is started along with everything else, and Settings shows an
#   "Inbound logging" panel with a live on/off switch (see toggle-wildfly-reverse-proxy.sh/.bat
#   for the equivalent from a terminal).
inbound_logging_enabled=false

# WildFly's install directory (the folder containing bin/standalone.conf(.bat)) - needed only
# when inbound_logging_enabled=true, to automatically add/remove
# -Djboss.socket.binding.port-offset=1 from WildFly's own JAVA_OPTS in bin/standalone.conf(.bat)
# (whichever matches this OS). That offset is required so wildfly-proxy can own WildFly's usual
# HTTP port (see docker-compose.yml's wildfly-proxy service) - WildFly then answers one port
# higher (e.g. 8080 -> 8081) instead.
#
# Leave blank to fall back to the WILDFLY_HOME environment variable. If neither is set, this step
# is skipped with a warning - you'd need to add/remove that VM option yourself. Restart WildFly
# after enabling/disabling for the change to take effect either way.
wildfly_home=

