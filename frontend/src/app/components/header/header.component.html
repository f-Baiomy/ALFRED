<header #headerEl>
  <div>
    <div class="brand">
      <span class="dot"></span>
      <h1>{{ title() }}</h1>
    </div>
    <div class="sub">{{ subtitle() }}</div>
  </div>

  <div class="controls">
    <input
      type="text"
      placeholder="Search URL, status, headers, body..."
      [value]="state.searchQuery()"
      (input)="onSearchInput($any($event.target).value)"
    />

    <app-select-picker [options]="limitOptions" [value]="state.limit().toString()" (valueChange)="onLimitChange($event)" />

    <app-select-picker [options]="sortOptions" [value]="state.sortMode()" (valueChange)="onSortChange($event)" />

    <app-select-picker [options]="supplierOptions()" [value]="state.supplierFilter()" (valueChange)="onSupplierChange($event)" />

    <button type="button" [class.active]="state.groupBySupplier()" (click)="toggleGroupBySupplier()">
      {{ state.groupBySupplier() ? 'Ungroup' : 'Group by supplier' }}
    </button>

    <button type="button" (click)="toggleExpanded()">
      {{ state.expanded() ? 'Collapse all' : 'Expand all' }}
    </button>

    <button type="button" (click)="refreshNow()">Refresh</button>
  </div>
</header>
