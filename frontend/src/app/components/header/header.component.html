<header>
  <div>
    <div class="brand">
      <span class="dot"></span>
      <h1>{{ title() }}</h1>
    </div>
    <div class="sub">{{ subtitle() }}</div>
  </div>

  <div class="controls">
    <input
      type="text"
      placeholder="Search URL, status, headers, body..."
      [value]="state.searchQuery()"
      (input)="onSearchInput($any($event.target).value)"
    />

    <select [value]="state.limit()" (change)="onLimitChange($any($event.target).value)">
      <option value="20">Last 20</option>
      <option value="50">Last 50</option>
      <option value="100">Last 100</option>
      <option value="200">Last 200</option>
    </select>

    <select [value]="state.sortMode()" (change)="onSortChange($any($event.target).value)">
      <option value="newest">Newest first</option>
      <option value="oldest">Oldest first</option>
      <option value="slowest">Slowest first</option>
      <option value="fastest">Fastest first</option>
      <option value="status">Status (worst first)</option>
    </select>

    <select [value]="state.supplierFilter()" (change)="onSupplierChange($any($event.target).value)">
      <option value="">All suppliers ({{ state.calls().length }})</option>
      @for (supplier of state.supplierOptions(); track supplier.name) {
        <option [value]="supplier.name">{{ supplier.name }} ({{ supplier.count }})</option>
      }
    </select>

    <button type="button" [class.active]="state.groupBySupplier()" (click)="toggleGroupBySupplier()">
      {{ state.groupBySupplier() ? 'Ungroup' : 'Group by supplier' }}
    </button>

    <button type="button" (click)="toggleExpanded()">
      {{ state.expanded() ? 'Collapse all' : 'Expand all' }}
    </button>

    <button type="button" (click)="refreshNow()">Refresh</button>
  </div>
</header>
