<header #headerEl>
  <div>
    <div class="brand">
      <span class="logo-badge" aria-hidden="true">
        <svg viewBox="0 0 48 48">
          <path d="M4 12 L24 24 L4 36 C7 30 7 18 4 12 Z M44 12 L24 24 L44 36 C41 30 41 18 44 12 Z" />
          <rect x="19" y="19" width="10" height="10" rx="2" />
        </svg>
      </span>
      <span class="dot"></span>
      <h1>{{ title() }}</h1>
    </div>
    <div class="sub">{{ subtitle() }}</div>
  </div>

  <div class="controls">
    <input
      type="text"
      placeholder="Search URL, status, headers, body..."
      [value]="state.searchQuery()"
      (input)="onSearchInput($any($event.target).value)"
    />

    <app-select-picker [options]="limitOptions" [value]="state.limit().toString()" (valueChange)="onLimitChange($event)" />

    <app-select-picker [options]="sortOptions()" [value]="state.sortMode()" (valueChange)="onSortChange($event)" />

    <app-select-picker [options]="supplierOptions()" [value]="state.supplierFilter()" (valueChange)="onSupplierChange($event)" />

    <button type="button" [class.active]="state.groupBySupplier()" (click)="toggleGroupBySupplier()">
      {{ state.groupBySupplier() ? 'Ungroup' : 'Group by supplier' }}
    </button>

    <button type="button" (click)="toggleExpanded()">
      {{ state.expanded() ? 'Collapse all' : 'Expand all' }}
    </button>

    <button type="button" (click)="refreshNow()">Refresh</button>
  </div>

  <div class="id-filters">
    <label class="id-filter">
      <span class="id-filter-label">Session ID</span>
      <input
        type="text"
        placeholder="filter by session id..."
        [value]="state.sessionIdFilter()"
        (input)="onSessionIdInput($any($event.target).value)"
      />
    </label>
    <label class="id-filter">
      <span class="id-filter-label">Operation ID</span>
      <input
        type="text"
        placeholder="filter by operation id..."
        [value]="state.operationIdFilter()"
        (input)="onOperationIdInput($any($event.target).value)"
      />
    </label>
    <label class="id-filter">
      <span class="id-filter-label">Request ID</span>
      <input
        type="text"
        placeholder="filter by request id..."
        [value]="state.requestIdFilter()"
        (input)="onRequestIdInput($any($event.target).value)"
      />
    </label>
  </div>
</header>
