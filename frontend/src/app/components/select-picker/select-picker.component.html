<div class="assigned-to-filter select-picker">
  <button type="button" class="theme-picker-btn" (click)="togglePanel()">
    {{ currentLabel() }}
  </button>

  @if (panelOpen()) {
    <div
      class="theme-picker-panel select-picker-panel"
      [style.top.px]="panelPosition().top"
      [style.left.px]="panelPosition().left"
    >
      <div class="filter-option-list">
        @for (option of options(); track option.value) {
          <button
            type="button"
            class="filter-option-item"
            [class.active]="option.value === value()"
            (click)="select(option.value)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </div>
  }
</div>
