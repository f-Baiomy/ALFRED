@if (state(); as current) {
  <div class="dialog-backdrop" (click)="close()">
    <div class="dialog-card" (click)="$event.stopPropagation()">
      <h2>Export call as Markdown</h2>
      <p class="dialog-sub">Pre-filled where possible - review and edit before exporting. Nothing here is required.</p>

      <label class="dialog-field">
        <span>Supplier Name</span>
        <input type="text" [value]="supplierName()" (input)="supplierName.set($any($event.target).value)" placeholder="e.g. FlyNas" />
      </label>

      <label class="dialog-field">
        <span>Supplier Credentials Used</span>
        <input type="text" [value]="credentialsUsed()" (input)="credentialsUsed.set($any($event.target).value)" placeholder="e.g. EGY" />
      </label>

      <fieldset class="dialog-radio-group">
        <legend>Environment</legend>
        <label>
          <input type="radio" name="environment" [checked]="environment() === 'Staging'" (change)="setEnvironment('Staging')" />
          Staging
        </label>
        <label>
          <input type="radio" name="environment" [checked]="environment() === 'Production'" (change)="setEnvironment('Production')" />
          Production
        </label>
      </fieldset>

      <label class="dialog-field">
        <span>URL</span>
        <input type="text" [value]="url()" (input)="url.set($any($event.target).value)" placeholder="https://..." />
      </label>

      <label class="dialog-field">
        <span>API Key</span>
        <input type="text" [value]="apiKey()" (input)="apiKey.set($any($event.target).value)" placeholder="e.g. ttdb2dc2-..." />
      </label>

      <label class="dialog-field">
        <span>Description <em>(optional)</em></span>
        <textarea rows="3" [value]="description()" (input)="description.set($any($event.target).value)" placeholder="Any context worth noting..."></textarea>
      </label>

      <div class="dialog-actions">
        <button type="button" class="dialog-btn secondary" (click)="close()">Cancel</button>
        <button type="button" class="dialog-btn primary" (click)="confirmExport()">Export .md</button>
      </div>
    </div>
  </div>
}
