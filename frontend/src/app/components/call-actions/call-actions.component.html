<div class="call-actions">
  <app-pick-call [call]="call()" />
  <app-call-board-badge [badges]="boardBadges()" />
  <button type="button" class="action-btn" title="Add an Inbox card linked to this call to the board" [disabled]="boardLoading()"
          (click)="addToBoard()">{{ boardLoading() ? 'Adding…' : '＋ Board' }}</button>
  <!-- Resent often enough, and from far more places, to earn a button of its own rather than a
       menu item nobody opens: every card gets one through CallActionsComponent, so a new list built
       from `app-call-card` needs nothing extra (same deal as PickCallButtonComponent). Still listed
       under Export too, for anyone already reaching for it there. -->
  <button
    type="button"
    class="action-btn"
    title="Resend this call through Alfred - edit it first, or send it exactly as it was logged"
    [disabled]="resendLoading()"
    (click)="openResend()"
  >{{ resendLoading() ? 'Loading…' : 'Resend…' }}</button>
  <button
    type="button"
    class="action-btn pin-btn"
    [class.active]="isPinned()"
    [title]="isPinned() ? 'Unpin this call' : 'Pin this call'"
    (click)="togglePin()"
  >{{ isPinned() ? '★ Pinned' : '☆ Pin' }}</button>
  <app-action-menu label="Export">
    <button type="button" class="filter-option-item" title="Copy as cURL" [disabled]="curlLoading()" (click)="copyAsCurl()">
      {{ curlCopyFeedback() ? 'Copied!' : curlLoading() ? 'Loading...' : 'Copy as cURL' }}
    </button>
    <button type="button" class="filter-option-item" title="Download raw call as JSON" [disabled]="downloadLoading()" (click)="downloadAsJson()">
      {{ downloadLoading() ? 'Loading...' : 'Download as JSON' }}
    </button>
    <button type="button" class="filter-option-item" title="Export as Markdown or HTML" [disabled]="exportLoading()" (click)="openExportReport()">
      {{ exportLoading() ? 'Loading...' : 'Export report...' }}
    </button>
    <button type="button" class="filter-option-item" title="Resend this call through Alfred" [disabled]="resendLoading()" (click)="openResend()">
      {{ resendLoading() ? 'Loading...' : 'Resend…' }}
    </button>
    @if (canAnswerWith()) {
      <button type="button" class="filter-option-item" title="Start an interception rule that answers matching calls with this call's response" (click)="useAsAnswer()">
        Use as answer in a new rule…
      </button>
    }
  </app-action-menu>
  <app-action-menu label="Relive ▾">
    <button type="button" class="filter-option-item" [disabled]="reliveLoading()" (click)="reliveAddToCycle()">Add to cycle…</button>
    <button type="button" class="filter-option-item" [disabled]="reliveLoading()" (click)="reliveNewCycle()">New cycle from selection</button>
    <button type="button" class="filter-option-item" [disabled]="reliveLoading()" (click)="reliveNow()">⚡ Relive now</button>
    <button type="button" class="filter-option-item" [disabled]="reliveLoading()" (click)="reliveReplaceSteps()">Replace steps of cycle…</button>
  </app-action-menu>
</div>
@if (reliveError()) { <div class="rl-ext-banner" role="alert">{{ reliveError() }}</div> }
