<div class="stats">
  <button type="button" class="stat-pill" [class.active]="controlsState.statusFilter() === 'all'" title="Show all calls" (click)="showFilter('all')"><b>{{ stats().total }}</b> calls</button>
  @if (stats().inProgress > 0) {
    <button type="button" class="stat-pill pending" [class.active]="controlsState.statusFilter() === 'inProgress'" title="Show in-progress calls" (click)="showFilter('inProgress')"><b>{{ stats().inProgress }}</b> in progress</button>
  }
  <button type="button" class="stat-pill ok" [class.active]="controlsState.statusFilter() === 'ok'" title="Show 2xx/3xx calls" (click)="showFilter('ok')"><b>{{ stats().ok }}</b> 2xx/3xx</button>
  <button type="button" class="stat-pill warn" [class.active]="controlsState.statusFilter() === 'client'" title="Show 4xx calls" (click)="showFilter('client')"><b>{{ stats().client }}</b> 4xx</button>
  <button type="button" class="stat-pill err" [class.active]="controlsState.statusFilter() === 'failed'" title="Show error/5xx calls" (click)="showFilter('failed')"><b>{{ stats().failed }}</b> errors/5xx</button>
</div>
