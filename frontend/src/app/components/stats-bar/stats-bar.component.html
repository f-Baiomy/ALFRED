<div class="stats">
  <span class="stat-pill"><b>{{ stats().total }}</b> calls</span>
  <span class="stat-pill ok"><b>{{ stats().ok }}</b> 2xx/3xx</span>
  <span class="stat-pill warn"><b>{{ stats().client }}</b> 4xx</span>
  <span class="stat-pill err"><b>{{ stats().failed }}</b> errors/5xx</span>
</div>
