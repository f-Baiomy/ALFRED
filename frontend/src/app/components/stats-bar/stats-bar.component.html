<div class="stats">
  <button type="button" class="stat-pill" [class.active]="controlsState.statusFilter() === 'all'" title="Show all calls" (click)="showFilter('all')"><b>{{ stats().total }}</b> calls</button>
  @if (stats().inProgress > 0) {
    <button type="button" class="stat-pill pending" [class.active]="controlsState.statusFilter() === 'inProgress'" title="Show in-progress calls" (click)="showFilter('inProgress')"><b>{{ stats().inProgress }}</b> in progress</button>
  }
  <button type="button" class="stat-pill ok" [class.active]="controlsState.statusFilter() === 'ok'" title="Show 2xx/3xx calls" (click)="showFilter('ok')"><b>{{ stats().ok }}</b> 2xx/3xx</button>
  <button type="button" class="stat-pill warn" [class.active]="controlsState.statusFilter() === 'client'" title="Show 4xx calls" (click)="showFilter('client')"><b>{{ stats().client }}</b> 4xx</button>
  <button type="button" class="stat-pill err" [class.active]="controlsState.statusFilter() === 'failed'" title="Show error/5xx calls" (click)="showFilter('failed')"><b>{{ stats().failed }}</b> errors/5xx</button>
  @if (stats().intercepted > 0 || stats().resent > 0 || stats().dbFailures > 0) {
    <span class="stat-pill-sep" aria-hidden="true"></span>
  }
  @if (stats().intercepted > 0) {
    <button
      type="button"
      class="stat-pill intercepted"
      [class.active]="isInterceptedActive()"
      title="Show calls an interception rule touched - combines with the status pill above"
      (click)="toggleIntercepted()"
    ><b>{{ stats().intercepted }}</b> &#9889; intercepted</button>
  }
  @if (stats().resent > 0) {
    <button
      type="button"
      class="stat-pill resent"
      [class.active]="controlsState.resendFilter() === 'resent'"
      title="Show calls that are themselves a resend - combines with the status pill above"
      (click)="toggleResent()"
    ><b>{{ stats().resent }}</b> &#8635; resent</button>
  }
  @if (stats().dbFailures > 0) {
    <button
      type="button"
      class="stat-pill db-failed"
      [class.active]="controlsState.dbFailureFilter()"
      title="Show calls that ran a failed database statement - a 200 that swallowed one included; combines with the status pill above"
      (click)="toggleDbFailures()"
    ><b>{{ stats().dbFailures }}</b> &#10006; DB failures</button>
  }
</div>
