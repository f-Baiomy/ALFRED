<div class="bulk-actions-bar below-sticky-header" [class.active]="state.selectedCalls().length > 0">
  @if (state.selectedCalls().length > 0) {
    <span class="bulk-count"><b>{{ state.selectedCalls().length }}</b> selected</span>
  } @else {
    <span class="bulk-count muted">No calls selected</span>
  }

  <div class="bulk-actions">
    <button type="button" class="bulk-btn secondary" (click)="selectAll()">Select all</button>

    @if (state.selectedCalls().length > 0) {
      <button type="button" class="bulk-btn secondary" (click)="clearSelection()">Deselect all</button>
      <button type="button" class="bulk-btn" (click)="duplicateToCycles()">Duplicate to cycles</button>
      <button type="button" class="bulk-btn" [disabled]="mdLoading()" (click)="exportAsMarkdown()">
        {{ mdLoading() ? 'Loading...' : 'Export .md' }}
      </button>
      <button type="button" class="bulk-btn" [disabled]="jsonLoading()" (click)="exportAsJson()">
        {{ jsonLoading() ? 'Loading...' : 'Export .json' }}
      </button>
      <button type="button" class="bulk-btn" [disabled]="htmlLoading()" (click)="exportAsHtml()">
        {{ htmlLoading() ? 'Loading...' : 'Export .html' }}
      </button>
      <button type="button" class="bulk-btn" [disabled]="curlLoading()" (click)="exportAsCurl()">
        {{ curlLoading() ? 'Loading...' : 'Export cURL' }}
      </button>
    }
  </div>
</div>
