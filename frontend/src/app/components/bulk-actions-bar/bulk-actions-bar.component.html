<div class="bulk-actions-bar below-sticky-header" [class.active]="state.selectedCalls().length > 0">
  @if (state.selectedCalls().length > 0) {
    <span class="bulk-count"><b>{{ state.selectedCalls().length }}</b> selected</span>
  } @else {
    <span class="bulk-count muted">No calls selected</span>
  }

  <div class="bulk-actions">
    <button type="button" class="bulk-btn secondary" (click)="selectAll()">Select all</button>

    @if (state.selectedCalls().length > 0) {
      <button type="button" class="bulk-btn secondary" (click)="clearSelection()">Deselect all</button>
      <button type="button" class="bulk-btn" [disabled]="duplicateLoading()" (click)="duplicateToCycles()">
        {{ duplicateLoading() ? 'Loading...' : 'Duplicate to cycles' }}
      </button>
      @if (removalState) {
        <button type="button" class="bulk-btn danger" (click)="removeSelected()">Remove selected</button>
      }
      <app-action-menu label="Export">
        <button type="button" class="filter-option-item" [disabled]="mdLoading()" (click)="exportReport()">
          {{ mdLoading() ? 'Loading...' : 'Export report...' }}
        </button>
        <button type="button" class="filter-option-item" [disabled]="jsonLoading()" (click)="exportAsJson()">
          {{ jsonLoading() ? 'Loading...' : 'Export as JSON' }}
        </button>
        <button type="button" class="filter-option-item" [disabled]="curlLoading()" (click)="exportAsCurl()">
          {{ curlLoading() ? 'Loading...' : 'Export as cURL' }}
        </button>
      </app-action-menu>
    }
  </div>
</div>
