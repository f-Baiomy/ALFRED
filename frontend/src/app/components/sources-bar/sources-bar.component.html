<div class="sources-bar">
  <span class="sources-label">Sources</span>

  <button
    type="button"
    class="source-pill"
    [class.active]="isSelected(externalKey)"
    (click)="toggleSource.emit(externalKey)"
  >
    External
  </button>

  @for (service of internalServices(); track service.name) {
    <span class="source-pill-group" [class.active]="isSelected(service.name)">
      <button type="button" class="source-pill-main" (click)="toggleSource.emit(service.name)">
        {{ service.name }}
      </button>
      <button
        type="button"
        class="source-pill-switch"
        [class.on]="service.enabled"
        [title]="service.enabled ? 'Logging is on - click to turn off' : 'Logging is off - click to turn on'"
        (click)="onToggleLogging(service.name, service.enabled, $event)"
      >
        <span class="switch-dot"></span>
      </button>
      @if (service.name !== 'unknown') {
        <button
          type="button"
          class="source-pill-switch db-sw"
          [class.on]="db.isOn(service.name, service.enabled)"
          [class.blocked]="!service.enabled"
          [title]="db.switchTitle(service.name, service.enabled)"
          (click)="db.toggle(service.name, service.enabled); $event.stopPropagation()"
        >
          <span class="db-glyph">◆</span>
        </button>
        <button
          #more
          type="button"
          class="source-pill-switch db-more"
          [title]="'Database capture settings for ' + service.name"
          [attr.aria-expanded]="popoverFor() === service.name"
          (click)="togglePopover(service.name, more); $event.stopPropagation()"
        >▾</button>
      }
    </span>
  }

  @if (popoverFor(); as project) {
    @defer {
      <app-db-capture-popover [project]="project" [inboundOn]="inboundOn(project)" [anchor]="popoverAnchor()" (closed)="popoverFor.set(null)" />
    }
  }
  @if (db.switchError(); as err) {
    <span class="db-switch-err" (click)="db.switchError.set(null)" title="Dismiss">{{ err }}</span>
  }

  <span class="sources-spacer"></span>

  @if (featureEnabled()) {
    <button type="button" class="sources-reset" (click)="selectAll()">Reset</button>
  }
</div>
