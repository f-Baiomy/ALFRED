<nav class="tab-nav">
  <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Live Calls</a>
  <a routerLink="/cycles" routerLinkActive="active">Session Cycles</a>
  <a routerLink="/board" routerLinkActive="active">Board <span class="nav-new">new</span></a>
  <a routerLink="/profiles" routerLinkActive="active">Profiles</a>
  <a routerLink="/interception" routerLinkActive="active">
    Interception
    <!-- A paused call is a client socket held open right now, so its count has to be visible from
         every tab, not only from the page that can act on it. -->
    @if (interception.pausedCount() > 0) {
      <span class="tab-badge urgent">{{ interception.pausedCount() }} paused</span>
    } @else if (interception.active()) {
      <span class="tab-badge">on</span>
    }
  </a>
  <a routerLink="/relive" routerLinkActive="active">Relive <span class="nav-new">new</span></a>
  <a routerLink="/logs" routerLinkActive="active">Logs <span class="nav-new">new</span></a>
  <a routerLink="/settings" routerLinkActive="active">Settings</a>
  <app-theme-picker />
</nav>

<router-outlet />

<!-- Both follow the user across tabs: picking is done by moving between pages, and a resend can
     be started from a call on any page (Live Calls or a session cycle). -->
<app-pick-bar />
<!-- One spec viewer for the whole app: a spec chip on any page opens it (specs/014-task-board). -->
<app-spec-viewer />
<app-mention-call-popup />
<!-- Loaded once the page is idle, outside the initial bundle (each holds its state in a service, so
     one asked for before it has loaded opens as soon as it has). -->
@defer (on idle) {
  <app-resend-dialog />
  <app-bulk-resend-dialog>
    <app-scenario-toolbar br-scenario-toolbar />
  </app-bulk-resend-dialog>
  <!-- "⚡+ Rule" on a call card: the rule editor as a popup, on whatever page the call is. -->
  <app-rule-dialog />
  <!-- The two right-edge tabs: the cycle widget's, stacked above the global variables one. -->
  <app-cycle-widget-launch />
  <app-global-variables />
  <app-relive-fingerprint-screen />
}
