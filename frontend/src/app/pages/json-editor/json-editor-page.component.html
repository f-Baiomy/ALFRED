@if (sessionExpired()) {
  <div class="editor-expired">
    <h1>This editing session has expired</h1>
    <p>Go back to the dashboard tab and click "Edit in new tab" again.</p>
  </div>
} @else {
  <div class="editor-page">
    <header class="editor-header">
      <div class="editor-header-title">
        <span class="dot"></span>
        <h1>Editing {{ label() }}</h1>
      </div>
      <div class="editor-header-actions">
        @if (isValidJson()) {
          <span class="editor-status ok">&check; Synced to original tab</span>
        } @else {
          <span class="editor-status warn">&#9888; Invalid JSON - not synced until fixed</span>
        }
        <button type="button" class="dialog-btn secondary" (click)="closeTab()">Close tab</button>
      </div>
    </header>
    <div class="editor-host" #editorHost></div>
  </div>
}
