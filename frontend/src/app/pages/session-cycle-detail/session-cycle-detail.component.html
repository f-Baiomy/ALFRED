<div class="cycle-detail-toolbar">
  <a routerLink="/cycles" class="btn-back">&larr; Back to Session Cycles</a>
  @if (cycle(); as c) {
    <div class="cycle-row-actions">
      <span class="badge" [class]="c.status === 'RECORDING' ? 'cycle-status-recording' : 'cycle-status-paused'">
        {{ c.status === 'RECORDING' ? 'Recording' : 'Paused' }}
      </span>
      <button type="button" class="action-btn" (click)="toggleRecording()">
        {{ c.status === 'RECORDING' ? 'Pause' : 'Record' }}
      </button>
      <button type="button" class="action-btn" (click)="edit()">Edit</button>
      <button type="button" class="action-btn" (click)="openImportDialog()">Import calls</button>
      <app-action-menu [label]="cycleExport.exportingCycleId() === c.id ? 'Exporting…' : 'Export cycle'">
        <button
          type="button"
          class="filter-option-item"
          [disabled]="cycleExport.exportingCycleId() !== null"
          (click)="exportCycle('markdown')"
        >
          Export cycle as report...
        </button>
        <button
          type="button"
          class="filter-option-item"
          [disabled]="cycleExport.exportingCycleId() !== null"
          (click)="exportCycle('json')"
        >
          Export cycle as JSON
        </button>
      </app-action-menu>
      @if (cycleExport.progress(); as progress) {
        <span class="muted">{{ progress }}</span>
      }
      <button type="button" class="action-btn danger" [disabled]="clearingCalls()" (click)="clearAllCalls()">
        {{ clearingCalls() ? 'Clearing…' : 'Clear all calls' }}
      </button>
    </div>
  }
</div>

@if (cycleExport.message(); as message) {
  <div class="bulk-action-message">{{ message }}</div>
}

<app-header
  [title]="cycle()?.name ?? 'Session Cycle'"
  subtitle="Captured calls for this session cycle"
  [selectedSources]="state.selectedSources()"
  [internalServices]="state.internalServices()"
  [inboundLoggingFeatureEnabled]="state.inboundLoggingFeatureEnabled()"
  (toggleSource)="state.toggleSource($event)"
  (toggleServiceLogging)="state.toggleServiceLogging($event.name, $event.enabled)"
/>

<main>
  <app-bulk-actions-bar />
  <app-stats-bar [stats]="state.stats()" />
  <div class="call-list">
    <app-call-list [infiniteScroll]="false" />
  </div>
</main>

<app-export-dialog />
<app-copy-to-cycles-dialog />
<app-import-calls-dialog />
<app-edit-cycle-dialog />
<app-confirm-dialog />
