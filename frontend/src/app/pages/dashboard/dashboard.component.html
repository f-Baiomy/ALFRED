<app-header
  [selectedSources]="state.selectedSources()"
  [internalServices]="state.internalServices()"
  [inboundLoggingFeatureEnabled]="state.inboundLoggingFeatureEnabled()"
  (toggleSource)="state.toggleSource($event)"
  (toggleServiceLogging)="state.toggleServiceLogging($event.name, $event.enabled)"
/>

<main>
  <app-bulk-actions-bar />
  <app-stats-bar [stats]="state.stats()" />
  <div class="call-list">
    <app-call-list />
  </div>
</main>

<app-copy-to-cycles-dialog />
<!-- Loaded once the page is idle, outside the initial bundle; their state lives in services, so one
     asked for before it has loaded opens as soon as it has. -->
@defer (on idle) {
  <app-export-dialog />
  <app-relive-selection-dialog />
}
