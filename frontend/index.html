<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manor - Alfred Dashboard</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div>
      <div class="brand">
        <span class="dot"></span>
        <h1>Manor</h1>
      </div>
      <div class="sub">Live feed of every call Alfred intercepted, via pennyworth</div>
    </div>
    <div class="controls">
      <input id="search" type="text" placeholder="Search URL, status, headers, body..." />
      <select id="limit">
        <option value="20">Last 20</option>
        <option value="50" selected>Last 50</option>
        <option value="100">Last 100</option>
        <option value="200">Last 200</option>
      </select>
      <select id="sort">
        <option value="newest" selected>Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="slowest">Slowest first</option>
        <option value="fastest">Fastest first</option>
        <option value="status">Status (worst first)</option>
      </select>
      <button id="toggleAllBtn">Collapse all</button>
      <button id="refreshBtn">Refresh</button>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>
    <div id="calls"><div class="loading">Loading…</div></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
