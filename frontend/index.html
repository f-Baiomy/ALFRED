<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Manor - Alfred Dashboard</title>
<style>
  :root {
    --bg: #0a0e2a;
    --bg-2: #0f1438;
    --card: #141a45;
    --card-2: #10154038;
    --border: rgba(139, 92, 246, 0.22);
    --border-strong: rgba(139, 92, 246, 0.45);
    --purple: #8b5cf6;
    --purple-light: #c4b5fd;
    --blue: #3b82f6;
    --cyan: #22d3ee;
    --text: #e5e9f5;
    --text-dim: #93a0c2;
    --text-faint: #5c6690;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;

    --json-key: #c4b5fd;
    --json-string: #6ee7d8;
    --json-number: #fb923c;
    --json-bool: #f472b6;
    --json-null: #6b7394;
    --json-punct: #5c6690;
  }

  * { box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 0;
    background: radial-gradient(ellipse at top, #131a4a 0%, var(--bg) 55%);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: linear-gradient(120deg, #1a1247 0%, #0f1438 60%, #1a1247 100%);
    border-bottom: 1px solid var(--border-strong);
    padding: 1.1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    box-shadow: 0 4px 24px rgba(80, 40, 180, 0.25);
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 0.65rem;
  }

  .brand .dot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--purple);
    box-shadow: 0 0 0 0 rgba(139,92,246, 0.7);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(139,92,246, 0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(139,92,246, 0); }
    100% { box-shadow: 0 0 0 0 rgba(139,92,246, 0); }
  }

  h1 {
    font-weight: 700;
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: 0.02em;
    background: linear-gradient(90deg, var(--purple-light), var(--cyan));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .sub {
    color: var(--text-dim);
    font-size: 0.8rem;
    margin-top: 0.15rem;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
  }

  input#search {
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 0.55rem 0.9rem;
    border-radius: 8px;
    font-size: 0.85rem;
    min-width: 240px;
    outline: none;
    transition: border-color 0.15s;
  }
  input#search:focus { border-color: var(--purple); }
  input#search::placeholder { color: var(--text-faint); }

  select#limit, button#refreshBtn, button#toggleAllBtn {
    background: var(--bg-2);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 0.55rem 0.8rem;
    border-radius: 8px;
    font-size: 0.85rem;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  select#limit:hover, button#refreshBtn:hover, button#toggleAllBtn:hover {
    border-color: var(--purple);
    color: var(--text);
  }

  main {
    padding: 1.5rem 2rem 3rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .stats {
    display: flex;
    gap: 0.75rem;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }

  .stat-pill {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 0.4rem 0.95rem;
    font-size: 0.78rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .stat-pill b { color: var(--text); }
  .stat-pill.ok b { color: var(--green); }
  .stat-pill.warn b { color: var(--amber); }
  .stat-pill.err b { color: var(--red); }

  #calls { display: flex; flex-direction: column; gap: 1rem; }

  .empty, .loading, .error-box {
    color: var(--text-dim);
    text-align: center;
    padding: 3rem 1rem;
    border: 1px dashed var(--border);
    border-radius: 12px;
    background: var(--card);
  }
  .error-box { color: var(--red); border-color: rgba(248,113,113,0.35); }

  .call {
    background: linear-gradient(160deg, var(--card) 0%, #101636 100%);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem 1.15rem;
    transition: border-color 0.15s, transform 0.1s;
  }
  .call:hover { border-color: var(--border-strong); }

  .call-top {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex-wrap: wrap;
    margin-bottom: 0.5rem;
  }

  .badge {
    font-size: 0.72rem;
    font-weight: 700;
    padding: 0.22rem 0.6rem;
    border-radius: 6px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .method-GET    { background: rgba(34,211,238,0.15); color: var(--cyan); border: 1px solid rgba(34,211,238,0.35); }
  .method-POST   { background: rgba(139,92,246,0.18); color: var(--purple-light); border: 1px solid rgba(139,92,246,0.4); }
  .method-PUT    { background: rgba(59,130,246,0.15); color: #93c5fd; border: 1px solid rgba(59,130,246,0.35); }
  .method-PATCH  { background: rgba(251,146,60,0.15); color: #fdba74; border: 1px solid rgba(251,146,60,0.35); }
  .method-DELETE { background: rgba(248,113,113,0.15); color: #fca5a5; border: 1px solid rgba(248,113,113,0.35); }
  .method-DEFAULT{ background: rgba(148,163,194,0.15); color: var(--text-dim); border: 1px solid var(--border); }

  .status-2xx { background: rgba(52,211,153,0.15); color: var(--green); border: 1px solid rgba(52,211,153,0.35); }
  .status-3xx { background: rgba(96,165,250,0.15); color: #93c5fd; border: 1px solid rgba(96,165,250,0.35); }
  .status-4xx { background: rgba(251,191,36,0.15); color: var(--amber); border: 1px solid rgba(251,191,36,0.35); }
  .status-5xx { background: rgba(248,113,113,0.15); color: var(--red); border: 1px solid rgba(248,113,113,0.35); }
  .status-err { background: rgba(248,113,113,0.22); color: var(--red); border: 1px solid rgba(248,113,113,0.5); }

  .duration {
    font-size: 0.72rem;
    padding: 0.22rem 0.55rem;
    border-radius: 6px;
    font-weight: 600;
    background: rgba(148,163,194,0.1);
    color: var(--text-dim);
  }
  .duration.fast { color: var(--green); }
  .duration.mid  { color: var(--amber); }
  .duration.slow { color: var(--red); }

  .call-time {
    color: var(--text-faint);
    font-size: 0.75rem;
    margin-left: auto;
    white-space: nowrap;
  }

  .call-urls {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
    margin: 0.15rem 0 0.65rem;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 0.82rem;
  }

  .call-urls .uri-row {
    display: flex;
    align-items: baseline;
    gap: 0.5rem;
    word-break: break-all;
  }

  .call-urls .uri-label {
    flex: 0 0 auto;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 0.1rem 0.45rem;
    border-radius: 5px;
    white-space: nowrap;
  }

  .call-urls .uri-label.from { color: var(--purple-light); background: rgba(139,92,246,0.12); border: 1px solid rgba(139,92,246,0.3); }
  .call-urls .uri-label.to   { color: var(--cyan); background: rgba(34,211,238,0.1); border: 1px solid rgba(34,211,238,0.28); }

  .call-urls .uri-value.from { color: var(--text-dim); }
  .call-urls .uri-value.to   { color: var(--cyan); }

  .error-banner {
    background: rgba(248,113,113,0.1);
    border: 1px solid rgba(248,113,113,0.35);
    color: #fca5a5;
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    font-size: 0.82rem;
    margin-bottom: 0.5rem;
  }

  .panels {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.85rem;
    margin-top: 0.35rem;
  }
  @media (max-width: 880px) {
    .panels { grid-template-columns: 1fr; }
  }

  .panel {
    background: rgba(10, 14, 42, 0.55);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .panel-title {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--purple-light);
    padding: 0.55rem 0.75rem;
    background: rgba(139,92,246,0.08);
    border-bottom: 1px solid var(--border);
  }

  details.block {
    border-bottom: 1px solid var(--border);
  }
  details.block:last-child { border-bottom: none; }

  details.block summary {
    cursor: pointer;
    list-style: none;
    padding: 0.5rem 0.75rem;
    font-size: 0.78rem;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 0.4rem;
    user-select: none;
  }
  details.block summary::-webkit-details-marker { display: none; }
  details.block summary::before {
    content: '▸';
    color: var(--purple);
    transition: transform 0.15s;
    display: inline-block;
  }
  details.block[open] summary::before { transform: rotate(90deg); }
  details.block summary:hover { color: var(--text); }

  .json-wrap {
    position: relative;
    margin: 0 0.75rem 0.75rem;
  }

  pre.json {
    margin: 0;
    padding: 0.75rem;
    background: #070a24;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 0.78rem;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre;
    color: var(--text);
    max-height: 380px;
  }

  pre.plain {
    margin: 0;
    padding: 0.75rem;
    background: #070a24;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: 'Cascadia Code', 'Fira Code', Consolas, monospace;
    font-size: 0.78rem;
    line-height: 1.5;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text-dim);
    max-height: 380px;
  }

  .copy-btn {
    position: absolute;
    top: 0.4rem;
    right: 0.9rem;
    background: rgba(139,92,246,0.18);
    border: 1px solid var(--border-strong);
    color: var(--purple-light);
    font-size: 0.68rem;
    padding: 0.18rem 0.5rem;
    border-radius: 5px;
    cursor: pointer;
    opacity: 0.8;
  }
  .copy-btn:hover { opacity: 1; background: rgba(139,92,246,0.3); }

  .k { color: var(--json-key); }
  .s { color: var(--json-string); }
  .n { color: var(--json-number); }
  .b { color: var(--json-bool); font-weight: 600; }
  .z { color: var(--json-null); font-style: italic; }

  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
</style>
</head>
<body>
  <header>
    <div>
      <div class="brand">
        <span class="dot"></span>
        <h1>Manor</h1>
      </div>
      <div class="sub">Live feed of every call Alfred intercepted, via pennyworth</div>
    </div>
    <div class="controls">
      <input id="search" type="text" placeholder="Filter by URL, method, status..." />
      <select id="limit">
        <option value="20">Last 20</option>
        <option value="50" selected>Last 50</option>
        <option value="100">Last 100</option>
        <option value="200">Last 200</option>
      </select>
      <button id="toggleAllBtn">Expand all</button>
      <button id="refreshBtn">Refresh</button>
    </div>
  </header>

  <main>
    <div class="stats" id="stats"></div>
    <div id="calls"><div class="loading">Loading…</div></div>
  </main>

  <script>
    const BACKEND_URL = window.BACKEND_URL || "http://localhost:5000";

    let allCalls = [];
    let expanded = false;

    const el = (sel) => document.querySelector(sel);
    const escapeHtml = (str) =>
      String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

    function syntaxHighlight(value) {
      const json = escapeHtml(JSON.stringify(value, null, 2));
      return json.replace(
        /("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g,
        (match) => {
          let cls = "n";
          if (/^"/.test(match)) {
            cls = /:$/.test(match) ? "k" : "s";
          } else if (/true|false/.test(match)) {
            cls = "b";
          } else if (/null/.test(match)) {
            cls = "z";
          }
          return `<span class="${cls}">${match}</span>`;
        }
      );
    }

    function tryParseJson(text) {
      if (typeof text !== "string") return { ok: false };
      const trimmed = text.trim();
      if (!trimmed) return { ok: false };
      try {
        return { ok: true, value: JSON.parse(trimmed) };
      } catch {
        return { ok: false };
      }
    }

    function renderJsonBlock(id, label, value, rawTextFallback) {
      let inner;
      if (value !== undefined && value !== null && typeof value === "object") {
        inner = `<pre class="json">${syntaxHighlight(value)}</pre>`;
      } else if (typeof rawTextFallback === "string" && rawTextFallback.length) {
        const parsed = tryParseJson(rawTextFallback);
        inner = parsed.ok
          ? `<pre class="json">${syntaxHighlight(parsed.value)}</pre>`
          : `<pre class="plain">${escapeHtml(rawTextFallback)}</pre>`;
      } else {
        inner = `<pre class="plain">(empty)</pre>`;
      }
      return `
        <details class="block" open>
          <summary>${label}</summary>
          <div class="json-wrap">
            <button class="copy-btn" data-copy-target="${id}">Copy</button>
            <div id="${id}">${inner}</div>
          </div>
        </details>`;
    }

    function durationClass(ms) {
      if (ms == null) return "";
      if (ms < 300) return "fast";
      if (ms < 1200) return "mid";
      return "slow";
    }

    function statusClass(status) {
      if (status == null) return "status-err";
      if (status >= 500) return "status-5xx";
      if (status >= 400) return "status-4xx";
      if (status >= 300) return "status-3xx";
      return "status-2xx";
    }

    function methodClass(method) {
      const m = (method || "").toUpperCase();
      return ["GET", "POST", "PUT", "PATCH", "DELETE"].includes(m)
        ? `method-${m}`
        : "method-DEFAULT";
    }

    function renderCall(c, idx) {
      const method = c.method || "?";
      const status = c.response ? c.response.status : null;
      const duration = c.duration_ms;
      const ts = c.timestamp ? new Date(c.timestamp).toLocaleString() : "";
      const idBase = `call-${idx}`;

      const errorBanner = c.error
        ? `<div class="error-banner">⚠ ${escapeHtml(c.error)}</div>`
        : "";

      const statusBadge = c.error
        ? `<span class="badge status-err">ERROR</span>`
        : `<span class="badge ${statusClass(status)}">${status ?? "?"}</span>`;

      const requestPanel = `
        <div class="panel">
          <div class="panel-title">Request</div>
          ${renderJsonBlock(`${idBase}-req-headers`, "Headers", c.request?.headers)}
          ${renderJsonBlock(`${idBase}-req-body`, "Body", undefined, c.request?.body)}
        </div>`;

      const responsePanel = c.response
        ? `
        <div class="panel">
          <div class="panel-title">Response</div>
          ${renderJsonBlock(`${idBase}-res-headers`, "Headers", c.response?.headers)}
          ${renderJsonBlock(`${idBase}-res-body`, "Body", undefined, c.response?.body)}
        </div>`
        : "";

      return `
        <div class="call">
          <div class="call-top">
            <span class="badge ${methodClass(method)}">${escapeHtml(method)}</span>
            ${statusBadge}
            ${duration != null ? `<span class="duration ${durationClass(duration)}">${duration} ms</span>` : ""}
            <span class="call-time">${ts}</span>
          </div>
          <div class="call-urls">
            <div class="uri-row">
              <span class="uri-label from">From</span>
              <span class="uri-value from">${escapeHtml(c.original_url || "")}</span>
            </div>
            <div class="uri-row">
              <span class="uri-label to">To</span>
              <span class="uri-value to">${escapeHtml(c.url || "")}</span>
            </div>
          </div>
          ${errorBanner}
          <div class="panels">
            ${requestPanel}
            ${responsePanel}
          </div>
        </div>`;
    }

    function renderStats(calls) {
      const total = calls.length;
      const ok = calls.filter(c => c.response && c.response.status < 400).length;
      const client = calls.filter(c => c.response && c.response.status >= 400 && c.response.status < 500).length;
      const failed = calls.filter(c => c.error || (c.response && c.response.status >= 500)).length;

      el("#stats").innerHTML = `
        <span class="stat-pill"><b>${total}</b> calls</span>
        <span class="stat-pill ok"><b>${ok}</b> 2xx/3xx</span>
        <span class="stat-pill warn"><b>${client}</b> 4xx</span>
        <span class="stat-pill err"><b>${failed}</b> errors/5xx</span>
      `;
    }

    function matchesFilter(c, query) {
      if (!query) return true;
      const q = query.toLowerCase();
      const haystack = [
        c.method, c.original_url, c.url,
        c.response ? String(c.response.status) : "",
        c.error || ""
      ].join(" ").toLowerCase();
      return haystack.includes(q);
    }

    function renderAll() {
      const query = el("#search").value.trim();
      const filtered = allCalls.filter(c => matchesFilter(c, query));
      renderStats(filtered);

      const container = el("#calls");
      if (allCalls.length === 0) {
        container.innerHTML = `<div class="empty">No calls logged yet — waiting for traffic through Alfred.</div>`;
        return;
      }
      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty">No calls match "${escapeHtml(query)}".</div>`;
        return;
      }
      container.innerHTML = filtered.map(renderCall).join("");

      if (expanded) {
        container.querySelectorAll("details.block").forEach(d => d.open = true);
      }
    }

    async function loadCalls() {
      const limit = el("#limit").value;
      try {
        const res = await fetch(`${BACKEND_URL}/calls?limit=${limit}`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        allCalls = await res.json();
        renderAll();
      } catch (err) {
        el("#calls").innerHTML = `<div class="error-box">Could not reach backend at ${escapeHtml(BACKEND_URL)}: ${escapeHtml(String(err))}</div>`;
      }
    }

    document.addEventListener("click", (e) => {
      const btn = e.target.closest(".copy-btn");
      if (!btn) return;
      const target = document.getElementById(btn.dataset.copyTarget);
      if (!target) return;
      navigator.clipboard.writeText(target.innerText).then(() => {
        const original = btn.textContent;
        btn.textContent = "Copied!";
        setTimeout(() => (btn.textContent = original), 1200);
      });
    });

    el("#search").addEventListener("input", renderAll);
    el("#limit").addEventListener("change", loadCalls);
    el("#refreshBtn").addEventListener("click", loadCalls);
    el("#toggleAllBtn").addEventListener("click", () => {
      expanded = !expanded;
      el("#toggleAllBtn").textContent = expanded ? "Collapse all" : "Expand all";
      document.querySelectorAll("details.block").forEach(d => d.open = expanded);
    });

    loadCalls();
    setInterval(loadCalls, 5000);
  </script>
</body>
</html>
