server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Angular client-side routing (e.g. /editor opened directly in a new tab
  # via window.open, not navigated to from within the already-loaded app)
  # needs every unmatched path to fall back to index.html so the router
  # can take over.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
