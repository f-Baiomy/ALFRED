server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # index.html must NEVER be served from cache without revalidating, because it is the only file
  # that names the content-hashed bundle (main-<HASH>.js). It used to be served with no
  # Cache-Control at all - just Last-Modified/ETag - which makes a browser fall back to HEURISTIC
  # caching (roughly 10% of the age since Last-Modified) and serve it without asking nginx. A stale
  # index.html pins the browser to the PREVIOUS bundle indefinitely, so a rebuilt frontend appears
  # to change nothing: confirmed live, with the container serving main-AWMJIZKU.js while the page
  # kept running main-4ZEWT52Q.js and a real bug fix looked unfixed. This costs one conditional
  # request per load, answered 304 from the ETag that is already there.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Runtime config, written at container start rather than build time - same reasoning as
  # index.html, and it must beat the immutable rule below (an exact-match location wins over a
  # regex one in nginx, regardless of order).
  location = /env.js {
    add_header Cache-Control "no-cache" always;
  }

  # Everything Angular emits with a content hash in its name. A new build produces a new filename,
  # so these can be cached hard and forever - and should be, since they are the large ones.
  location ~* \.(?:js|css|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|ico|webp)$ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Angular client-side routing (e.g. /view opened directly in a new tab
  # via window.open, not navigated to from within the already-loaded app)
  # needs every unmatched path to fall back to index.html so the router
  # can take over. The internal redirect re-runs location matching, so the
  # no-cache block above applies to the fallback too.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
