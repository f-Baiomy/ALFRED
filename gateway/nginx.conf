# Single public entrypoint for the whole app (frontend + backend) behind ONE origin, so a
# Cloudflare Tunnel pointed at this container's port is enough to hand the whole app to someone
# else - no second URL, no localhost, no CORS. Routes by path prefix: every prefix the backend
# actually serves (see each backend-* module's @RequestMapping/@GetMapping and the /ws/*
# WebSocketConfigurer registrations) goes to `backend`, everything else (the Angular SPA, its
# assets, env.js) goes to `frontend`. Both are reached by Docker service name over alfred-net,
# never by localhost or a host port.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Three SPA pages share their path with a backend prefix: /profiles, /interception, /settings.
# A reload or a pasted URL is a browser page load of exactly that path - send it to the SPA, or
# the user gets the backend's JSON (GET /profiles) or a 500 (no GET /interception). Told apart by
# the Accept header: a page load asks for text/html, the app's own API calls (HttpClient) never do.
map "$uri|$http_accept" $spa_page {
  default 0;
  "~^/(profiles|interception|settings)/?\|.*text/html" 1;
}

server {
  listen 80;
  server_name _;

  # Cloudflare Tunnel (and any other reverse proxy in front of this one) already sets these -
  # pass them through as-is instead of overwriting, so backend sees the real client IP/proto.
  # proxy_set_header only overrides what's given; a header cloudflared didn't set still gets a
  # sane default via the fallback $proxy_add_x_forwarded_for / $scheme below.
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-Host $host;

  client_max_body_size 50m;

  # Every REST prefix backend actually serves. Kept as one prefix per backend-* module rather
  # than a catch-all, so a future frontend-only route can never accidentally get proxied to a
  # backend that doesn't own it.
  location ~ ^/(calls|internal-calls|call-overlaps|comments|session-cycles|profiles|interception|redactions|settings|database|health|resend)(/|$) {
    if ($spa_page) {
      proxy_pass http://frontend:80;
    }
    proxy_pass http://backend:5000;
  }

  # WebSocket pushes (/ws/calls, /ws/internal-calls, /ws/session-cycles, /ws/profiles,
  # /ws/interception) - needs the Upgrade/Connection handshake headers and HTTP/1.1, and a long
  # read timeout since a socket can sit open with nothing to say for a while.
  location /ws/ {
    proxy_pass http://backend:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }

  # Everything else - the Angular SPA, its hashed assets, and env.js - served by the frontend
  # container's own nginx (frontend/nginx.conf owns its own caching rules; this just forwards).
  location / {
    proxy_pass http://frontend:80;
    proxy_http_version 1.1;
  }
}
