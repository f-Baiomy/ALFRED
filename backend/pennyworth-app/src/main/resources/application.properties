spring.application.name=pennyworth
server.port=5000

# Comma-separated list of allowed CORS origins, e.g. https://manor.example.com,https://manor-staging.example.com
# Defaults to "*" for the current single-team deployment; override via ALFRED_CORS_ALLOWED_ORIGINS.
alfred.cors.allowed-origins=*

# Storage backend per slice - "file" is the only implementation today (FileCallLogAdapter,
# JsonFileCommentsStoreAdapter). Both default to "file" even if left unset; these are here so the
# switch point is visible. A future Redis/MySQL adapter registers itself under a different
# havingValue (e.g. "redis") and gets selected by changing these, with no other code changes.
alfred.storage.calls.type=file
alfred.storage.comments.type=file
