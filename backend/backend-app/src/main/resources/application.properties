spring.application.name=backend
server.port=5000

# GET /calls and GET /session-cycles/{id}/calls return full request/response bodies for every
# call - routinely several hundred KB to a few MB uncompressed - and every open dashboard tab
# re-fetches one of these every 5s. gzip cuts that transfer size drastically (JSON text with
# repeated header/body content compresses very well) with no code change on either side, since
# Spring's embedded servlet container negotiates it automatically off the client's Accept-Encoding.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain
server.compression.min-response-size=1024

# Comma-separated list of allowed CORS origins, e.g. https://frontend.example.com,https://frontend-staging.example.com
# Defaults to "*" for the current single-team deployment; override via ALFRED_CORS_ALLOWED_ORIGINS.
alfred.cors.allowed-origins=*

# Storage backend per slice - "sqlite" is the default (SqliteCallsRepository/SqliteCallLogAdapter
# and their equivalents in the other four slices), since holding everything in memory the way the
# old "file" adapters did cannot scale to the 100GB-of-calls target. Set any of these to "file" to
# opt back into the old flat-JSON adapters (FileCallLogAdapter, JsonFileCommentsStoreAdapter,
# JsonFileSessionCycleMetadataStoreAdapter, JsonFileCapturedCallsStoreAdapter,
# JsonFileProfileStoreAdapter) - e.g. for a small deployment where inspecting the data with a text
# editor matters more than scale. A future Postgres/MySQL adapter registers itself under a
# different havingValue and gets selected by changing these, with no other code changes.
alfred.storage.calls.type=sqlite
alfred.storage.comments.type=sqlite
alfred.storage.session-cycles.type=sqlite
alfred.storage.profiles.type=sqlite
alfred.storage.filter-settings.type=sqlite

# Once calls.db exceeds this many bytes, SqliteCallsRepository deletes the oldest calls (by their
# own timestamp) until back under it - the actual mechanism behind the 100GB retention target.
# Default here is 100GB; override via ALFRED_CALLS_MAX_SIZE_BYTES.
alfred.storage.calls.max-size-bytes=${ALFRED_CALLS_MAX_SIZE_BYTES:107374182400}

# RECENT_CALLS.log is a ring buffer capped at this many calls - both the file's own trimming
# (FileCallLogAdapter) and the GET /calls?limit= clamp (CallsService) read this same property, so
# they can't drift out of sync. Override via RECENT_CALLS_MAX_LIMIT.
alfred.calls.max-limit=${RECENT_CALLS_MAX_LIMIT:200}

# Whether GET /calls and GET /session-cycles/{id}/calls actually page (respect the caller's
# offset/limit) or always return everything up to alfred.calls.max-limit in one response, still
# filtered/sorted either way. Disabled (false) reproduces the pre-pagination behavior exactly -
# the frontend needs no changes either way, since "Load more" simply finds nothing left to load
# when the first response already contains everything. Override via ALFRED_PAGINATION_ENABLED.
alfred.calls.pagination-enabled=${ALFRED_PAGINATION_ENABLED:false}

# Shared secret the proxy must send as X-Webhook-Secret on POST /calls/webhook. Blank (the
# default) means the webhook is open - set this (and the proxy's matching WEBHOOK_SECRET env var)
# for any deployment reachable outside a trusted docker network.
alfred.webhook.secret=${WEBHOOK_SECRET:}
