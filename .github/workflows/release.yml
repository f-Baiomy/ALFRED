# A release = a tag. `git tag -a v1.5.0 -m "Faster exports" && git push origin v1.5.0` builds both installers with
# build_dist.py (tests included) and publishes them, SHA256SUMS and latest.json as a GitHub Release. Installed
# Alfreds read .../releases/latest/download/latest.json (ALFRED_UPDATE_URL's default) once a day; the tag's
# annotation is the release notes they show. Free on a public repository (unlimited Actions minutes).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  installers:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # git describe needs the tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both installers
        run: python build_dist.py
      - name: The version the installers carry must be the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          test -f "dist/alfred-setup-${TAG}-linux-x64.run" || { echo "built version does not match tag ${GITHUB_REF_NAME}:"; ls dist; exit 1; }
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/alfred-setup-*-linux-x64.run dist/alfred-setup-*-windows-x64.exe dist/SHA256SUMS dist/latest.json \
            --title "Alfred ${GITHUB_REF_NAME#v}" --notes-from-tag --verify-tag
